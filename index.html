<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JS Тренажёр</title>
<style>
  :root {
    --bg: #16181c;
    --panel: #1f2226;
    --panel-2: #262a2f;
    --stripe-a: #ffb020;
    --stripe-b: #16181c;
    --text: #ece9e2;
    --text-dim: #8b9098;
    --accent: #ffb020;
    --teal: #48c9b0;
    --danger: #e5533d;
    --border: #33373d;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px 14px 28px;
  }

  .stripe {
    height: 8px;
    border-radius: 5px;
    background: repeating-linear-gradient(135deg, var(--stripe-a), var(--stripe-a) 10px, var(--stripe-b) 10px, var(--stripe-b) 20px);
    opacity: 0.9;
    flex-shrink: 0;
  }

  header {
    padding: 16px 2px 8px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }
  .sub { margin-top: 4px; font-size: 12px; color: var(--text-dim); }

  .streak {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    text-align: center;
    min-width: 62px;
  }
  .streak-num { font-size: 18px; font-weight: 800; color: var(--accent); line-height: 1; }
  .streak-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .streak.pulse { animation: pulse .35s ease; }
  @keyframes pulse { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 2px 4px; flex-shrink: 0; }
  .tab {
    flex: 1 1 auto; min-width: 0; padding: 9px 8px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim);
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
    cursor: pointer; transition: all .15s ease; position: relative;
  }
  .tab.active { background: var(--accent); color: #201400; border-color: var(--accent); }
  .tab.complete:not(.active) { border-color: var(--teal); color: var(--teal); }
  .tab .count { opacity: 0.75; font-weight: 600; margin-left: 2px; }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px 4px; flex-shrink: 0; }
  .progress-track { flex: 1; height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--accent)); border-radius: 4px; transition: width .25s ease; width: 0%; }
  .progress-label { font-size: 11.5px; color: var(--text-dim); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .card-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 2px; min-height: 340px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 20px 20px; min-height: 300px; display: flex; flex-direction: column;
    position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); font-weight: 800; margin-bottom: 10px; }
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.45; color: var(--text); }
  .q-text pre, .a-text pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 10px 0; font-size: 13px; }
  .q-text code, .a-text code { font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
  .q-text pre code, .a-text pre code { background: none; padding: 0; }
  .q-text code, .a-text code { background: rgba(255,176,32,0.12); color: #ffcf7a; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .a-text strong { color: var(--teal); }

  .answer-zone { margin-top: 16px; flex: 1; display: flex; flex-direction: column; position: relative; }

  .blur-hint {
    margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--panel-2);
    border: 1px dashed var(--border); color: var(--text-dim); font-size: 13px;
    text-align: center; letter-spacing: 0.2px; cursor: pointer;
  }

  .a-wrap { display: none; animation: reveal .25s ease; }
  .a-wrap.shown { display: block; }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .a-divider { height: 1px; background: repeating-linear-gradient(90deg, var(--accent), var(--accent) 6px, transparent 6px, transparent 12px); opacity: 0.5; margin: 4px 0 14px; }
  .a-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--teal); font-weight: 800; margin-bottom: 8px; }
  .a-text { font-size: 15.5px; line-height: 1.55; color: var(--text); }

  .nav-row { display: flex; gap: 10px; padding: 14px 2px 0; flex-shrink: 0; }
  .nav-btn {
    flex: 1; padding: 15px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-btn:active { transform: scale(0.98); }
  .nav-btn.forgot { background: rgba(229,83,61,0.12); border-color: var(--danger); color: #ff8b78; }
  .nav-btn.know { background: var(--teal); border-color: var(--teal); color: #062420; }
  .nav-btn.wide { flex: 1 1 100%; }

  .reset-row { text-align: center; padding-top: 12px; }
  .reset-link { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px; }

  /* CELEBRATION */
  .celebrate { text-align: center; padding: 30px 10px; display: none; }
  .celebrate.show { display: block; animation: reveal .3s ease; }
  .celebrate .big { font-size: 44px; margin-bottom: 6px; }
  .celebrate h2 { margin: 6px 0; font-size: 19px; }
  .celebrate p { color: var(--text-dim); font-size: 13px; margin: 4px 0 18px; }

  @media (max-width: 380px) {
    .q-text { font-size: 15.5px; }
    .a-text { font-size: 14.5px; }
  }

  /* MODE SWITCH */
  .mode-tabs { display: flex; gap: 8px; padding: 2px 2px 0; flex-shrink: 0; }
  .mode-tab {
    flex: 1; padding: 11px 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 13px; font-weight: 800;
    cursor: pointer; transition: all .15s ease;
  }
  .mode-tab.active { background: var(--accent); color: #201400; border-color: var(--accent); }

  /* PRACTICE */
  .practice-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--teal); font-weight: 800; margin-bottom: 10px; }
  .prompt-text { font-size: 15.5px; font-weight: 700; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
  .prompt-text pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .prompt-text code { font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; background: rgba(255,176,32,0.12); color: #ffcf7a; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .prompt-text pre code { background: none; padding: 0; }

  .code-editor {
    width: 100%; flex: 1; min-height: 130px; resize: vertical;
    background: #101214; color: #d9e6e2; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13.5px; line-height: 1.5; tab-size: 2; outline: none;
  }
  .code-editor:focus { border-color: var(--accent); }

  .feedback {
    margin-top: 10px; padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    display: none; word-break: break-word;
  }
  .feedback.show { display: block; animation: reveal .2s ease; }
  .feedback.ok { background: rgba(72,201,176,0.12); border: 1px solid var(--teal); color: #b6ede2; }
  .feedback.err { background: rgba(229,83,61,0.12); border: 1px solid var(--danger); color: #ffb3a5; }

  .solution-box {
    display: none; margin-top: 10px; padding: 11px 13px; border-radius: 10px;
    background: var(--panel-2); border: 1px dashed var(--border); font-size: 13px;
  }
  .solution-box.show { display: block; }
  .solution-box pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 0; font-size: 12.5px; }

  .practice-links { display: flex; justify-content: center; gap: 18px; padding-top: 10px; flex-wrap: wrap; }
  .practice-link { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }

  .run-btn {
    width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #201400; font-size: 14.5px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .run-btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div id="app">
  <div class="stripe"></div>
  <header>
    <div>
      <h1>⚙️ JS Тренажёр</h1>
      <div class="sub" id="modeSub">📚 Тапни по карточке — открой ответ. Оцени себя честно.</div>
    </div>
    <div class="streak" id="streakBox">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">🔥 стрик</div>
    </div>
  </header>

  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="theory">📚 Теория</button>
    <button class="mode-tab" data-mode="practice">💻 Практика</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <div class="card-zone">
    <div class="card" id="cardView">
      <div class="card-eyebrow" id="cardEyebrow">БЛОК · 1 / 25</div>
      <div class="q-text" id="qText"></div>
      <div class="answer-zone">
        <div class="blur-hint" id="blurHint">🔒 Тапни, чтобы увидеть ответ</div>
        <div class="a-wrap" id="aWrap">
          <div class="a-divider"></div>
          <div class="a-label">Ответ</div>
          <div class="a-text" id="aText"></div>
        </div>
      </div>
    </div>

    <div class="card" id="practiceView" style="display:none;">
      <div class="practice-eyebrow" id="practiceEyebrow">БЛОК · ЗАДАЧА 1 / 6</div>
      <div class="prompt-text" id="promptText"></div>
      <textarea class="code-editor" id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="feedback" id="feedback"></div>
      <div class="solution-box" id="solutionBox"></div>
    </div>

    <div class="celebrate" id="celebrate">
      <div class="big">🎉</div>
      <h2>Блок пройден!</h2>
      <p id="celebrateStats"></p>
    </div>

    <div class="celebrate" id="celebratePractice">
      <div class="big">🏆</div>
      <h2>Все задачи решены!</h2>
      <p id="celebratePracticeStats"></p>
    </div>
  </div>

  <div class="nav-row" id="navRow">
    <button class="nav-btn forgot" id="forgotBtn" style="display:none;">😵 Забыл</button>
    <button class="nav-btn know" id="knowBtn" style="display:none;">💪 Знаю</button>
    <button class="nav-btn wide" id="againBtn" style="display:none;">🔁 Пройти блок ещё раз</button>
  </div>

  <div class="nav-row" id="practiceNavRow" style="display:none;">
    <button class="run-btn" id="runBtn">▶ Проверить код</button>
    <button class="nav-btn wide" id="againPracticeBtn" style="display:none;">🔁 Пройти блок ещё раз</button>
  </div>
  <div class="practice-links" id="practiceLinks" style="display:none;">
    <button class="practice-link" id="skipBtn">Пропустить задачу →</button>
    <button class="practice-link" id="solutionBtn">Показать решение</button>
    <button class="practice-link" id="restartCodeBtn">Начать код заново</button>
  </div>

  <div class="reset-row" id="resetRow"><button class="reset-link" id="resetBtn">Сбросить прогресс этого блока</button></div>
</div>

<script id="cards-data" type="application/json">[{"title": "📗 БЛОК 17. ЦИКЛЫ (Loops)", "cards": [{"q": "**Что такое цикл простыми словами?**", "a": "Конструкция, которая повторяет один и тот же код несколько раз («сделай одно и то же много раз»)."}, {"q": "**Зачем вообще нужны циклы, если можно писать код руками несколько раз?**", "a": "Чтобы не дублировать код: повторять действия, обрабатывать списки данных, автоматизировать однотипные операции."}, {"q": "**Что выведет код?**\n```js\nfor (let i = 0; i < 3; i++) {\n  console.log(i);\n}\n```", "a": "`0 1 2` (i начинается с 0, условие i<3, после каждого шага +1)"}, {"q": "**Напиши синтаксис цикла `for` (общий вид, без конкретного примера).**", "a": "```js\nfor (инициализация; условие; изменение) {\n  код\n}\n```"}, {"q": "**Какие 3 части разделены точкой с запятой в `for (...)`? И в каком порядке выполняются на каждом шаге?**", "a": "Инициализация → условие → тело цикла → изменение счётчика → снова условие... Порядок: 1) создать переменную, 2) проверить условие, 3) выполнить код, 4) изменить переменную, 5) повтор."}, {"q": "**Когда лучше использовать `for`, а не `while`?**", "a": "Когда заранее известно количество повторений и/или нужен контроль над индексом."}, {"q": "**Что выведет?**\n```js\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n  i++;\n}\n```", "a": "`0 1 2 3 4`"}, {"q": "**Когда стоит выбрать `while`, а не `for`?**", "a": "Когда заранее неизвестно точное количество повторений — важно только условие остановки."}, {"q": "**В чём главное отличие `do...while` от `while`?**", "a": "`do...while` выполнит тело цикла **минимум один раз**, даже если условие сразу ложно. `while` может не выполниться ни разу."}, {"q": "**Сколько раз выполнится этот код?**\n```js\nlet i = 10;\ndo {\n  console.log(i);\n  i++;\n} while (i < 5);\n```", "a": "1 раз (выведет `10`). Тело выполняется хотя бы один раз, а условие проверяется уже после."}, {"q": "**Для чего используется `for...of` и что он НЕ даёт тебе напрямую (в отличие от обычного `for`)?**", "a": "`for...of` перебирает элементы массива (значения). Он не даёт индекс напрямую — просто «иди по всем элементам»."}, {"q": "**Что выведет?**\n```js\nlet fruits = [\"Apple\", \"Banana\", \"Orange\"];\nfor (let fruit of fruits) {\n  console.log(fruit);\n}\n```", "a": "`Apple`, `Banana`, `Orange` — каждое на новой строке."}, {"q": "**НАЙДИ ОШИБКУ. Что не так в этом коде и что произойдёт?**\n```js\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n}\n```", "a": "Забыли изменить `i` внутри цикла (нет `i++`). Условие `i < 5` всегда истинно → **бесконечный цикл**, программа зависает."}, {"q": "**НАЙДИ ОШИБКУ. Что подозрительно в этом коде?**\n```js\nlet arr = [1, 2, 3];\nfor (let i = 0; i <= arr.length; i++) {\n  console.log(arr[i]);\n}\n```", "a": "Условие `i <= arr.length` вместо `i < arr.length` — цикл выйдет за пределы массива, последним выведется `undefined`."}, {"q": "**Что выведет этот классический баг-пример на бесконечный цикл?**\n```js\nwhile (true) {\n}\n```", "a": "Ничего не выведет, но программа зависнет навсегда — классический бесконечный цикл без условия выхода."}, {"q": "**Что выведет код (обработка массива через цикл)?**\n```js\nlet prices = [100, 200, 300];\nlet total = 0;\nfor (let i = 0; i < prices.length; i++) {\n  total = total + prices[i];\n}\nconsole.log(\"Total: \" + total);\n```", "a": "`Total: 600`"}, {"q": "**Что выведет этот код с `for...of` (тот же смысл, но проще)?**\n```js\nlet prices = [100, 200, 300];\nlet total = 0;\nfor (let price of prices) {\n  total = total + price;\n}\nconsole.log(total);\n```", "a": "`600`"}, {"q": "**Что выведет и почему возникнет ошибка?**\n```js\nfor (let j = 0; j < 3; j++) {\n  console.log(j);\n}\nconsole.log(j);\n```", "a": "Выведет `0 1 2`, а потом `ReferenceError: j is not defined` — переменная `j`, объявленная через `let` в `for`, живёт только внутри цикла (локальная область видимости)."}, {"q": "**Что выведет этот цикл с шагом умножения?**\n```js\nfor (let j = 2; j < 20; j *= 2) {\n  console.log(j);\n}\n```", "a": "`2 4 8 16` (2→4→8→16→32, но 32 уже не < 20, стоп)"}, {"q": "**Разница между `n++` и `++n` — что выведет?**\n```js\nlet n = 9;\nconsole.log(n++);\nconsole.log(n);\nconsole.log(++n);\n```", "a": "`9` (постфиксный — сначала возвращает старое значение, потом увеличивает), затем `10`, затем `11` (префиксный — сначала увеличивает, потом возвращает)."}, {"q": "**Что выведет цикл `for...of` по массиву, если внутри пытаться менять элемент через переменную цикла?**\n```js\nlet fruits = [\"banana\", \"apple\"];\nfor (let fruit of fruits) {\n  fruit = fruit + \"!\";\n}\nconsole.log(fruits);\n```", "a": "`[\"banana\", \"apple\"]` — массив НЕ изменится. `fruit` — это копия значения, а не ссылка на ячейку массива."}, {"q": "**НАЙДИ ОШИБКУ. Почему здесь `res` вызовет ошибку после цикла?**\n```js\nlet number = 2;\nwhile (number < 10) {\n  let res = number % 2 === 0 ? \"even\" : \"odd\";\n  number *= 2;\n}\nconsole.log(res);\n```", "a": "`res` объявлена через `let` внутри тела цикла → область видимости только внутри блока `{}`. Снаружи — `ReferenceError`."}, {"q": "**Как выбрать между 4 видами циклов? Заполни правило:**\n`for` → ___, `while` → ___, `do...while` → ___, `for...of` → ___", "a": "`for` → известно количество / нужен индекс. `while` → зависит от условия, число повторов неизвестно. `do...while` → нужно выполнить хотя бы 1 раз. `for...of` → простой перебор массива без индекса."}, {"q": "**Что выведет цикл с `i+=1` в стиле \"python-way\", если писать в JS?**\n```js\nfor (let i = 0; i < 5; i += 1) {\n  console.log(\"Hello\");\n}\n```", "a": "5 раз выведет `Hello` — `i += 1` эквивалентно `i++` по эффекту."}, {"q": "**Что покажет дебаггер по переменной `i` при выполнении этого цикла (последовательность значений)?**\n```js\nfor (let i = 0; i < 3; i++) {\n  console.log(i);\n}\n```", "a": "`i → 0 → 1 → 2` (после 2 условие `i<3` становится ложным, цикл останавливается на i=3, но код внутри уже не выполняется)"}]}, {"title": "📘 БЛОК 18. ФУНКЦИИ (Functions)", "cards": [{"q": "**Что такое функция простыми словами?**", "a": "Блок кода, который выполняет определённую задачу — «команда с именем», которую можно вызвать."}, {"q": "**Выполнится ли этот код сам по себе, без дополнительного вызова?**\n```js\nfunction sayHello() {\n  console.log(\"Hello\");\n}\n```", "a": "Нет. Код внутри функции не выполняется, пока функцию не вызовут явно: `sayHello();`"}, {"q": "**Что выведет?**\n```js\nfunction sayHello() {\n  console.log(\"Hello\");\n}\nsayHello;\n```", "a": "Ничего не выведет! `sayHello;` без скобок — это просто ссылка на функцию, а не вызов. Нужно `sayHello();`"}, {"q": "**В чём разница между параметром и аргументом?**", "a": "Параметр — переменная в объявлении функции («какая переменная»). Аргумент — реальное значение при вызове («какое значение»)."}, {"q": "**В коде `function greet(name) {...}` и вызове `greet(\"Ivan\")` — что здесь параметр, а что аргумент?**", "a": "`name` — параметр (формальный, в объявлении). `\"Ivan\"` — аргумент (реальное значение при вызове)."}, {"q": "**Что выведет?**\n```js\nfunction sum(a, b) {\n  return a + b;\n}\nlet result = sum(2, 3);\nconsole.log(result);\n```", "a": "`5`"}, {"q": "**Что делает `return` в функции? (2 вещи)**", "a": "1) Завершает выполнение функции. 2) Возвращает значение туда, откуда функцию вызвали."}, {"q": "**НАЙДИ ОШИБКУ. Что вернёт эта функция и что выведется?**\n```js\nfunction sum(a, b) {\n  a + b;\n}\nconsole.log(sum(2, 3));\n```", "a": "`undefined`. Забыли `return` — функция без return всегда возвращает `undefined`, даже если внутри что-то вычисляется."}, {"q": "**Что выведет вызов с недостаточным числом аргументов?**\n```js\nfunction sum(a, b) {\n  return a + b;\n}\nconsole.log(sum(2));\n```", "a": "`NaN`. `b` будет `undefined`, а `2 + undefined = NaN`."}, {"q": "**Что такое сигнатура функции?**", "a": "Имя функции + список параметров. Например, в `function sum(a, b)` сигнатура — это `sum(a, b)`."}, {"q": "**Что такое контракт функции? Приведи пример на `function sum(a, b) { return a + b; }`**", "a": "Контракт — что функция принимает, что делает и что возвращает. Для sum: принимает два числа → возвращает их сумму."}, {"q": "**Какие имена функций хорошие, а какие плохие? Дай по 2 примера каждого.**", "a": "Хорошие (понятный глагол+смысл): `calculateTotal()`, `getUserName()`. Плохие (непонятно что делают): `f()`, `x()`, `doIt()`."}, {"q": "**Что выведет?**\n```js\nfunction calculateTotal(price, quantity) {\n  return price * quantity;\n}\nlet total = calculateTotal(100, 3);\nconsole.log(\"Total: \" + total);\n```", "a": "`Total: 300`"}, {"q": "**Зачем нужны функции — назови 3 причины.**", "a": "1) Не дублировать код. 2) Разбивать программу на части. 3) Улучшать читаемость кода."}, {"q": "**Что покажет дебаггер (значения a, b, result) для этого кода?**\n```js\nfunction sum(a, b) {\n  return a + b;\n}\nlet result = sum(2, 3);\n```", "a": "`a → 2`, `b → 3`, `result → 5`"}, {"q": "**Чем отличается функция с `return` от функции без `return` в таблице \"что можно/нельзя\"?**", "a": "С return: возвращает значение → можно использовать/сохранить результат. Без return: просто выполняет действие → нельзя сохранить результат (будет undefined)."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с вызовом функции?**\n```js\nfunction greet(name) {\n  console.log(\"Hello, \" + name);\n}\ngreet(\"Ivan\");\ngreet(\"Maria\");\nconsole.log(name);\n```", "a": "`name` — параметр функции, существует только внутри `greet`. За пределами функции вызовет `ReferenceError: name is not defined`."}, {"q": "**Что выведет код с объектом и `for...in`?**\n```js\nconst user = { id: 7, name: \"John\", age: 25 };\nfor (let key in user) {\n  console.log(key, user[key]);\n}\n```", "a": "```\nid 7\nname John\nage 25\n```\n`for...in` перебирает КЛЮЧИ объекта (не значения напрямую)."}, {"q": "**Как получить доступ к свойству объекта с пробелом в названии, например `\"is Admin\"`? Почему `user.is Admin` не сработает?**", "a": "Через квадратные скобки: `user[\"is Admin\"]`. Точечная нотация не работает с пробелами/спецсимволами в имени свойства — это синтаксическая ошибка."}, {"q": "**Что выведет, если случайно перепутать `for...in` с `for...of` на массиве?**\n```js\nconst fruits = [\"apple\", \"kiwi\", \"banana\"];\nfor (let i in fruits) {\n  console.log(i, fruits[i]);\n}\n```", "a": "```\n0 apple\n1 kiwi\n2 banana\n```\nТехнически сработает (потому что индексы массива — это тоже \"ключи\"), но `for...in` для массивов — плохая практика: `i` здесь строка \"0\",\"1\",\"2\", а не число, и есть риск получить лишние свойства."}, {"q": "**Почему в примере `greet(\"Ivan\"); greet(\"Maria\");` функция — это \"гибкость\", а два отдельных `console.log(\"Hello, Ivan\")` и `console.log(\"Hello, Maria\")` — нет?**", "a": "Функция описывает логику ОДИН раз, а данные (имя) передаются каждый раз разные через параметр. Без функции пришлось бы копировать код заново под каждое имя."}, {"q": "**Дополни правило именования: как должно называться имя функции, чтобы код был понятным?**", "a": "Имя должно объяснять, что именно делает функция, обычно начинается с глагола: `calculateX`, `getY`, `printZ`."}, {"q": "**Что выведет вызов функции без аргументов там, где параметр обязателен?**\n```js\nfunction printSum(a, b) {\n  console.log(a + b);\n}\nprintSum();\n```", "a": "`NaN` — оба параметра `undefined`, `undefined + undefined = NaN`."}, {"q": "**Функция `printSum` из прошлой карточки ничего не возвращает через return. Можно ли сохранить её результат в переменную?**\n```js\nlet x = printSum(2, 3);\nconsole.log(x);\n```", "a": "Нет полезного результата: `x` будет `undefined`, потому что `printSum` не использует `return`, а просто делает `console.log`."}, {"q": "**Собери по памяти: 5 главных выводов темы \"Функции\".**", "a": "1) Функция — переиспользуемый блок кода. 2) Параметры — переменные, аргументы — значения. 3) Есть функции с return и без. 4) Сигнатура = имя + параметры, контракт = поведение. 5) Хорошие имена делают код понятным."}]}, {"title": "📙 БЛОК 19. МЕТОДЫ МАССИВОВ: map / filter / reduce", "cards": [{"q": "**Что делает метод `map`? Одним предложением.**", "a": "Преобразует КАЖДЫЙ элемент массива и возвращает новый массив той же длины."}, {"q": "**Что выведет?**\n```js\nlet numbers = [1, 2, 3];\nlet result = numbers.map(function (num) {\n  return num * 2;\n});\nconsole.log(result);\n```", "a": "`[2, 4, 6]`"}, {"q": "**Что делает метод `filter`? Одним предложением.**", "a": "Оставляет только те элементы, которые подходят под условие (может вернуть массив короче исходного)."}, {"q": "**Что выведет?**\n```js\nlet numbers = [1, 2, 3, 4];\nlet result = numbers.filter(function (num) {\n  return num > 2;\n});\nconsole.log(result);\n```", "a": "`[3, 4]`"}, {"q": "**Что делает метод `reduce`? Что означает `acc` и что означает второй аргумент (например `0`)?**", "a": "`reduce` сводит весь массив к ОДНОМУ значению. `acc` — накопитель (промежуточный результат), второй аргумент функции reduce — стартовое значение накопителя."}, {"q": "**Что выведет?**\n```js\nlet numbers = [1, 2, 3];\nlet sum = numbers.reduce(function (acc, num) {\n  return acc + num;\n}, 0);\nconsole.log(sum);\n```", "a": "`6`"}, {"q": "**Чем `find` отличается от `filter` по результату?**", "a": "`find` возвращает только ПЕРВЫЙ подходящий элемент (или undefined, если нет). `filter` возвращает МАССИВ всех подходящих элементов."}, {"q": "**Что выведет?**\n```js\nlet numbers = [1, 2, 3, 4];\nlet result = numbers.find(function (num) {\n  return num > 2;\n});\nconsole.log(result);\n```", "a": "`3` (первый элемент больше 2, не массив, а само значение)"}, {"q": "**Разница между `some` и `every`?**", "a": "`some` — true, если ХОТЯ БЫ ОДИН элемент подходит под условие. `every` — true, только если ВСЕ элементы подходят."}, {"q": "**Что выведет?**\n```js\nlet numbers = [1, 2, 3];\nconsole.log(numbers.some(function (n) { return n > 2; }));\nconsole.log(numbers.every(function (n) { return n > 0; }));\nconsole.log(numbers.every(function (n) { return n > 2; }));\n```", "a": "`true`, `true`, `false` (не все элементы больше 2)"}, {"q": "**Чем `forEach` принципиально отличается от `map`?**", "a": "`forEach` просто выполняет действие для каждого элемента и НЕ возвращает новый массив (возвращает `undefined`). `map` возвращает новый преобразованный массив."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с этим кодом, если хотели получить новый массив?**\n```js\nlet numbers = [1, 2, 3];\nlet doubled = numbers.forEach(function (num) {\n  return num * 2;\n});\nconsole.log(doubled);\n```", "a": "`doubled` будет `undefined`. Нужно использовать `map`, а не `forEach` — `forEach` не собирает результаты в новый массив."}, {"q": "**Что делает `sort`? Есть ли у него побочный эффект?**", "a": "Сортирует массив. Важно: **изменяет исходный массив** (мутирует его), а не создаёт новый."}, {"q": "**НАЙДИ ОШИБКУ. Почему результат может быть \"неправильным\"?**\n```js\nlet numbers = [10, 2, 1];\nnumbers.sort();\nconsole.log(numbers);\n```", "a": "Выведет `[1, 10, 2]` — без функции сравнения `sort()` сортирует как СТРОКИ (по алфавиту символов), а не как числа. Нужно: `numbers.sort((a, b) => a - b)`."}, {"q": "**Что такое \"цепочка методов\" (chaining)? Что делает этот код по шагам?**\n```js\nlet numbers = [1, 2, 3, 4, 5];\nlet result = numbers\n  .filter(function (num) { return num > 2; })\n  .map(function (num) { return num * 2; });\n```", "a": "Сначала `filter` оставляет `[3, 4, 5]`, потом `map` умножает каждый на 2 → результат `[6, 8, 10]`. Методы вызываются один за другим на результате предыдущего."}, {"q": "**Что выведет этот практический пример с объектами?**\n```js\nlet products = [\n  { name: \"Phone\", price: 300 },\n  { name: \"Laptop\", price: 1000 },\n  { name: \"Tablet\", price: 500 }\n];\nlet result = products\n  .filter(function (p) { return p.price > 400; })\n  .map(function (p) { return p.name; });\nconsole.log(result);\n```", "a": "`[\"Laptop\", \"Tablet\"]` (Phone отфильтровался, т.к. 300 не больше 400)"}, {"q": "**НАЙДИ ОШИБКУ. Что вернёт `map`, если забыть `return` внутри колбэка?**\n```js\nlet numbers = [1, 2, 3];\nlet result = numbers.map(function (num) {\n  num * 2;\n});\nconsole.log(result);\n```", "a": "`[undefined, undefined, undefined]` — без `return` колбэк ничего не возвращает для каждого элемента."}, {"q": "**Зачем вообще нужны методы массива (map/filter/etc), если есть циклы `for`?**", "a": "Код становится короче, понятнее и с меньшим числом ошибок — не нужно вручную создавать индекс и промежуточный массив."}, {"q": "**Что означает порядок в цепочке `.filter().map()` — можно ли поменять местами без последствий?**", "a": "Не всегда! Порядок методов важен: сначала фильтруем нужные элементы, потом преобразуем. Если поменять местами (map потом filter), логика фильтрации может измениться (фильтр будет проверять уже преобразованные значения)."}, {"q": "**Реши в уме: что выведет?**\n```js\nlet nums = [5, 10, 15, 20];\nlet result = nums\n  .filter(n => n >= 10)\n  .reduce((acc, n) => acc + n, 0);\nconsole.log(result);\n```", "a": "`45` (фильтр оставляет `[10, 15, 20]`, reduce суммирует: 10+15+20=45)"}, {"q": "**Сопоставь метод → что возвращает: map, filter, reduce, find, some/every, forEach.**", "a": "map → новый массив (преобразованный). filter → новый массив (отфильтрованный). reduce → одно значение. find → один элемент (или undefined). some/every → true/false. forEach → undefined (просто побочный эффект)."}, {"q": "**Что выведет, если в массиве нет подходящего элемента для `find`?**\n```js\nlet numbers = [1, 2, 3];\nlet result = numbers.find(function (n) { return n > 10; });\nconsole.log(result);\n```", "a": "`undefined`"}, {"q": "**Реши в уме: что выведет?**\n```js\nlet words = [\"hi\", \"hello\", \"hey\"];\nlet lengths = words.map(w => w.length);\nconsole.log(lengths);\n```", "a": "`[2, 5, 3]`"}, {"q": "**НАЙДИ ОШИБКУ. Логически что здесь странно, даже если кода без синтаксических ошибок?**\n```js\nlet numbers = [1, 2, 3];\nnumbers.filter(function (n) { return n * 2; });\nconsole.log(numbers);\n```", "a": "Результат `filter` никуда не сохранён (нет `let result = ...`), а сам исходный массив `numbers` не меняется — filter не мутирует массив. Плюс колбэк возвращает `n * 2`, а не булево условие — filter оставит все элементы, где `n*2` не равно 0/false (то есть почти все)."}, {"q": "**Собери по памяти: назови все 8 методов массива из этого урока и их суть одним словом.**", "a": "map → преобразование, filter → фильтрация, reduce → сведение к одному значению, find → первый подходящий, some → есть хотя бы один, every → все ли подходят, forEach → перебор (без результата), sort → сортировка (мутирует массив)."}]}, {"title": "📕 БЛОК 20. РАБОТА С API (HTTP, REST, fetch/axios)", "cards": [{"q": "**Что такое API одним предложением?**", "a": "Способ, с помощью которого программы общаются друг с другом — «интерфейс для запроса данных»."}, {"q": "**Что такое HTTP?**", "a": "Протокол передачи данных между клиентом (твоей программой) и сервером (внешним сервисом)."}, {"q": "**Нарисуй в голове схему: кто кому что отправляет — request и response?**", "a": "Клиент → отправляет request (запрос) → Сервер. Сервер → отправляет response (ответ) → обратно клиенту."}, {"q": "**Назови 4 основные части HTTP-запроса.**", "a": "URL (адрес), Method (тип запроса), Headers (доп. информация), Body (данные, обычно для POST)."}, {"q": "**Какие есть основные HTTP-методы и что каждый означает?**", "a": "GET → получить данные. POST → отправить данные. PUT → обновить данные. DELETE → удалить данные."}, {"q": "**Что такое REST одним предложением?**", "a": "Стиль построения API, где URL = ресурс, а метод (GET/POST/...) = действие над этим ресурсом."}, {"q": "**По REST-конвенции: что делает `GET /users`, а что `POST /users`?**", "a": "`GET /users` → получить список пользователей. `POST /users` → создать нового пользователя."}, {"q": "**Что делает `fetch` в общих чертах?**", "a": "Встроенный (не нужно ничего устанавливать) способ отправки HTTP-запросов из JavaScript."}, {"q": "**НАЙДИ ОШИБКУ. Чего не хватает / что забыли в первом `.then`?**\n```js\nfetch(\"https://jsonplaceholder.typicode.com/posts\")\n  .then(function (response) {\n    console.log(response);\n  })\n  .then(function (data) {\n    console.log(data);\n  });\n```", "a": "Забыли `return response.json();` в первом `.then`. Без этого второй `.then` получит `undefined`, а не распарсенные данные."}, {"q": "**Как правильно получить и вывести данные через fetch (напиши структуру по памяти)?**", "a": "```js\nfetch(url)\n  .then(function (response) {\n    return response.json();\n  })\n  .then(function (data) {\n    console.log(data);\n  });\n```"}, {"q": "**Как отправить POST-запрос через `fetch`? Какие 3 поля нужны в объекте настроек?**", "a": "`method: \"POST\"`, `headers: { \"Content-Type\": \"application/json\" }`, `body: JSON.stringify({...})`."}, {"q": "**Чем `axios` отличается от `fetch` по установке?**", "a": "`fetch` встроен в JavaScript, ничего устанавливать не нужно. `axios` — внешняя библиотека, нужно ставить через `npm install axios`."}, {"q": "**В чём разница синтаксиса: `fetch` требует `.json()`, а `axios` сразу даёт что?**", "a": "В axios данные сразу доступны через `response.data` — не нужно вызывать `.json()` вручную, как в fetch."}, {"q": "**Что выведет этот код на axios?**\n```js\nconst axios = require(\"axios\");\naxios.get(\"https://jsonplaceholder.typicode.com/posts\")\n  .then(function (response) {\n    console.log(response.data);\n  });\n```", "a": "Массив постов (данные), полученные с сервера — доступ именно через `response.data`."}, {"q": "**Заполни таблицу fetch vs axios: что встроено, что удобнее?**", "a": "fetch: встроен в JS, но требует больше кода (ручная обработка .json()). axios: нужно устанавливать отдельно, но синтаксис проще и удобнее."}, {"q": "**НАЙДИ ОШИБКУ. Что перепутано в этом коде на axios?**\n```js\naxios.get(\"https://jsonplaceholder.typicode.com/posts\")\n  .then(function (response) {\n    console.log(response.json());\n  });\n```", "a": "`.json()` — это метод от `fetch`, а не от `axios`! В axios данные уже готовы в `response.data`, вызывать `.json()` не нужно (и вызовет ошибку)."}, {"q": "**Как связаны функции и работа с API? Приведи структуру обёртки.**", "a": "Часто fetch/axios оборачивают в функцию для переиспользования: `function loadData() { fetch(...) }`, потом просто вызывают `loadData()`."}, {"q": "**Как отправить POST-запрос через `axios` — что передаётся вторым аргументом?**", "a": "```js\naxios.post(url, { title: \"Hello\", body: \"World\" })\n  .then(function (response) {\n    console.log(response.data);\n  });\n```\nВторой аргумент — сразу объект с данными (без JSON.stringify и headers, в отличие от fetch)."}, {"q": "**Назови 4 частые ошибки при работе с API из этого урока.**", "a": "1) Забыли `return response.json()`. 2) Неправильный URL. 3) Не указали headers в POST. 4) Перепутали `response` и `response.data` в axios."}, {"q": "**Практический пример: что делает эта функция по шагам?**\n```js\nfunction loadPosts() {\n  fetch(\"https://jsonplaceholder.typicode.com/posts\")\n    .then(function (response) {\n      return response.json();\n    })\n    .then(function (data) {\n      console.log(\"Posts:\", data);\n    });\n}\nloadPosts();\n```", "a": "1) Вызывает `loadPosts()`. 2) Отправляет GET-запрос на URL. 3) Получает ответ, парсит его в JSON. 4) Выводит данные в консоль с подписью \"Posts:\"."}, {"q": "**Как объяснить API через аналогию с рестораном?**", "a": "Официант передаёт ваш заказ (запрос) на кухню и приносит готовое блюдо (ответ) — так же API принимает запрос и возвращает нужные данные, будучи посредником между клиентом и сервером."}, {"q": "**В трёхзвенной схеме урока — кто «Клиент», кто «API» и кто «Сервер»?**", "a": "Клиент — браузер или приложение, которое делает запрос. API — посредник, который принимает запрос и знает, как его обработать. Сервер — база данных или сервис, который в итоге возвращает ответ."}, {"q": "**Почему в схеме `request → response` говорят, что «сервер никогда не отвечает первым»?**", "a": "Общение похоже на SMS-переписку: сначала клиент отправляет вопрос (request), и только после этого сервер присылает ответ (response). Сервер не может «написать» первым — у него нет повода, пока не пришёл запрос."}, {"q": "**Что обычно передают в `Headers` запроса? Приведи 2 примера.**", "a": "Метаданные запроса — например, тип контента (`Content-Type: application/json`) и токен авторизации (`Authorization: Bearer ...`)."}, {"q": "**В каких методах обычно используется `Body` запроса и что в нём лежит?**", "a": "В `POST` и `PUT` — там передаются данные, которые нужно создать или обновить на сервере. В `GET`-запросах body, как правило, не нужен — все данные уже в URL."}, {"q": "**Заполни REST-таблицу полностью: что делают GET, POST, PUT и DELETE?**", "a": "GET — получить данные. POST — создать запись. PUT — обновить запись. DELETE — удалить запись."}, {"q": "**Как расшифровывается REST и что это означает простыми словами?**", "a": "REST — Representational State Transfer. Это подход к проектированию API, где данные (ресурсы) представляются в определённом виде, а работа с ними идёт через стандартные HTTP-методы — предсказуемо и понятно."}, {"q": "**Урок сравнивает HTTP с чем-то привычным. С чем именно и почему?**", "a": "С языком, на котором «говорят» компьютеры в интернете. Без общего протокола программы не смогли бы «понять» друг друга — как люди без общего языка."}, {"q": "**По совету урока — когда лучше взять `fetch`, а когда `axios`?**", "a": "Для большинства учебных проектов `fetch` — отличный старт: он встроен в браузер и не требует установки. `Axios` пригодится в реальных проектах с более сложной логикой и обработкой ошибок."}, {"q": "**Зачем в цепочке `fetch(...).then(...).catch(...)` обязательно нужен `.catch`?**\n```js\nfetch(\"https://jsonplaceholder.typicode.com/users\")\n  .then(response => response.json())\n  .then(data => console.log(data));\n```", "a": "В этом коде `.catch` отсутствует — если сервер недоступен или произойдёт ошибка сети, программа получит необработанный (unhandled) reject промиса. `.catch(error => ...)` перехватывает именно такие ошибки соединения или обработки."}, {"q": "**Собери по памяти: 3 главных вывода занятия «Работа с API».**", "a": "1) API — интерфейс для взаимодействия программ через интернет. 2) HTTP — протокол передачи запросов и ответов между клиентом и сервером. 3) `fetch`/`axios` — удобные инструменты JavaScript для работы с внешними API."}, {"q": "**НАЙДИ ОШИБКУ. Чем `PUT /users/5` отличается от `POST /users`, если оба «отправляют данные»?**", "a": "Это не одно и то же: `POST /users` создаёт новую запись (сервер сам придумает id), а `PUT /users/5` обновляет уже существующую запись с конкретным id. Путать их — частая ошибка."}, {"q": "**Что в примере `https://api.example.com/users` называют «ресурсом»?**", "a": "`users` — это ресурс, к которому обращается запрос. URL — адрес ресурса, к которому мы обращаемся, а сам ресурс обычно называется существительным в конце пути."}, {"q": "**Почему `Headers` и `Body` — это разные части запроса, а не одно и то же?**", "a": "`Headers` — метаданные запроса (тип контента, авторизация и т.д.), они не являются самими данными. `Body` — это и есть тело запроса, то есть сами данные, которые отправляются (актуально для `POST`/`PUT`)."}, {"q": "**НАЙДИ ОШИБКУ. Что перепутано в этом axios-запросе?**\n```js\naxios.post(\"https://jsonplaceholder.typicode.com/posts\")\n  .then(function (response) {\n    console.log(response.data);\n  });\n```", "a": "В `axios.post(url, ...)` вторым аргументом должны идти данные для отправки (объект). Здесь их забыли — сервер получит `POST`-запрос без тела, хотя именно в этом весь смысл `POST`."}, {"q": "**Что произойдёт, если отправить JSON через `fetch` в `POST`, но забыть header `Content-Type: application/json`?**", "a": "Сервер может не понять, что тело запроса — это JSON, и попытается прочитать его иначе. Поэтому при отправке JSON в `POST`/`PUT` всегда явно указывают `headers: { \"Content-Type\": \"application/json\" }`."}]}, {"title": "📔 БЛОК 21. ОБРАБОТКА ОТВЕТОВ API (включая AI)", "cards": [{"q": "**В каком формате обычно приходят данные от API?**", "a": "JSON — обычно это массив объектов (или объект)."}, {"q": "**В axios: чем отличается `response` от `response.data`?**", "a": "`response` — весь объект ответа (статус, заголовки и т.д.). `response.data` — именно нужные данные, которые прислал сервер."}, {"q": "**Дан ответ API:**\n```json\n[\n  { \"id\": 1, \"name\": \"Ivan\" },\n  { \"id\": 2, \"name\": \"Anna\" }\n]\n```\n**Как одним словом описать структуру этих данных?**", "a": "Массив объектов."}, {"q": "**Как найти пользователя с `id === 2` в массиве `data`?**", "a": "```js\nlet user = data.find(function (item) {\n  return item.id === 2;\n});\n```"}, {"q": "**Как получить только пользователей старше 25 лет из массива `data`?**", "a": "```js\nlet adults = data.filter(function (user) {\n  return user.age > 25;\n});\n```"}, {"q": "**Как получить массив только имён из массива объектов `data`?**", "a": "```js\nlet names = data.map(function (user) {\n  return user.name;\n});\n```"}, {"q": "**Что делает этот комбинированный код?**\n```js\nlet result = data\n  .filter(function (user) { return user.age > 25; })\n  .map(function (user) { return user.name; });\n```", "a": "Сначала оставляет только пользователей старше 25, потом достаёт только их имена → результат: массив имён взрослых пользователей."}, {"q": "**Ответ от AI API выглядит так: `{ \"response\": \"Python is a programming language\" }`. Как достать сам текст ответа в JS?**", "a": "```js\nlet answer = response.data.response;\n```\n(поле называется `response`, а весь объект тоже называется `response` — не перепутать!)"}, {"q": "**Что выведет этот код, обращающийся к AI API?**\n```js\naxios.post(\"https://mlvoca.com/api/tinyllama\", {\n  prompt: \"What is Python?\"\n}).then(function (response) {\n  console.log(response.data);\n});\n```", "a": "Выведет весь объект ответа от AI, например: `{ response: \"Python is a programming language\" }`."}, {"q": "**НАЙДИ ОШИБКУ. Что перепутано (частая ошибка axios)?**\n```js\naxios.get(url).then(function (response) {\n  let users = response;\n  console.log(users.length);\n});\n```", "a": "Использовали `response` вместо `response.data`. `response` — это весь объект (со статусом и заголовками), а не сами данные. Нужно `response.data`."}, {"q": "**Практический пример: что делает этот код по шагам?**\n```js\naxios.get(\"https://jsonplaceholder.typicode.com/posts\")\n  .then(function (response) {\n    let posts = response.data;\n    let titles = posts\n      .filter(function (post) { return post.userId === 1; })\n      .map(function (post) { return post.title; });\n    console.log(titles);\n  });\n```", "a": "1) Получает посты с сервера. 2) Достаёт данные через `.data`. 3) Оставляет только посты пользователя с `userId === 1`. 4) Превращает их в массив заголовков (`title`). 5) Выводит массив заголовков."}, {"q": "**Назови 3 базовых операции для работы с данными API, которые чаще всего нужны.**", "a": "Искать (`find`), фильтровать (`filter`), преобразовывать (`map`)."}, {"q": "**Как связана тема \"Обработка ответов API\" с темой map/filter/reduce из прошлого урока?**", "a": "Это те же самые методы массива — просто теперь применяются не к придуманным числам, а к реальным данным, которые пришли с сервера в виде массива объектов."}, {"q": "**Назови 4 частые ошибки при обработке ответов API.**", "a": "1) Использовать `response` вместо `response.data` (в axios). 2) Не проверять структуру данных перед использованием. 3) Путать массив и объект. 4) Неправильная цепочка методов (map/filter в неверном порядке)."}, {"q": "**Как выглядит ответ от обычного REST API (например, jsonplaceholder) в отличие от ответа AI API (tinyllama)?**", "a": "REST API обычно возвращает массив объектов: `[{id, name}, ...]`. AI API возвращает один объект с полем текста: `{ \"response\": \"текст ответа\" }`."}, {"q": "**Практический пример с AI: что выведется в консоли?**\n```js\naxios.post(\"https://mlvoca.com/api/tinyllama\", {\n  prompt: \"Explain JavaScript\"\n}).then(function (response) {\n  let answer = response.data.response;\n  console.log(\"AI answer:\", answer);\n});\n```", "a": "`AI answer: <текст, который сгенерировал AI, например \"JavaScript is a programming language...\">`"}, {"q": "**Почему важно \"не проверять структуру данных\" считается ошибкой — что может пойти не так?**", "a": "Если предположить, что придёт массив, а пришёл объект (или наоборот), или отсутствует ожидаемое поле — код упадёт с ошибкой доступа (например, \"cannot read property of undefined\")."}, {"q": "**Собери цепочку: как получить заголовки постов пользователя с id=1, используя axios + filter + map (напиши с нуля по памяти).**", "a": "```js\naxios.get(url).then(function (response) {\n  let titles = response.data\n    .filter(function (post) { return post.userId === 1; })\n    .map(function (post) { return post.title; });\n  console.log(titles);\n});\n```"}, {"q": "**Что объединяет 4 темы из этого урока (Data Processing, API, JSON, Функции) в одну картину?**", "a": "Функции оборачивают логику → API даёт response → JSON описывает структуру данных → методы массива (map/filter/find) обрабатывают эти данные, превращая сырой ответ в то, что реально нужно."}, {"q": "**Финальный тест на понимание: что выведет этот код?**\n```js\naxios.get(url).then(function (response) {\n  let data = response.data;\n  let result = data\n    .filter(u => u.age >= 18)\n    .map(u => u.name)\n    .join(\", \");\n  console.log(result);\n});\n```\nЕсли `data` = `[{name:\"Ivan\",age:17},{name:\"Anna\",age:20},{name:\"Oleg\",age:19}]`", "a": "`Anna, Oleg` (Ivan отфильтровался — ему 17, меньше 18; остальные два имени объединены через запятую методом `.join(\", \")`)"}, {"q": "**Response — это только данные, которые прислал сервер?**", "a": "Нет. Response — это структурированный ответ: помимо самих данных в нём есть код статуса (например, 200 или 404) и заголовки (headers). Данные — это только часть response, обычно доступная через `response.data` (axios) или после `response.json()` (fetch)."}, {"q": "**Чем JSON-объект отличается от JSON-массива на уровне синтаксиса?**\n```json\n{ \"name\": \"Alice\", \"age\": 25 }\n[ { \"id\": 1 }, { \"id\": 2 } ]\n```", "a": "Объект — это набор пар «ключ: значение» в `{}`, доступ по имени ключа. Массив — это упорядоченный список элементов в `[]`, доступ по числовому индексу. API часто возвращает массив объектов."}, {"q": "**Когда для доступа к полю лучше использовать скобочную нотацию `data[\"key\"]` вместо точечной `data.key`?**", "a": "Когда имя ключа хранится в переменной (динамический ключ) или содержит пробелы/спецсимволы, из-за которых точечная нотация вызовет синтаксическую ошибку. Например: `const field = \"name\"; data[field]`."}, {"q": "**Что делает `data?.user?.name` и чем это отличается от `data.user.name`?**", "a": "Это опциональная цепочка (`optional chaining`) — безопасный доступ к вложенному полю. Если `data.user` окажется `undefined` или `null`, всё выражение вернёт `undefined` вместо падения программы с ошибкой, как было бы при `data.user.name`."}, {"q": "**В чём разница между `filter()`, `find()` и `includes()`?**", "a": "`filter()` отбирает ВСЕ подходящие элементы и возвращает массив. `find()` возвращает только ПЕРВЫЙ подходящий элемент (или `undefined`). `includes()` просто проверяет, есть ли значение в массиве, и возвращает `true`/`false`."}, {"q": "**Что выведет этот код на `reduce()`?**\n```js\nconst data = { items: [{ price: 500 }, { price: 750 }, { price: 1500 }] };\nconst total = data.items.reduce((sum, item) => sum + item.price, 0);\nconsole.log(total);\n```", "a": "`2750` — `reduce()` проходит по массиву и накапливает сумму `price` всех элементов, начиная с `0`."}, {"q": "**Назови 3 шага получения данных из Response по схеме урока.**", "a": "1) Отправить запрос. 2) Получить Response. 3) Извлечь данные — обычно через `response.data` (axios) или `response.json()` (fetch)."}, {"q": "**Почему нельзя один раз запомнить путь до текста ответа AI и использовать его для любой модели?**", "a": "Структура ответа зависит от конкретного AI API — у разных моделей разные поля (например, `choices[0].message.content` у одной, `response` у другой). Всегда нужно проверять документацию конкретной модели."}, {"q": "**Собери по памяти 4 шага обработки ответов API из «Итога занятия»: Получить → ? → ? → ?**", "a": "Получить данные (`response.data`/`response.json()`) → Найти нужные поля (по ключу/индексу) → Отфильтровать (`filter`, `find`) → Преобразовать (`map`, `reduce`)."}, {"q": "**Почему навыки фильтрации и преобразования данных из этого урока применимы не только к REST API, но и к AI?**", "a": "Потому что и обычный REST API, и AI API возвращают данные в одном и том же формате — JSON. Значит, `filter`, `find`, `map`, `reduce` и точечная/скобочная нотация работают одинаково, будь то список товаров, погода или ответ языковой модели."}, {"q": "**НАЙДИ ОШИБКУ. Почему этот код может упасть с ошибкой, если у пользователя нет поля `address`?**\n```js\nconst city = data.user.address.city;\n```", "a": "Если `data.user.address` окажется `undefined`, обращение `.city` вызовет `TypeError`. Безопаснее написать `data.user?.address?.city`, чтобы не полагаться на то, что поле точно есть."}, {"q": "**Что выведет этот код?**\n```js\nconst data = { users: [{ name: \"Ира\", active: false }, { name: \"Олег\", active: true }] };\nconst first = data.users.find(u => u.active);\nconsole.log(first.name);\n```", "a": "`\"Олег\"` — `find()` возвращает первый элемент массива, удовлетворяющий условию `u.active === true`, а не весь массив, как было бы у `filter()`."}, {"q": "**Что выведет этот код?**\n```js\nconst data = { tags: [\"js\", \"api\", \"ai\"] };\nconsole.log(data.tags.includes(\"api\"));\nconsole.log(data.tags.includes(\"python\"));\n```", "a": "`true`, затем `false` — `includes()` просто проверяет наличие значения в массиве и возвращает булево значение, без возврата самого элемента."}, {"q": "**`map()` меняет количество элементов массива или их содержимое?**", "a": "Содержимое (структуру), а не количество. `map()` всегда возвращает новый массив ТОЙ ЖЕ длины, где каждый элемент — результат применения функции к исходному элементу."}, {"q": "**НАЙДИ ОШИБКУ. Автор хотел посчитать сумму цен, но получил `NaN`. Что не так?**\n```js\nconst total = data.items.reduce((sum, item) => sum + item.price);\n```", "a": "Не передан второй аргумент `reduce()` — начальное значение аккумулятора (`0`). Без него `reduce` берёт первый элемент массива как стартовое значение `sum`, и если это объект `{price: ...}`, а не число, сложение даст `NaN`."}, {"q": "**Почему в axios достаточно `response.data`, а в fetch нужно ещё вызвать `response.json()`?**", "a": "Axios автоматически разбирает JSON-ответ и сразу кладёт готовый объект в `response.data`. Fetch отдаёт «сырой» объект Response, и распарсить тело в JSON нужно вручную через `response.json()`, который к тому же возвращает Promise."}]}, {"title": "🧩 БЛОК 22. ОБЪЕКТЫ, JSON И ASYNC/AWAIT", "cards": [{"q": "Что такое объект в JS одним предложением?", "a": "Структура данных «ключ — значение», объединяющая связанные данные под одним именем."}, {"q": "Что выведет?\n```js\nlet user = { name: \"Ivan\", age: 25 };\nconsole.log(user.name);\n```", "a": "`Ivan`"}, {"q": "Как изменить существующее свойство объекта? Приведи пример.", "a": "```js\nuser.age = 26;\n```\nПросто присвоить новое значение через точку — свойство обновится."}, {"q": "Как добавить НОВОЕ свойство в уже существующий объект?", "a": "```js\nuser.email = \"ivan@example.com\";\n```\nПрисваивание через точку автоматически создаёт свойство, если его ещё не было."}, {"q": "Что выведет вложенный объект?\n```js\nlet user = {\n  name: \"Ivan\",\n  address: { city: \"Belgrade\", country: \"Serbia\" }\n};\nconsole.log(user.address.city);\n```", "a": "`Belgrade`"}, {"q": "Что такое JSON одним предложением?", "a": "Текстовый формат для передачи данных между системами, похожий по виду на объект JS."}, {"q": "Назови 3 отличия JSON от обычного объекта JS.", "a": "1) Ключи в JSON всегда в кавычках. 2) JSON — это строка (текст), а не переменная. 3) JSON не может содержать функции — только данные."}, {"q": "Что делает `JSON.stringify()`?", "a": "Превращает объект JS в строку JSON."}, {"q": "Что выведет?\n```js\nlet user = { name: \"Ivan\", age: 25 };\nlet json = JSON.stringify(user);\nconsole.log(json);\n```", "a": "`'{\"name\":\"Ivan\",\"age\":25}'` — это строка, а не объект!"}, {"q": "Что делает `JSON.parse()`?", "a": "Превращает строку JSON обратно в объект JS."}, {"q": "Что выведет?\n```js\nlet json = '{\"name\":\"Ivan\",\"age\":25}';\nlet user = JSON.parse(json);\nconsole.log(user.name);\n```", "a": "`Ivan`"}, {"q": "НАЙДИ ОШИБКУ. Что не так в этом JSON?\n```json\n{\n  name: \"Ivan\"\n}\n```", "a": "Ключ `name` написан без кавычек — в JSON ключи ВСЕГДА должны быть в кавычках: `\"name\"`."}, {"q": "НАЙДИ ОШИБКУ. Почему выведется `undefined`?\n```js\nlet json = '{\"name\":\"Ivan\"}';\nconsole.log(json.name);\n```", "a": "`json` — это просто строка, а не объект. Сначала нужно `JSON.parse(json)`, и только потом обращаться к `.name`."}, {"q": "Что такое конструктор функции (constructor function)? Приведи короткий пример.", "a": "Функция-шаблон для создания однотипных объектов через `new`.\n```js\nfunction Product(name, price) {\n  this.name = name;\n  this.price = price;\n}\n```"}, {"q": "Что делает ключевое слово `this` внутри функции-конструктора?", "a": "Ссылается на КОНКРЕТНЫЙ создаваемый объект — «этот» будущий экземпляр."}, {"q": "Что выведет?\n```js\nfunction Product(name, price) {\n  this.name = name;\n  this.price = price;\n}\nlet item = new Product(\"Phone\", 300);\nconsole.log(item.name, item.price);\n```", "a": "`Phone 300`"}, {"q": "Зачем нужно ключевое слово `new` при вызове конструктора?", "a": "Оно создаёт новый пустой объект, привязывает к нему `this` внутри функции-конструктора и возвращает готовый объект."}, {"q": "Можно ли положить функцию в качестве значения свойства объекта? Приведи пример.", "a": "Да.\n```js\nlet item = {\n  name: \"Phone\",\n  info: function () { return this.name; }\n};\n```\n`info` становится методом объекта."}, {"q": "Что выведет этот код (перебор объекта с методом внутри)?\n```js\nlet item = { name: \"Phone\", price: 300,\n  info: function () { return this.name + \" - \" + this.price; } };\nfor (let key in item) {\n  let value = typeof item[key] !== \"function\" ? item[key] : item[key]();\n  console.log(key + \": \" + value);\n}\n```", "a": "```\nname: Phone\nprice: 300\ninfo: Phone - 300\n```\nДля полей-функций нужно вызывать их через `()`, чтобы получить результат, а не текст функции."}, {"q": "Чем `async/await` отличается от `.then()` по смыслу (не по результату)?", "a": "Это два разных синтаксиса для одной и той же работы с асинхронным кодом. `async/await` выглядит как обычный последовательный код, `.then()` — как цепочка колбэков."}, {"q": "НАЙДИ ОШИБКУ. Почему этот код выдаст ошибку?\n```js\nconst response = await fetch(\"https://api.example.com/data\");\nconsole.log(response);\n```", "a": "`await` нельзя использовать на «верхнем уровне» обычного скрипта (CommonJS — так по умолчанию выполняются .js-файлы в Node.js) без обёртки в `async`-функцию. Нужно:\n```js\nasync function load() {\n  const response = await fetch(url);\n}\n```\n(Исключение: в ES-модулях — например, при \"type\": \"module\" или файле .mjs — top-level `await` разрешён и без `async`-обёртки.)"}, {"q": "Что выведет этот код без `await` (частая ошибка новичков)?\n```js\nlet res = fetch(\"https://api.example.com/data\");\nconsole.log(res);\n```", "a": "Выведет **Promise** (незавершённый) — объект-обещание, а не сами данные. `fetch` асинхронный, нужен либо `await`, либо `.then()`."}, {"q": "Перепиши эту цепочку `.then()` в стиле `async/await` (по памяти, без подглядывания):\n```js\nfetch(url).then(r => r.json()).then(data => console.log(data));\n```", "a": "```js\nasync function load() {\n  const r = await fetch(url);\n  const data = await r.json();\n  console.log(data);\n}\nload();\n```"}, {"q": "Как обработать ошибку сети при `async/await` (а не через `.catch`)?", "a": "Через `try...catch`:\n```js\nasync function load() {\n  try {\n    const r = await fetch(url);\n    const data = await r.json();\n  } catch (err) {\n    console.log(err);\n  }\n}\n```"}, {"q": "Собери по памяти: 5 главных выводов темы «Объекты, JSON, async/await».", "a": "1) Объект — «ключ-значение» для связанных данных.\n2) JSON — текстовый формат для передачи данных, ключи всегда в кавычках.\n3) `JSON.stringify`/`JSON.parse` переводят между объектом и строкой.\n4) Конструктор + `new` + `this` создают однотипные объекты.\n5) `async/await` — тот же fetch/Promise, но в виде «обычного» последовательного кода."}]}, {"title": "🏦 БЛОК 23. КОНСТРУКТОРЫ И МЕТОДЫ: БАНКОВСКИЕ СЧЕТА", "cards": [{"q": "**Что означает `this.deposit = function(amount) {...}` внутри функции-конструктора?**", "a": "Создаёт метод объекта: функция сохраняется как свойство `deposit` у экземпляра и внутри неё `this` ссылается на текущий объект при вызове."}, {"q": "**Что выведет?**\n```js\nfunction Account(iban, balance) {\n  this.iban = iban;\n  this.balance = balance;\n  this.getBalance = function () { return this.balance; };\n}\nlet acc = new Account(\"1111\", 500);\nconsole.log(acc.getBalance());\n```", "a": "`500`"}, {"q": "**Почему в методе `deposit` проверяют `typeof amount !== \"number\" || amount <= 0`?**", "a": "Чтобы отклонить некорректные пополнения: если передали не число (например, строку) или неположительную сумму, операция не выполняется — метод возвращает `false` вместо изменения баланса."}, {"q": "**Что выведет и почему?**\n```js\nfunction Account(balance) {\n  this.balance = balance;\n  this.withdraw = function (amount) {\n    if (typeof amount !== \"number\" || amount <= 0 || amount > this.balance) {\n      return false;\n    }\n    this.balance -= amount;\n    return true;\n  };\n}\nlet acc = new Account(100);\nconsole.log(acc.withdraw(150));\nconsole.log(acc.balance);\n```", "a": "`false` (сумма больше баланса) и `100` — баланс не изменился, потому что снятие не прошло проверку."}, {"q": "**Опиши логику функции `transfer(acc1, acc2, amount)` одним предложением.**", "a": "Пытается списать сумму с `acc1` через `withdraw`; если получилось — пытается зачислить её на `acc2` через `deposit`; в зависимости от результата обоих шагов формирует объект транзакции (успешной или нет)."}, {"q": "**Что произойдёт, если списание прошло успешно (`withdraw` вернул `true`), а зачисление не удалось (`deposit` вернул `false`)? Как это обрабатывает код?**\n```js\nif (acc1.withdraw(amount)) {\n  if (acc2.deposit(amount)) {\n    return new Transaction(acc1, acc2, amount);\n  } else {\n    acc1.deposit(amount); // <-- зачем это здесь?\n    return new Transaction(acc1, acc2, amount, \"не смогли зачислить\");\n  }\n}\n```", "a": "Деньги уже списаны с `acc1`, поэтому их возвращают обратно тем же `deposit` — своего рода «откат» транзакции, иначе деньги бы просто пропали."}, {"q": "**Что делает оператор `in` в этой строке?**\n```js\nlet msg = (\"error\" in this) ? ` error ${this.error}` : \"\";\n```", "a": "Проверяет, есть ли у объекта `this` свойство `error` (даже если оно не было явно объявлено при создании объекта) — возвращает `true`/`false`."}, {"q": "**Что выведет?**\n```js\nlet obj = { a: 1 };\nconsole.log(\"a\" in obj);\nconsole.log(\"b\" in obj);\n```", "a": "`true`, `false`"}, {"q": "**Почему конструктор `Transaction` условно добавляет поле `error`?**\n```js\nfunction Transaction(acc1, acc2, amount, error) {\n  this.account1 = acc1;\n  this.account2 = acc2;\n  this.amount = amount;\n  if (error !== undefined) {\n    this.error = error;\n  }\n}\n```", "a": "Чтобы у успешных транзакций СОВСЕМ не было свойства `error` (а не `error: undefined`) — тогда через `\"error\" in this` можно точно отличить успех от неудачи."}, {"q": "**Что выведет?**\n```js\nfunction Transaction(amount, error) {\n  this.amount = amount;\n  if (error !== undefined) this.error = error;\n}\nlet t1 = new Transaction(100);\nlet t2 = new Transaction(50, \"ошибка\");\nconsole.log(\"error\" in t1, \"error\" in t2);\n```", "a": "`false true`"}, {"q": "**Зачем нужен метод `transactionInfo()` внутри `Transaction`, если можно было бы просто вывести объект через `console.log(transaction)`?**", "a": "Метод формирует читаемое человеком текстовое сообщение о переводе, а не сырую структуру объекта — это отделяет данные от их текстового представления."}, {"q": "**Что выведет?**\n```js\nlet account = { iban: undefined };\nlet iban = account.iban || \"счет не определен\";\nconsole.log(iban);\n```", "a": "`счет не определен` (`undefined` — falsy-значение, поэтому сработал fallback после `||`)"}, {"q": "**НАЙДИ ОШИБКУ. В чём разница между этим кодом и использованием `??` вместо `||`?**\n```js\nlet count = 0;\nlet displayCount = count || \"нет данных\";\nconsole.log(displayCount);\n```", "a": "Выведет `\"нет данных\"`, хотя `count` реально равен `0` (валидное значение) — `||` считает `0` falsy. С `??` (`count ?? \"нет данных\"`) результатом остался бы `0`, потому что `??` проверяет только `null`/`undefined`."}, {"q": "**Что делает `process.env.PASS1` в Node.js?**", "a": "Читает значение переменной окружения `PASS1`, заданной в операционной системе — если такой переменной нет, вернёт `undefined`."}, {"q": "**Почему пароли/ключи хранят в `process.env`, а не пишут прямо в коде как `let password = \"12345\"`?**", "a": "Чтобы секретные данные не попадали в код (и в git-репозиторий) — значение задаётся отдельно на каждой машине/сервере и не видно в исходниках."}, {"q": "**Что произойдёт, если вызвать функцию-конструктор БЕЗ `new`, например `Account(100)` вместо `new Account(100)`?**", "a": "Внутри обычного вызова `this` не будет ссылаться на новый объект (в строгом режиме — `undefined`), поэтому свойства не создадутся на новом экземпляре, и конструктор фактически не сработает как задумано."}, {"q": "**Что выведет?**\n```js\nfunction Account(balance) {\n  this.balance = balance;\n}\nlet acc1 = new Account(100);\nlet acc2 = new Account(200);\nacc1.balance = 999;\nconsole.log(acc1.balance, acc2.balance);\n```", "a": "`999 200` — у каждого экземпляра своя независимая копия свойства `balance`, изменение одного не затрагивает другой."}, {"q": "**Что выведет?**\n```js\nfunction Account(balance) {\n  this.balance = balance;\n  this.deposit = function (amount) {\n    if (typeof amount !== \"number\" || amount <= 0) return false;\n    this.balance += amount;\n    return true;\n  };\n}\nlet acc = new Account(50);\nconsole.log(acc.deposit(\"100\"));\nconsole.log(acc.balance);\n```", "a": "`false` (строка `\"100\"` — не число), баланс не изменился: `50`."}, {"q": "**Опиши, что произойдёт при вызове `transfer(acc1, acc2, amount)`, если `amount` больше баланса `acc1`.**", "a": "`acc1.withdraw(amount)` вернёт `false` (недостаточно средств) → выполнение попадёт в `else`-ветку → вернётся `Transaction` с полем `error: \"не смогли списать\"`, а балансы обоих счетов останутся без изменений."}, {"q": "**Собери по памяти: 4 главных вывода темы «Конструкторы и составные объекты».**", "a": "1) Методы можно объявлять прямо внутри конструктора через `this.метод = function(){...}`.\n2) Функции-действия (`deposit`/`withdraw`) сами проверяют входные данные и возвращают `true`/`false` об успехе.\n3) Результат сложной операции удобно оформлять отдельным объектом (`Transaction`) с необязательными полями.\n4) Оператор `in` проверяет само наличие свойства у объекта, а не его значение."}]}, {"title": "🖥️ БЛОК 24. CLI, ФАЙЛЫ, CSV И AI-ЗАПРОСЫ (Node.js)", "cards": [{"q": "**Что делает `readline.createInterface({ input, output })` в Node.js?**", "a": "Создаёт интерфейс для чтения строк из консоли (`stdin`) и вывода в неё (`stdout`). Через него вызывается `rl.question(...)`."}, {"q": "**Почему пишут `const name = await rl.question(\"...\");`, а не просто `rl.question(...)`?**", "a": "В модуле `node:readline/promises` `rl.question` возвращает `Promise<string>`. Без `await` переменная получит сам объект Promise, а не введённый текст."}, {"q": "**Зачем в конце обязательно вызывать `rl.close()`?**", "a": "Закрывает интерфейс чтения и освобождает поток ввода — без этого процесс Node.js может не завершиться, продолжая «висеть» в ожидании ввода."}, {"q": "**Чем `@inquirer/prompts` удобнее обычного `readline` для форм ввода?**", "a": "Даёт готовые интерактивные виджеты: текстовое поле (`input`), выбор из списка (`select`), да/нет (`confirm`), скрытый ввод пароля (`password`) — не нужно вручную парсить ответ пользователя."}, {"q": "**В чём разница между `select({ choices: [\"A\", \"B\"] })` и `select({ choices: [{ name: \"Админ\", value: \"admin\" }] })`?**", "a": "В первом случае значением станет сам текст строки (`\"A\"`/`\"B\"`). Во втором пользователь видит `name` (\"Админ\"), а в переменную попадёт `value` (`\"admin\"`)."}, {"q": "**Что делает `JSON.stringify(fridge, null, 2)`? Что означают 2-й и 3-й аргументы?**", "a": "Превращает массив/объект в JSON-строку. `null` (replacer) — без фильтрации полей. `2` — отступ в 2 пробела для читаемого форматирования файла."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с сохранением файла?**\n```js\nfunction saveFridge(fridge) {\n  writeFile(\"fridge.json\", JSON.stringify(fridge));\n  console.log(\"Сохранено!\");\n}\n```", "a": "`writeFile` из `fs/promises` асинхронна и возвращает Promise. Без `await` (или `.then`) код выведет \"Сохранено!\" ещё до того, как файл реально запишется на диск."}, {"q": "**Что делает `path.resolve(\"fridge.json\")`?**", "a": "Превращает относительный путь в абсолютный, считая от текущей рабочей директории процесса — файл гарантированно сохраняется в ожидаемом месте, независимо от того, откуда запущен скрипт."}, {"q": "**Что выведет этот код (сборка CSV вручную)?**\n```js\nconst header = \"Наименование,Количество\";\nconst rows = [{name:\"Хлеб\", count:2}, {name:\"Сыр\", count:0.5}]\n  .map(p => p.name + \",\" + p.count);\nconsole.log([header, ...rows].join(\"\\n\"));\n```", "a": "```\nНаименование,Количество\nХлеб,2\nСыр,0.5\n```"}, {"q": "**НАЙДИ ОШИБКУ. Что забыли учесть при разборе CSV?**\n```js\nfunction parseCSV(csv) {\n  return csv.split(\"\\n\").map(line => {\n    const [name, count] = line.split(\",\");\n    return { name, count: Number(count) };\n  });\n}\n```", "a": "Не пропустили строку-заголовок (`Наименование,Количество`). Первым элементом результата будет `{ name: \"Наименование\", count: NaN }`. Нужно взять `csv.split(\"\\n\").slice(1)`."}, {"q": "**Как проверить строку на «стоп-слово» независимо от регистра (\"EXIT\", \"Стоп\", \"stop\")?**", "a": "Привести к нижнему регистру перед сравнением: `[\"exit\",\"выход\",\"стоп\",\"stop\"].includes(input.trim().toLowerCase())`."}, {"q": "**Что выведет?**\n```js\nlet stopWords = [\"exit\", \"выход\", \"стоп\", \"stop\"];\nconsole.log(stopWords.includes(\"СТОП\".toLowerCase()));\n```", "a": "`true`"}, {"q": "**По заданию: если пользователь ввёл количество `0` для уже существующего продукта — что должна сделать программа?**", "a": "Удалить этот продукт из списка целиком (а не просто записать `count: 0`), и пересохранить/обновить файл."}, {"q": "**Как найти индекс продукта по названию в массиве и удалить его?**", "a": "```js\nconst idx = fridge.findIndex(p => p.name === name);\nif (idx !== -1) fridge.splice(idx, 1);\n```"}, {"q": "**НАЙДИ ОШИБКУ. Что произойдёт, если товар с таким именем не найден?**\n```js\nconst idx = fridge.findIndex(p => p.name === name);\nfridge.splice(idx, 1);\n```", "a": "Не проверили `idx !== -1`. Если товар не найден, `idx === -1`, и `fridge.splice(-1, 1)` удалит **последний** элемент массива вместо того, чтобы ничего не делать."}, {"q": "**Чем `array.find(...)` отличается от `array.findIndex(...)`?**", "a": "`find` возвращает сам найденный элемент (или `undefined`). `findIndex` возвращает его позицию-индекс (или `-1`) — это удобно для `splice`."}, {"q": "**Как одной строкой посчитать, сколько раз подстрока встречается в тексте?**", "a": "`text.split(method).length - 1` — на сколько частей текст разбился по `method`, ровно столько раз он встречался (минус одно «лишнее» деление)."}, {"q": "**Что выведет?**\n```js\nlet text = \"GET GET POST GET\";\nconsole.log(text.split(\"GET\").length - 1);\n```", "a": "`3`"}, {"q": "**Зачем в `text.split(/[\\s,.:;()'\"-]+/)` используют регулярное выражение, а не просто `.split(\" \")`?**", "a": "Чтобы разбить текст не только по пробелам, но и по знакам препинания (запятая, точка, скобки, тире и т.д.) — иначе \"GET-запрос\" не отделится дефисом от слова «запрос» и не совпадёт с чистым \"GET\"."}, {"q": "**Как переменная окружения `GEMINI_API_KEY` попадает в код на Node.js?**", "a": "Через объект `process.env`: `const apiKey = process.env.GEMINI_API_KEY;` — Node.js даёт доступ ко всем переменным окружения ОС именно так."}, {"q": "**Зачем API-ключи хранят в переменных окружения, а не прямо в коде?**", "a": "Чтобы не публиковать секретный ключ в открытом виде (например, при заливке кода в Git) — ключ остаётся только на конкретной машине/сервере, а не в репозитории."}, {"q": "**Что делает `await genAi.models.generateContent({ model, contents: prompt })` из `@google/genai`?**", "a": "Отправляет текстовый запрос (`prompt`) модели Gemini и асинхронно возвращает ответ; сам текст ответа лежит в поле `response.text`."}, {"q": "**НАЙДИ ОШИБКУ. Почему `response.text` окажется `undefined`?**\n```js\nasync function askAi(prompt) {\n  const response = genAi.models.generateContent({ model, contents: prompt });\n  return response.text;\n}\n```", "a": "Забыли `await` перед вызовом `generateContent(...)`. Без него `response` — это Promise, а не готовый объект ответа, поэтому `response.text` не существует."}, {"q": "**Как отфильтровать из массива строк только те, где упоминаются коды 200, 404 или 500?**", "a": "```js\nconst codeLines = lines.filter(line =>\n  line.includes(\"200\") || line.includes(\"404\") || line.includes(\"500\")\n);\n```"}, {"q": "**Собери по памяти: 5 главных выводов темы «CLI, файлы, CSV и AI-запросы».**", "a": "1) `readline`/`Inquirer` — асинхронный интерактивный ввод в консоли.\n2) Файлы читаются/пишутся асинхронно (`fs/promises`); формат — JSON или простой текстовый CSV.\n3) Стоп-слова и поиск по имени сравнивают в нижнем регистре.\n4) `findIndex` + `splice` — стандартный способ удалить элемент по условию.\n5) API-ключи хранят в `process.env`, а не прямо в коде."}, {"q": "**Из чего состоит базовый цикл общения с AI-моделью?**", "a": "Prompt (запрос) → Response (ответ). Вы отправляете текстовый запрос — вопрос, задачу или инструкцию, — модель обрабатывает его и возвращает сгенерированный текст. Этот цикл лежит в основе любого AI-приложения."}, {"q": "**Назови 3 шага подготовки запроса к AI-модели через Axios.**", "a": "1) Установка Axios через npm. 2) Конфигурация — добавить API-ключ и URL запроса. 3) Отправка запроса и обработка ответа."}, {"q": "**Чем TinyLlama отличается от Gemini по назначению?**", "a": "TinyLlama — лёгкая модель с небольшим числом параметров, быстрая, может работать локально, подходит для простых задач и прототипирования. Gemini — мощная модель от Google, даёт развёрнутые и точные ответы, лучше справляется со сложными и многоступенчатыми задачами."}, {"q": "**Почему один и тот же промпт может дать разные ответы от AI-модели даже без изменений в коде?**", "a": "Из-за недетерминированности: языковые модели генерируют текст вероятностно, и каждый запуск может немного отличаться. Также влияют параметры модели (temperature, top-p) и нечёткая формулировка самого промпта."}, {"q": "**НАЙДИ ОШИБКУ. В чём главная проблема этого промпта: «Расскажи про API»?**", "a": "Промпт слишком размытый — нет уточнения формата, аудитории и объёма ответа. Модель «угадывает» намерение пользователя, и результат может быть каким угодно. Хороший промпт, например: «Объясни, что такое REST API, в двух предложениях для начинающего разработчика»."}, {"q": "**По каким 3 критериям урок советует выбирать AI-модель для задачи?**", "a": "1) Скорость — для быстрого ответа в реальном времени берут лёгкие модели (TinyLlama). 2) Сложность задачи — для анализа, рассуждений и кода нужны мощные модели (Gemini, GPT-4, Claude). 3) Стоимость — крупные модели дороже за токен, для прототипов лучше экономить."}, {"q": "**Что из двух факторов определяет качественный результат работы с AI, по итогу урока?**", "a": "Правильный prompt (чёткая, структурированная формулировка с контекстом и ожидаемым форматом ответа) + подходящая модель (выбранная под задачу с учётом скорости, глубины анализа и стоимости)."}, {"q": "**Собери по памяти: что нужно сделать, чтобы отправить AI-модели первый запрос через Axios (3 шага)?**", "a": "Шаг 1 — импортировать Axios и задать endpoint модели. Шаг 2 — сформировать тело запроса с полем `prompt`. Шаг 3 — вывести ответ в консоль и проанализировать его структуру."}, {"q": "**Что значит фраза «нет 'лучшей' модели — есть модель, подходящая для конкретной задачи»?**", "a": "Выбор AI-модели зависит от контекста: для простого прототипа быстрее и дешевле подойдёт TinyLlama, а для сложной многоступенчатой задачи, требующей точности, — Gemini или аналогичная мощная модель. Оценивать нужно не «какая модель лучше вообще», а «какая подходит именно здесь»."}, {"q": "**Как параметр `temperature` связан с непредсказуемостью ответа AI-модели?**", "a": "`temperature` и похожие параметры (например, `top-p`) напрямую влияют на «творческость» и точность ответа модели — чем выше температура, тем более разнообразным (и менее предсказуемым) будет результат генерации."}, {"q": "**Почему prompt называют «инструкцией для модели», а не просто вопросом?**", "a": "Потому что от точности формулировки prompt напрямую зависит полезность ответа — модель не «додумывает» задачу за пользователя, а выполняет именно то, что было явно сформулировано, включая ожидаемый формат и контекст."}, {"q": "**НАЙДИ ОШИБКУ. Разработчик выбрал самую мощную и дорогую модель для простого прототипа, который тестируют сотни раз в день. Что он упустил?**", "a": "Критерий стоимости: большие модели дороже за токен. Для прототипов и частых тестовых запросов правильнее взять лёгкую и быструю модель (например, TinyLlama), а мощную модель подключать только там, где реально нужна сложная логика или точность."}, {"q": "**Собери по памяти: 3 критерия выбора AI-модели одним словом каждый.**", "a": "Скорость, сложность (задачи), стоимость."}, {"q": "**Чем «плохой» промпт отличается от «хорошего» на примере из урока?**", "a": "Плохой: «Расскажи про API» — размыто, без контекста. Хороший: «Объясни, что такое REST API, в двух предложениях для начинающего разработчика» — есть конкретная тема, формат (два предложения) и целевая аудитория (новичок)."}, {"q": "**Что чаще всего лежит внутри ответа AI API после шага 3 практики (вывод в консоль)?**", "a": "Точный текст зависит от модели и промпта (из-за недетерминированности), но структура ответа обычно похожа на JSON-объект, где сгенерированный текст лежит в одном из полей — именно это поле и нужно найти и вывести."}]}, {"title": "🔧 БЛОК 25. РЕФАКТОРИНГ: ФУНКЦИИ-ПОМОЩНИКИ", "cards": [{"q": "**Что значит «отрефакторить» код?**", "a": "Изменить внутреннее устройство программы (структуру, разбиение на функции), не меняя её внешнего поведения — программа продолжает делать то же самое, но код становится понятнее."}, {"q": "**В HW-25 главная функция `runFridgeApp` считается «перегруженной». Что это значит?**", "a": "Она делает слишком много всего сразу: сама ищет элементы в массиве, сама меняет данные, сама читает и пишет файлы — вместо того чтобы поручить это отдельным вспомогательным функциям."}, {"q": "**Что делает `writeToJsonFile(filePath, data)`?**\n```js\nasync function writeToJsonFile(filePath, data) {\n  await writeFile(filePath, JSON.stringify(data, null, 2), \"utf-8\");\n}\n```", "a": "Оборачивает `writeFile` + `JSON.stringify` в одну переиспользуемую функцию — везде, где нужно сохранить данные в JSON-файл, теперь можно просто вызвать её вместо повторения одного и того же кода."}, {"q": "**Что делает `appendToJsonFile(filePath, data)` и чем она отличается от `writeToJsonFile`?**\n```js\nasync function appendToJsonFile(filePath, data) {\n  const fileData = await readFile(filePath, \"utf-8\");\n  const existingData = JSON.parse(fileData);\n  const updatedData = [...existingData, ...data];\n  await writeToJsonFile(filePath, updatedData);\n}\n```", "a": "Она не перезаписывает файл, а сначала читает уже сохранённые данные, добавляет к ним новые (через spread `[...existingData, ...data]`) и только потом записывает объединённый результат — то есть «дописывает», а не «затирает»."}, {"q": "**НАЙДИ ОШИБКУ. Что произойдёт, если вызвать `appendToJsonFile` для файла, которого ещё не существует?**", "a": "`readFile` выбросит ошибку (файл не найден), и весь `appendToJsonFile` упадёт с исключением — перед первым добавлением файл нужно создать через `writeToJsonFile` с пустым массивом `[]`."}, {"q": "**Что делает `addOrUpdateProduct(fridge, name, count, price, expDate)` из HW-25 (доработанная версия)?**\n```js\nfunction addOrUpdateProduct(fridge, name, count, price, expDate) {\n  const idx = fridge.findIndex((product) => product.name === name);\n  if (idx !== -1) {\n    fridge[idx].count += count;\n    fridge[idx].price = price;\n    fridge[idx].expDate = expDate;\n  } else {\n    fridge.push({ name, count, price, expDate });\n  }\n}\n```", "a": "Если товар с таким именем уже есть — прибавляет количество и обновляет цену/срок годности. Если товара нет — добавляет его как новую запись."}, {"q": "**Что выведет?**\n```js\nlet fridge = [{ name: \"Молоко\", count: 2, price: 1.5, expDate: \"2026-01-01\" }];\naddOrUpdateProduct(fridge, \"Молоко\", 3, 1.8, \"2026-02-01\");\nconsole.log(fridge[0].count, fridge[0].price);\n```", "a": "`5 1.8` (количество прибавилось: 2+3=5, цена и срок годности заменились на новые)"}, {"q": "**Зачем в HW-25 просят заменить `fridge[idx].count = count` на `fridge[idx]
