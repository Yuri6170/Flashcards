  const QUIZ = [{"title": "📝 ЧАСТЬ 3 · БЛОК 1 (вопросы 1–12)", "questions": [{"num": 1, "code": "**What's the output?**\n```js\n!!null;\n!!\"\";\n!!1;\n```", "options": {"A": "`false` `true` `false`", "B": "`false` `false` `true`", "C": "`false` `true` `true`", "D": "`true` `true` `false`"}, "correct": "B", "optionExplain": {"A": "Неверный набор значений: здесь `\"\"` (falsy) ошибочно показана как truthy.", "B": "Верно: `null` — falsy → `false`; `\"\"` — falsy → `false`; `1` — truthy → `true`.", "C": "Неверно: пустая строка `\"\"` — falsy, значит `!!\"\"` должно быть `false`, а не `true`.", "D": "Неверно: `null` — falsy (`!!null` = `false`, не `true`), а `1` — truthy (`!!1` = `true`, не `false`)."}, "verdict": "Приведение `!!` к булеву часто путают с проверкой \"непустоты\" — проверяй по списку falsy-значений."}, {"num": 2, "code": "What does this return?\n```js\n[...\"Lydia\"];\n```", "options": {"A": "`[\"L\", \"y\", \"d\", \"i\", \"a\"]`", "B": "`[\"Lydia\"]`", "C": "`[[], \"Lydia\"]`", "D": "`[[\"L\", \"y\", \"d\", \"i\", \"a\"]]`"}, "correct": "A", "optionExplain": {"A": "Верно: spread раскладывает строку на отдельные символы-элементы массива.", "B": "Так выглядело бы БЕЗ spread — просто строка, обёрнутая в массив целиком.", "C": "Нет такой структуры — spread не создаёт пустой массив и не оставляет строку нетронутой.", "D": "Лишняя вложенность — spread не оборачивает результат в дополнительный массив."}, "verdict": "Spread строки = посимвольная распаковка, без лишней вложенности."}, {"num": 3, "code": "What does this return?\n```js\nconst firstPromise = new Promise((res, rej) => {\n  setTimeout(res, 500, \"one\");\n});\nconst secondPromise = new Promise((res, rej) => {\n  setTimeout(res, 100, \"two\");\n});\nPromise.race([firstPromise, secondPromise]).then(res => console.log(res));\n```", "options": {"A": "`\"one\"`", "B": "`\"two\"`", "C": "`\"two\" \"one\"`", "D": "`\"one\" \"two\"`"}, "correct": "B", "optionExplain": {"A": "`firstPromise` разрешится позже (через 500мс) — `race` не ждёт самый поздний промис.", "B": "Верно: `secondPromise` завершается быстрее (100мс < 500мс), `Promise.race` берёт того, кто первый.", "C": "`race` возвращает ОДНО значение (от первого завершившегося промиса), а не оба по очереди.", "D": "То же самое: `race` — это не `Promise.all`, он не ждёт и не выводит оба результата."}, "verdict": "`race` берёт первый ЗАВЕРШИВШИЙСЯ промис, а не первый по порядку в массиве."}, {"num": 4, "code": "What's the output?\n```js\nlet person = { name: \"Lydia\" };\nconst members = [person];\nperson = null;\nconsole.log(members);\n```", "options": {"A": "`null`", "B": "`[null]`", "C": "`[{}]`", "D": "`[{ name: \"Lydia\" }]`"}, "correct": "D", "optionExplain": {"A": "Переменная `person` действительно стала `null`, но `members` хранит СВОЮ копию ссылки, а не саму переменную `person`.", "B": "`members` не превращается в `[null]` — элемент массива не связан с переменной `person` напрямую.", "C": "Объект не становится пустым — его свойства никуда не делись.", "D": "Верно: `members[0]` хранит ссылку на исходный объект `{name:\"Lydia\"}`, и переприсвоение `person = null` эту ссылку в массиве не трогает."}, "verdict": "Переприсвоение переменной не трогает уже сохранённые где-то ссылки на старое значение."}, {"num": 5, "code": "What's the output?\n```js\nconst person = {\n  name: \"Lydia\",\n  age: 21\n};\nfor (const item in person) {\n  console.log(item);\n}\n```", "options": {"A": "`{ name: \"Lydia\" }, { age: 21 }`", "B": "`\"name\", \"age\"`", "C": "`\"Lydia\", 21`", "D": "`[\"name\", \"Lydia\"], [\"age\", 21]`"}, "correct": "B", "optionExplain": {"A": "`for...in` не оборачивает пары в объекты — он просто даёт сами ключи по одному.", "B": "Верно: `for...in` перебирает ИМЕНА ключей объекта как строки — `\"name\"`, затем `\"age\"`.", "C": "Это были бы значения (как в `for...of Object.values(...)`), а `for...in` даёт ключи, а не значения.", "D": "Так выглядели бы пары из `Object.entries()`, но `for...in` возвращает голые ключи, без обёртки в массив."}, "verdict": "`for...in` — это про КЛЮЧИ, не про значения и не про пары."}, {"num": 6, "code": "What's the output?\n```js\nconsole.log(3 + 4 + \"5\");\n```", "options": {"A": "`\"345\"`", "B": "`\"75\"`", "C": "`12`", "D": "`\"12\"`"}, "correct": "B", "optionExplain": {"A": "Сложение `3 + 4` выполняется ЧИСЛОМ раньше, чем встретится строка — поэтому не может получиться `\"345\"`.", "B": "Верно: `3 + 4` → `7` (число), затем `7 + \"5\"` → приведение к строке → `\"75\"`.", "C": "`\"5\"` — строка, а не число; её нельзя просто сложить арифметически без приведения типов.", "D": "Число `12` получилось бы, если бы `\"5\"` трактовалась как число 5 — но `+` со строкой выполняет конкатенацию, а не сложение."}, "verdict": "Тип первого встреченного операнда определяет, будет ли `+` складывать числа или конкатенировать строки."}, {"num": 7, "code": "What's the output?\n```js\nconst a = {};\nconst b = { key: \"b\" };\nconst c = { key: \"c\" };\na[b] = 123;\na[c] = 456;\nconsole.log(a[b]);\n```", "options": {"A": "`123`", "B": "`456`", "C": "`undefined`", "D": "`ReferenceError`"}, "correct": "B", "optionExplain": {"A": "Не учитывает, что `b` и `c` при использовании как ключи object превращаются в ОДНУ и ту же строку.", "B": "Верно: любой объект-ключ приводится к строке `\"[object Object]\"`, поэтому `a[b]` и `a[c]` — один и тот же ключ; `a[c] = 456` перезаписывает `a[b] = 123`.", "C": "Ключ существует (просто это не отдельные `b`/`c`, а общий `\"[object Object]\"`) — значение там есть.", "D": "Никакой ошибки тут нет — присваивание объектных ключей совершенно легально в JS."}, "verdict": "Объекты как ключи всегда стрингифицируются в одну и ту же строку — коллизия ключей гарантирована."}, {"num": 8, "code": "What's the output?\n```js\nconst numbers = [1, 2, 3];\nnumbers[10] = 11;\nconsole.log(numbers.length);\n```", "options": {"A": "11", "B": "4", "C": "Error"}, "correct": "A", "optionExplain": {"A": "Верно: присвоение `numbers[10] = 11` растягивает массив так, что `length` становится `10 + 1 = 11`, даже если промежуточные ячейки пустые.", "B": "Не просто \"ещё один\" элемент добавляется — длина массива определяется САМЫМ большим индексом + 1.", "C": "Ошибки нет: присвоение за пределами текущей длины — валидная операция (создаёт разреженный массив)."}, "verdict": "`length` массива определяется максимальным индексом + 1, даже у разреженных массивов."}, {"num": 9, "code": "What's the value of `num`?\n```js\nconst num = parseInt(\"7*6\");\n```", "options": {"A": "`42`", "B": "`\"42\"`", "C": "`7`", "D": "`NaN`"}, "correct": "C", "optionExplain": {"A": "`42` получился бы при `eval(\"7*6\")`, но `parseInt` не вычисляет выражения — он просто читает цифры по порядку.", "B": "`parseInt` возвращает ЧИСЛО, а не строку.", "C": "Верно: `parseInt` читает цифры слева направо, пока не встретит нечисловой символ (`*`) — останавливается на `7`.", "D": "`NaN` было бы, только если бы ПЕРВЫЙ символ строки не был цифрой — а `\"7\"` валидная цифра в начале."}, "verdict": "`parseInt` — не `eval`: он не умеет считать выражения, только читает цифры с начала строки."}, {"num": 10, "code": "What's the output?\n```js\nfunction getInfo(member, year) {\n  member.name = \"Lydia\";\n  year = \"1998\";\n}\nconst person = { name: \"Sarah\" };\nconst birthYear = \"1997\";\ngetInfo(person, birthYear);\nconsole.log(person, birthYear);\n```", "options": {"A": "`{ name: \"Lydia\" }, \"1997\"`", "B": "`{ name: \"Sarah\" }, \"1998\"`", "C": "`{ name: \"Lydia\" }, \"1998\"`", "D": "`{ name: \"Sarah\" }, \"1997\"`"}, "correct": "A", "optionExplain": {"A": "Верно: объект передаётся по ссылке — мутация `member.name` внутри функции видна и снаружи; примитив `birthYear` передаётся по значению — присваивание `year = \"1998\"` локально, снаружи `birthYear` не меняется.", "B": "Объект НЕ остался нетронутым — мутация `member.name` точно изменила исходный объект; а `birthYear` снаружи не меняется.", "C": "`birthYear` не меняется — переприсвоение параметра `year` внутри функции не затрагивает внешнюю переменную (примитив копируется по значению).", "D": "Объект как раз ИЗМЕНЯЕТСЯ — мутация свойства через ссылку работает, в отличие от переприсвоения примитива."}, "verdict": "Классическое разделение: объекты — по ссылке (мутация видна), примитивы — по значению (переприсвоение локально)."}, {"num": 11, "code": "What's the output?\n```js\nfunction greeting() {\n  throw \"Hello world!\";\n}\nfunction sayHi() {\n  try {\n    const data = greeting();\n    console.log(\"It worked!\", data);\n  } catch (e) {\n    console.log(\"Oh no an error:\", e);\n  }\n}\nsayHi();\n```", "options": {"A": "`It worked! Hello world!`", "B": "`Oh no an error: undefined`", "C": "`SyntaxError: can only throw Error objects`", "D": "`Oh no an error: Hello world!`"}, "correct": "D", "optionExplain": {"A": "Исполнение не продолжается как ни в чём не бывало — `throw` сразу прерывает `try`-блок и передаёт управление в `catch`.", "B": "`e` — не `undefined`, в `catch` приходит именно то значение, которое было брошено (`\"Hello world!\"`).", "C": "В JS можно бросать ЛЮБОЕ значение, не только `Error` — никакого `SyntaxError` тут нет.", "D": "Верно: `throw \"Hello world!\"` передаёт строку прямо в `catch(e)`, и она логируется как есть."}, "verdict": "В JS можно бросить что угодно, не только `Error` — `catch` ловит именно это значение."}, {"num": 12, "code": "What's the output?\n```js\nconst numbers = [1, 2, 3, 4, 5];\nconst [y] = numbers;\nconsole.log(y);\n```", "options": {"A": "`[[1, 2, 3, 4, 5]]`", "B": "`[1, 2, 3, 4, 5]`", "C": "`1`", "D": "`[1]`"}, "correct": "C", "optionExplain": {"A": "`y` получает не весь массив, а один элемент — деструктуризация массива берёт значения по позиции.", "B": "Это был бы весь массив целиком — но `[y] = numbers` берёт только ПЕРВЫЙ элемент, а не копирует массив в `y`.", "C": "Верно: `const [y] = numbers` — деструктуризация по позиции, `y` получает элемент с индексом 0, то есть `1`.", "D": "`y` — не массив-обёртка, а именно само значение `1`."}, "verdict": "Деструктуризация массива берёт элементы ПОЗИЦИОННО, а не весь массив целиком."}]}, {"title": "📝 ЧАСТЬ 3 · БЛОК 2 (вопросы 13–24)", "questions": [{"num": 13, "code": "What's the output?\n```js\nconst user = { name: \"Lydia\", age: 21 };\nconst admin = { admin: true, ...user };\nconsole.log(admin);\n```", "options": {"A": "`{ admin: true, user: { name: \"Lydia\", age: 21 } }`", "B": "`{ admin: true, name: \"Lydia\", age: 21 }`", "C": "`{ admin: true, user: [\"Lydia\", 21] }`", "D": "`{ admin: true }`"}, "correct": "B", "optionExplain": {"A": "Spread НЕ создаёт вложенный ключ `user` — свойства `user` копируются на верхний уровень нового объекта.", "B": "Верно: `...user` разворачивает `name` и `age` прямо в `admin` рядом с `admin: true` — никакой вложенности.", "C": "Spread никогда не превращает свойства объекта в массив внутри нового ключа.", "D": "Spread-свойства ДЕЙСТВИТЕЛЬНО попадают в результат — они не отбрасываются."}, "verdict": "Spread объекта копирует свойства на верхний уровень — без дополнительной вложенности."}, {"num": 14, "code": "What's the output?\n```js\nconst settings = {\n  username: \"lydiahallie\",\n  level: 19,\n  health: 90\n};\nconst data = JSON.stringify(settings, [\"level\", \"health\"]);\nconsole.log(data);\n```", "options": {"A": "`\"{\"level\":19, \"health\":90}\"`", "B": "`\"{\"username\": \"lydiahallie\"}\"`", "C": "`\"[\"level\", \"health\"]\"`", "D": "`\"{\"username\": \"lydiahallie\", \"level\":19, \"health\":90}\"`"}, "correct": "A", "optionExplain": {"A": "Верно: третий аргумент `JSON.stringify` — массив-\"белый список\" ключей; остаются только перечисленные `level` и `health`.", "B": "Наоборот: `username` НЕ входит в список разрешённых ключей (`[\"level\",\"health\"]`), поэтому он как раз исключается.", "C": "Сам список `[\"level\",\"health\"]` — это ВХОДНОЙ аргумент-фильтр, а не то, что возвращает `JSON.stringify`.", "D": "Список-фильтр реально ограничивает вывод — не все ключи проходят, только перечисленные."}, "verdict": "Третий аргумент `JSON.stringify` — это фильтр-разрешение, а не что-то, что возвращается как есть."}, {"num": 15, "code": "What's the output?\n```js\nlet num = 10;\nconst increaseNumber = () => num++;\nconst increasePassedNumber = number => number++;\nconst num1 = increaseNumber();\nconst num2 = increasePassedNumber(num1);\nconsole.log(num1);\nconsole.log(num2);\n```", "options": {"A": "`10`, `10`", "B": "`10`, `11`", "C": "`11`, `11`", "D": "`11`, `12`"}, "correct": "A", "optionExplain": {"A": "Верно: `num++` (постфикс) возвращает СТАРОЕ значение `num` (10) и увеличивает внешний `num` до 11; `number++` внутри `increasePassedNumber` увеличивает только ЛОКАЛЬНУЮ копию параметра и тоже возвращает старое значение (10) — наружу это не просачивается.", "B": "`num2` не становится `11` — постфиксный `++` возвращает значение ДО увеличения, а изменение параметра `number` вообще не видно снаружи функции.", "C": "Путает постфикс с префиксом: `num++` возвращает старое значение, а не уже увеличенное.", "D": "Та же ошибка с постфиксом/префиксом, усугублённая для обоих вызовов."}, "verdict": "Постфиксный `++` отдаёт старое значение; изменения локального параметра не покидают функцию."}, {"num": 16, "code": "What's the output?\n```js\n[1, 2, 3, 4].reduce((x, y) => console.log(x, y));\n```", "options": {"A": "`1` `2` and `3` `3` and `6` `4`", "B": "`1` `2` and `2` `3` and `3` `4`", "C": "`1` `undefined` and `2` `undefined` and `3` `undefined` and `4` `undefined`", "D": "`1` `2` and `undefined` `3` and `undefined` `4`"}, "correct": "D", "optionExplain": {"A": "Не учитывает, что `reduce` без начального значения берёт `array[0]` как стартовый `acc`, а колбэк тут ничего не `return`-ит.", "B": "Похоже на обычное попарное суммирование, но колбэк здесь не возвращает значение — после первого шага `acc` становится `undefined`.", "C": "На первом шаге `acc` — это `array[0]` (`1`), а не `undefined` — `undefined` появляется только ПОСЛЕ первого вызова колбэка, который ничего не возвращает.", "D": "Верно: без начального значения первый вызов — `(1, 2)`; колбэк просто логирует и не возвращает значения, поэтому во всех следующих шагах `acc` оказывается `undefined` — `(undefined, 3)`, `(undefined, 4)`."}, "verdict": "`reduce` без начального значения + колбэк без `return` — классическая ловушка на `undefined`."}, {"num": 17, "code": "What's the output?\n```js\nfunction addToList(item, list) {\n  return list.push(item);\n}\nconst result = addToList(\"apple\", [\"banana\"]);\nconsole.log(result);\n```", "options": {"A": "`['apple', 'banana']`", "B": "`2`", "C": "`true`", "D": "`undefined`"}, "correct": "B", "optionExplain": {"A": "Это то, как выглядит массив ПОСЛЕ `push`, но сам `push()` возвращает не массив, а число.", "B": "Верно: `Array.prototype.push()` возвращает НОВУЮ ДЛИНУ массива после добавления — после добавления `\"apple\"` в `[\"banana\"]` длина становится `2`.", "C": "Нет логики для `true` — `push` не возвращает булево значение.", "D": "`push` всегда возвращает число (новую длину), а не `undefined`."}, "verdict": "`push()` возвращает НОВУЮ ДЛИНУ массива, а не сам массив."}, {"num": 18, "code": "What is the output?\n```js\nconst list = [1 + 2, 1 * 2, 1 / 2]\nconsole.log(list)\n```", "options": {"A": "`[\"1 + 2\", \"1 * 2\", \"1 / 2\"]`", "B": "`[\"12\", 2, 0.5]`", "C": "`[3, 2, 0.5]`", "D": "`[1, 1, 1]`"}, "correct": "C", "optionExplain": {"A": "JS не хранит элементы массива как текст выражений — они сразу вычисляются при создании массива.", "B": "Это были бы строковые операции, но все операнды — числа, и арифметика (`+`, `*`, `/`) выполняется по-настоящему, а не как конкатенация строк.", "C": "Верно: каждое выражение в литерале массива вычисляется сразу — `1+2=3`, `1*2=2`, `1/2=0.5`.", "D": "Нет причин, по которым все три выражения дали бы одинаковый результат `1` — у них разная арифметика."}, "verdict": "Выражения в литерале массива вычисляются сразу при создании, а не хранятся как текст."}, {"num": 19, "code": "What is the output?\n```js\nfunction sayHi(name) {\n  return `Hi there, ${name}`\n}\nconsole.log(sayHi())\n```", "options": {"A": "`Hi there,`", "B": "`Hi there, undefined`", "C": "`Hi there, null`", "D": "`ReferenceError`"}, "correct": "B", "optionExplain": {"A": "Шаблонная строка не \"выбрасывает\" плейсхолдер — она подставляет туда текстовое представление значения, даже если это `undefined`.", "B": "Верно: аргумент не передан → `name` равен `undefined`; в шаблонной строке это превращается в текст `\"undefined\"`.", "C": "По умолчанию непереданный параметр — это `undefined`, а не `null`.", "D": "Обращение к объявленному, но не переданному параметру не кидает `ReferenceError` — это просто `undefined`."}, "verdict": "Непереданный аргумент — это `undefined`, и шаблонная строка честно его покажет как текст."}, {"num": 20, "code": "What's the output?\n```js\nconsole.log(\"I want pizza\"[0])\n```", "options": {"A": "`\"\"\"`", "B": "`\"I\"`", "C": "`SyntaxError`", "D": "`undefined`"}, "correct": "B", "optionExplain": {"A": "Индекс `0` указывает на первый символ строки, а не на пустую строку.", "B": "Верно: строки можно индексировать как массивы (только для чтения); `\"I want pizza\"[0]` — первый символ, `\"I\"`.", "C": "Индексирование строки квадратными скобками — валидный, стандартный синтаксис JS.", "D": "`undefined` было бы при выходе индекса за пределы строки — индекс `0` всегда существует для непустой строки."}, "verdict": "Строки индексируются как массивы символов (только для чтения)."}, {"num": 21, "code": "What is the output?\n```js\nfunction checkAge(age) {\n  if (age < 18) {\n    const message = \"Sorry, you're too young.\"\n  } else {\n    const message = \"Yay! You're old enough!\"\n  }\n  return message\n}\nconsole.log(checkAge(21))\n```", "options": {"A": "`\"Sorry, you're too young.\"`", "B": "`\"Yay! You're old enough!\"`", "C": "`ReferenceError`", "D": "`undefined`"}, "correct": "C", "optionExplain": {"A": "`message` объявлена через `const` ВНУТРИ блока `if` — наружу, к `return message`, она не \"протекает\".", "B": "Та же ошибка — `const`/`let` ограничены блоком `{}`, в котором объявлены, что бы внутри ни произошло.", "C": "Верно: `message` существует только внутри своего `if`/`else` блока; `return message` обращается к переменной, которой в этой области видимости просто не существует → `ReferenceError`.", "D": "`undefined` было бы при поведении, похожем на `var` (с подъёмом объявления) — но `const`/`let` не \"поднимаются\" так, чтобы быть видимыми снаружи блока; там их попросту нет."}, "verdict": "`const`/`let` живут и умирают строго внутри своего блока `{}` — никакого \"подъёма наружу\"."}, {"num": 22, "code": "What's the output?\n```js\nfunction sum(num1, num2 = num1) {\n  console.log(num1 + num2)\n}\nsum(10)\n```", "options": {"A": "`NaN`", "B": "`20`", "C": "`ReferenceError`", "D": "`undefined`"}, "correct": "B", "optionExplain": {"A": "`NaN` получился бы, если бы `num2` не определился из `num1` — но параметр по умолчанию, ссылающийся на предыдущий параметр, работает корректно.", "B": "Верно: `num2 = num1` — допустимая ссылка на уже определённый к этому моменту параметр; при `sum(10)` оба равны `10`, значит `10 + 10 = 20`.", "C": "Ссылаться в значении параметра по умолчанию на более ранний параметр — абсолютно законно в JS, ошибки нет.", "D": "`console.log` тут точно что-то выведет — и это число, а не `undefined`."}, "verdict": "Параметр по умолчанию может смело ссылаться на уже объявленный более ранний параметр."}, {"num": 23, "code": "What's the output?\n```js\nlet newList = [1, 2, 3].push(4)\nconsole.log(newList.push(5))\n```", "options": {"A": "`[1, 2, 3, 4, 5]`", "B": "`[1, 2, 3, 5]`", "C": "`[1, 2, 3, 4]`", "D": "`Error`"}, "correct": "D", "optionExplain": {"A": "`newList` — это не массив, а ЧИСЛО (длина после первого `push`), так что собрать такой массив не получится.", "B": "Та же ошибка: `newList` не массив, значит и такой результат невозможен.", "C": "И снова: `newList` — число, а не массив из 4 элементов.", "D": "Верно: `Array.prototype.push()` возвращает НОВУЮ ДЛИНУ (число `4`), а не сам массив; `newList` оказывается числом `4`, и `newList.push(5)` — вызов несуществующего метода `push` у числа → `TypeError`."}, "verdict": "`push()` возвращает число — вызывать на этом числе `.push()` дальше нельзя."}, {"num": 24, "code": "What's the output?\n```js\nfunction sayHi() {\n  console.log(name);\n  console.log(age);\n  var name = \"Lydia\";\n  let age = 21;\n}\nsayHi();\n```", "options": {"A": "`Lydia` and `undefined`", "B": "`Lydia` and `ReferenceError`", "C": "`ReferenceError` and `21`", "D": "`undefined` and `ReferenceError`"}, "correct": "D", "optionExplain": {"A": "`name` — это не `\"Lydia\"` на момент первого `console.log`: присваивание `var name = \"Lydia\"` ещё не выполнилось (поднимается только объявление, не значение).", "B": "Тот же промах с `name`, да ещё и при частично верном `age`.", "C": "Перепутаны местами поведения `var` и `let`: именно `name` (var) не кидает ошибку, а `age` (let) кидает её.", "D": "Верно: `var name` поднимается с начальным значением `undefined` (ошибки нет, просто `undefined`); `let age` находится во Temporal Dead Zone до своей строки объявления — обращение раньше кидает `ReferenceError`."}, "verdict": "`var` подвисает как `undefined`, `let`/`const` до объявления — зона `ReferenceError` (TDZ)."}]}, {"title": "📝 ЧАСТЬ 3 · БЛОК 3 (вопросы 25–36)", "questions": [{"num": 25, "code": "What's the output?\n```js\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 1);\n}\nfor (let i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 1);\n}\n```", "options": {"A": "`0 1 2` and `0 1 2`", "B": "`0 1 2` and `3 3 3`", "C": "`3 3 3` and `0 1 2`"}, "correct": "C", "optionExplain": {"A": "Так было бы, если бы ОБА цикла использовали поведение `let` — но первый цикл использует `var`, который ведёт себя иначе.", "B": "Перепутаны местами: именно `var`-цикл даёт `3 3 3`, а `let`-цикл — `0 1 2`, не наоборот.", "C": "Верно: `var` — одна общая переменная на весь цикл, к моменту срабатывания всех `setTimeout` она уже равна финальному `3`; `let` создаёт новую привязку на КАЖДУЮ итерацию, поэтому каждый колбэк захватывает своё собственное значение — `0`, `1`, `2`."}, "verdict": "Главное отличие `var`/`let` в цикле: одна общая ячейка vs новая привязка на каждую итерацию."}, {"num": 26, "code": "What's the output?\n```js\n+true;\n!\"Lydia\";\n```", "options": {"A": "`1` and `false`", "B": "`false` and `NaN`", "C": "`false` and `false`"}, "correct": "A", "optionExplain": {"A": "Верно: `+true` приводит булево к числу — `true` → `1`; `!\"Lydia\"` — непустая строка truthy, её отрицание — `false`.", "B": "`+true` даёт чистое число `1`, а не `NaN`; приведение булева значения к числу — корректная операция.", "C": "`+true` — не `false`, это число `1` (успешное приведение типа, а не провал в булево)."}, "verdict": "Унарный `+` приводит к числу, `!` — к булеву; это разные операции с разным результатом."}, {"num": 27, "code": "What's the output?\n```js\nconst shape = {\n  radius: 10,\n  diameter() {\n    return this.radius * 2;\n  },\n  perimeter: () => 2 * Math.PI * this.radius\n};\nconsole.log(shape.diameter());\nconsole.log(shape.perimeter());\n```", "options": {"A": "`20` and `62.83185307179586`", "B": "`20` and `NaN`", "C": "`20` and `63`", "D": "`NaN` and `63`"}, "correct": "B", "optionExplain": {"A": "`perimeter` — СТРЕЛОЧНАЯ функция, у неё нет своего `this`; она не может правильно получить `this.radius` от объекта, значит результат не может быть `62.83...`.", "B": "Верно: `diameter()` — обычный метод, его `this` корректно указывает на `shape` → `20`. `perimeter` — стрелочная функция, `this` в ней берётся из ВНЕШНЕГО (лексического) контекста, где `radius` не существует → `this.radius` это `undefined`, `2 * Math.PI * undefined` = `NaN`.", "C": "Та же ошибка, что и в A, просто с округлённым числом.", "D": "`diameter()` как раз работает правильно (`20`) — ломается именно `perimeter`, а не наоборот."}, "verdict": "Стрелочная функция не создаёт свой `this` — он берётся из окружающего (лексического) контекста."}, {"num": 28, "code": "Which one is true?\n```js\nconst bird = {\n  size: \"small\"\n};\nconst mouse = {\n  name: \"Mickey\",\n  small: true\n};\n```\n(о допустимости `mouse.bird.size`, `mouse[bird.size]`, `mouse[bird[\"size\"]]`)", "options": {"A": "`mouse.bird.size` is not valid", "B": "`mouse[bird.size]` is not valid", "C": "`mouse[bird[\"size\"]]` is not valid", "D": "All of them are valid"}, "correct": "D", "optionExplain": {"A": "В оригинальной формулировке вопроса речь идёт именно о синтаксической допустимости записи `mouse[bird.size]` и `mouse[bird[\"size\"]]` — с этой точки зрения все перечисленные варианты являются корректным JS-синтаксисом (хотя `mouse.bird.size` при реальном вычислении дал бы ошибку, так как `mouse.bird` равно `undefined`).", "B": "`bird.size` → `\"small\"`, значит `mouse[bird.size]` = `mouse[\"small\"]` = `true` — запись синтаксически и семантически корректна.", "C": "`bird[\"size\"]` — то же самое через скобочную нотацию, тоже даёт `\"small\"` и тоже валидно.", "D": "Верно (в контексте вопроса о синтаксисе): все три формы — валидный JavaScript-код."}, "verdict": "Формулировка вопроса — про синтаксическую допустимость записи, а не про то, бросит ли она ошибку при реальном вычислении."}, {"num": 29, "code": "What's the output?\n```js\nlet c = { greeting: \"Hey!\" };\nlet d;\nd = c;\nc.greeting = \"Hello\";\nconsole.log(d.greeting);\n```", "options": {"A": "`Hello`", "B": "`Hey!`", "C": "`undefined`", "D": "`ReferenceError`", "E": "`TypeError`"}, "correct": "A", "optionExplain": {"A": "Верно: `d = c` копирует ССЫЛКУ на объект, а не создаёт независимую копию — `d` и `c` указывают на один и тот же объект, поэтому изменение `c.greeting` видно и через `d`.", "B": "`d` — не отдельный снимок состояния на момент присваивания; это та же ссылка, что и `c`, так что более позднее изменение `c` видно и в `d`.", "C": "Свойство `greeting` точно существует на объекте — `undefined` тут неоткуда взяться.", "D": "`d` объявлена и присвоена корректно — обращение `d.greeting` не вызывает `ReferenceError`.", "E": "Никакая операция здесь не несовместима по типам — `TypeError` не возникает."}, "verdict": "Присваивание объекта копирует ссылку, а не создаёт независимую копию данных."}, {"num": 30, "code": "What's the output?\n```js\nlet a = 3;\nlet b = new Number(3);\nlet c = 3;\nconsole.log(a == b);\nconsole.log(a === b);\nconsole.log(b === c);\n```", "options": {"A": "`true` `false` `true`", "B": "`false` `false` `true`", "C": "`true` `false` `false`", "D": "`false` `true` `true`"}, "correct": "C", "optionExplain": {"A": "`b === c` не может быть `true` — `b` это объект-обёртка `Number`, а `c` — примитив; строгое сравнение разных типов всегда `false`.", "B": "`a == b` на самом деле `true` — `==` распаковывает объект-обёртку `Number` перед сравнением.", "C": "Верно: `a == b` → `true` (`==` распаковывает `new Number(3)` до примитива `3`); `a === b` → `false` (разные типы: число и объект, строгое сравнение типы не приводит); `b === c` → `false` (та же причина — объект против примитива).", "D": "`a == b` — `true` (не `false`), а `b === c` — `false` (не `true`); оба пункта перепутаны."}, "verdict": "`==` распаковывает объекты-обёртки перед сравнением, `===` — никогда (разные типы остаются разными)."}, {"num": 31, "code": "What happens when we do this?\n```js\nfunction bark() {\n  console.log(\"Woof!\");\n}\nbark.animal = \"dog\";\n```", "options": {"A": "Nothing, this is totally fine!", "B": "`SyntaxError`. You cannot add properties to a function this way.", "C": "`\"Woof\"` gets logged.", "D": "`ReferenceError`"}, "correct": "A", "optionExplain": {"A": "Верно: функции в JS — тоже объекты, им можно свободно присваивать произвольные свойства, как любому другому объекту.", "B": "Присвоение свойства функции — валидный синтаксис, никакого `SyntaxError` тут нет.", "C": "Эта строка только ПРИСВАИВАЕТ свойство — сама функция `bark()` нигде не вызывается, значит ничего не логируется.", "D": "`bark` — нормально объявленная функция, доступная в этой точке кода; `ReferenceError` неоткуда взяться."}, "verdict": "Функции — тоже объекты: им можно свободно добавлять свойства, это не вызов функции."}, {"num": 32, "code": "What's the output?\n```js\nfunction Person(firstName, lastName) {\n  this.firstName = firstName;\n  this.lastName = lastName;\n}\nconst lydia = new Person(\"Lydia\", \"Hallie\");\nconst sarah = Person(\"Sarah\", \"Smith\");\nconsole.log(lydia);\nconsole.log(sarah);\n```", "options": {"A": "`Person {firstName: \"Lydia\", lastName: \"Hallie\"}` and `undefined`", "B": "`Person {firstName: \"Lydia\", lastName: \"Hallie\"}` and `Person {firstName: \"Sarah\", lastName: \"Smith\"}`", "C": "`Person {firstName: \"Lydia\", lastName: \"Hallie\"}` and `{}`", "D": "`Person {firstName: \"Lydia\", lastName: \"Hallie\"}` and `ReferenceError`"}, "correct": "A", "optionExplain": {"A": "Верно: без `new` функция-конструктор не создаёт новый объект — `this` внутри указывает на обычный (несвязанный с `Person`) контекст, свойства утекают туда, а сама функция не возвращает ничего явно → `sarah` оказывается `undefined`.", "B": "Без `new` НЕ создаётся полноценный второй экземпляр `Person` — объект просто не формируется и не возвращается.", "C": "`sarah` — не пустой объект `{}`, а именно `undefined` (функция ничего явно не вернула).", "D": "Вызов конструктора без `new` не кидает ошибку — это совершенно легальный (хоть и не тот, что ожидался) вызов обычной функции."}, "verdict": "Без `new` не создаётся новый объект — `this` утекает в посторонний контекст, конструктор ничего не возвращает."}, {"num": 33, "code": "What's the output?\n```js\nfunction sum(a, b) {\n  return a + b;\n}\nsum(1, \"2\");\n```", "options": {"A": "`NaN`", "B": "`TypeError`", "C": "`\"12\"`", "D": "`3`"}, "correct": "C", "optionExplain": {"A": "`NaN` было бы при несовместимой арифметике, но `+` с одним из операндов-строкой выполняет конкатенацию, а не проваливается в `NaN`.", "B": "Никакой ошибки типов — JS молча приводит число к строке и конкатенирует.", "C": "Верно: один из операндов `+` — строка (`\"2\"`), значит выполняется СТРОКОВАЯ конкатенация: `1` превращается в `\"1\"`, и получается `\"12\"`.", "D": "`3` получилось бы, если бы `\"2\"` сначала привели к числу — но `+` при наличии строки выбирает конкатенацию, а не сложение."}, "verdict": "Если хотя бы один операнд `+` — строка, JS выбирает конкатенацию, а не арифметику."}, {"num": 34, "code": "What's the output?\n```js\nlet number = 0;\nconsole.log(number++);\nconsole.log(++number);\nconsole.log(number);\n```", "options": {"A": "`1` `1` `2`", "B": "`1` `2` `2`", "C": "`0` `2` `2`", "D": "`0` `1` `2`"}, "correct": "C", "optionExplain": {"A": "Первый `console.log(number++)` должен вывести СТАРОЕ значение (`0`), а не уже увеличенное.", "B": "Та же ошибка с первым выводом — постфиксный `++` возвращает значение до инкремента.", "C": "Верно: `number++` (постфикс) логирует старое значение `0`, затем увеличивает `number` до `1`; `++number` (префикс) сначала увеличивает до `2`, затем логирует уже новое значение `2`; финальный `console.log(number)` просто показывает актуальное `2`.", "D": "Второе значение должно быть уже увеличенным (`2`), а не промежуточным `1` — префиксный `++` увеличивает ДО логирования."}, "verdict": "Постфикс логирует старое значение и увеличивает после; префикс — увеличивает и логирует уже новое."}, {"num": 35, "code": "What's the output?\n```js\nfunction checkAge(data) {\n  if (data === { age: 18 }) {\n    console.log(\"You are an adult!\");\n  } else if (data == { age: 18 }) {\n    console.log(\"You are still an adult.\");\n  } else {\n    console.log(`Hmm.. You don't have an age I guess`);\n  }\n}\ncheckAge({ age: 18 });\n```", "options": {"A": "`You are an adult!`", "B": "`You are still an adult.`", "C": "`Hmm.. You don't have an age I guess`"}, "correct": "C", "optionExplain": {"A": "Объекты сравниваются по ССЫЛКЕ, а не по содержимому — два РАЗНЫХ ", "options": {"A": "`{ a: \"one\", b: \"two\" }`", "B": "`{ b: \"two\", a: \"three\" }`", "C": "`{ a: \"three\", b: \"two\" }`", "D": "`SyntaxError`"}, "correct": "C", "optionExplain": {"A": "Сохраняет ПЕРВОЕ значение `a` (`\"one\"`), но при дублирующихся ключах побеждает ПОСЛЕДНЕЕ присваивание.", "B": "Значения здесь верные, но порядок ключей в объекте на самом деле определяется местом ПЕРВОГО появления ключа `a` (то есть `a` останется первым при переборе, просто с итоговым значением `\"three\"`) — этот вариант описывает иной порядок полей.", "C": "Верно: при дублирующемся ключе `a` в объектном литерале побеждает ПОСЛЕДНЕЕ присваивание (`\"three\"`), более раннее значение (`\"one\"`) молча перезаписывается; значение `b` остаётся как есть.", "D": "Дублирующиеся ключи в объектном литерале — валидный JS, даже в строгом режиме; `SyntaxError` тут не возникает."}, "verdict": "При дублирующихся ключах в объектном литерале побеждает последнее присваивание."}, {"num": 41, "code": "What's the output?\n```js\nconst foo = () => console.log(\"First\");\nconst bar = () => setTimeout(() => console.log(\"Second\"));\nconst baz = () => console.log(\"Third\");\nbar();\nfoo();\nbaz();\n```", "options": {"A": "`First` `Second` `Third`", "B": "`First` `Third` `Second`", "C": "`Second` `First` `Third`", "D": "`Second` `Third` `First`"}, "correct": "B", "optionExplain": {"A": "Предполагает, что колбэк `setTimeout` выполняется практически сразу/по порядку вызова — на самом деле он всегда откладывается до завершения всего синхронного кода.", "B": "Верно: `bar()` лишь ПЛАНИРУЕТ колбэк через `setTimeout` и сразу возвращает управление, не блокируя; `foo()` и `baz()` выполняются синхронно и сразу — `\"First\"`, затем `\"Third\"`; только когда весь синхронный код скрипта завершён, event loop добирается до отложенного колбэка — `\"Second\"` печатается последним.", "C": "Отложенный колбэк (`\"Second\"`) не может оказаться ПЕРВЫМ — event loop всегда сперва полностью отрабатывает текущий синхронный код.", "D": "Та же ошибка, что и в C, да ещё и с переставленным местами синхронным порядком `First`/`Third`."}, "verdict": "`setTimeout` всегда откладывается в конец очереди, даже с нулевой задержкой — после всего синхронного кода."}, {"num": 42, "code": "What is the event.target when clicking the button?\n```html\n<div onclick=\"console.log('first div')\">\n  <div onclick=\"console.log('second div')\">\n    <button onclick=\"console.log('button')\">\n      Click!\n    </button>\n  </div>\n</div>\n```", "options": {"A": "Outer `div`", "B": "Inner `div`", "C": "`button`", "D": "An array of all nested elements."}, "correct": "C", "optionExplain": {"A": "`event.target` — не контейнер-обёртка, а конкретный элемент, по которому реально кликнули (кнопка), а не внешний `div`.", "B": "Тот же промах — `event.target` остаётся кнопкой независимо от того, чей обработчик сейчас выполняется из-за всплытия.", "C": "Верно: `event.target` — это самый глубокий (конкретный) элемент, где физически произошёл клик — кнопка `<button>`, даже когда позже срабатывают обработчики родительских `div` через всплытие.", "D": "`event.target` — всегда ОДИН конкретный элемент, а не массив из всей цепочки предков."}, "verdict": "`event.target` — это физически кликнутый элемент, независимо от того, чей обработчик сейчас выполняется."}, {"num": 43, "code": "When you click the paragraph, what's the logged output?\n```html\n<div onclick=\"console.log('div')\">\n  <p onclick=\"console.log('p')\">\n    Click here!\n  </p>\n</div>\n```", "options": {"A": "`p` `div`", "B": "`div` `p`", "C": "`p`", "D": "`div`"}, "correct": "A", "optionExplain": {"A": "Верно: клик по `<p>` сначала запускает обработчик самого `<p>` (целевого элемента), а затем событие ВСПЛЫВАЕТ вверх к родительскому `<div>`, вызывая и его обработчик тоже — сначала `\"p\"`, потом `\"div\"`.", "B": "Порядок перепутан: внутренний элемент (`p`), на котором произошёл клик, всегда срабатывает РАНЬШЕ внешнего — не наоборот.", "C": "Здесь нет `stopPropagation()` — событие продолжает всплывать и до родительского `div` тоже доходит, его обработчик тоже сработает.", "D": "Клик физически произошёл внутри `<p>` — значит именно обработчик `p` срабатывает первым, а не только обработчик `div`."}, "verdict": "События сначала срабатывают на целевом элементе, потом всплывают вверх по дереву DOM."}, {"num": 44, "code": "What's the output?\n```js\nconst person = { name: \"Lydia\" };\nfunction sayHi(age) {\n  return `${this.name} is ${age}`;\n}\nconsole.log(sayHi.call(person, 21));\nconsole.log(sayHi.bind(person, 21));\n```", "options": {"A": "`undefined is 21` `Lydia is 21`", "B": "`function` `function`", "C": "`Lydia is 21` `Lydia is 21`", "D": "`Lydia is 21` `function`"}, "correct": "D", "optionExplain": {"A": "`.call(person, 21)` явно устанавливает `this = person`, у которого есть `name` — результат не может быть `undefined is 21`.", "B": "`.call()` выполняет функцию СРАЗУ и возвращает её настоящий результат (строку), а не саму функцию.", "C": "`.bind()` НЕ вызывает функцию сама по себе — она лишь возвращает новую функцию для вызова позже; логирование результата `.bind()` напрямую покажет функцию, а не готовую строку.", "D": "Верно: `.call(person, 21)` вызывает функцию немедленно с `this = person` → `\"Lydia is 21\"`; `.bind(person, 21)` лишь СОЗДАЁТ новую связанную функцию, не выполняя её — при логировании видно саму функцию (`\"function\"`), а не вычисленную строку."}, "verdict": "`.call()` вызывает функцию сразу, `.bind()` только готовит её к вызову позже."}, {"num": 45, "code": "What's the output?\n```js\nfunction sayHi() {\n  return (() => 0)();\n}\nconsole.log(typeof sayHi());\n```", "options": {"A": "`\"object\"`", "B": "`\"number\"`", "C": "`\"function\"`", "D": "`\"undefined\"`"}, "correct": "B", "optionExplain": {"A": "`0` — примитивное число, а не объект; `typeof` для него никогда не даст `\"object\"` (это классическая ловушка только для `typeof null`).", "B": "Верно: IIFE `(() => 0)()` вызывается немедленно   function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a === "number" && typeof b === "number" && Number.isNaN(a) && Number.isNaN(b)) return true;
    if (a === null || b === null || typeof a !== "object" || typeof b !== "object") return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const aKeys = Object.keys(a), bKeys = Object.keys(b);
    if (aKeys.length !== bKeys.length) return false;
    for (const k of aKeys) {
      if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
      if (!deepEqual(a[k], b[k])) return false;
    }
    return true;
  }

  function fmtVal(v) {
    if (v === undefined) return "undefined";
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  async function runExercise(ex, code) {
    let fn;
    try {
      const factory = new Function("mockData", "mockFetch", "mockPost", "wait",
        code + "\n;return typeof " + ex.fn + " !== 'undefined' ? " + ex.fn + " : undefined;");
      fn = factory(ex.mockData || {}, mockFetchImpl, mockPostImpl, waitImpl);
    } catch (e) {
      return { ok: false, message: "💥 Ошибка в коде: " + e.message };
    }
    if (typeof fn !== "function") {
      return { ok: false, message: "Не нашёл функцию `" + ex.fn + "`. Проверь, что ты назвал её именно так." };
    }
    for (const t of ex.tests) {
      let actual;
      try {
        actual = fn.apply(null, t.args);
        if (ex.isAsync || (actual && typeof actual.then === "function")) {
          actual = await actual;
        }
      } catch (e) {
        return { ok: false, message: "💥 Ошибка при вызове " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + "): " + e.message };
      }
      if (!deepEqual(actual, t.expected)) {
        return { ok: false, message: "❌ " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + ") вернул " + fmtVal(actual) + ", а ожидалось " + fmtVal(t.expected) };
      }
    }
    return { ok: true, message: "✅ Все проверки пройдены (" + ex.tests.length + ")! Отличная работа." };
  }

  function shortTitle(t) {
    const m = t.match(/БЛОК\s*(\d+)\.\s*([^\(]+)/);
    if (m) return m[1] + '. ' + m[2].trim();
    return t;
  }

  function render(str) {
    let s = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    s = s.replace(/```(?:\w+)?\n([\s\S]*?)```/g, function (m, code) { return '<pre><code>' + code.trim() + '</code></pre>'; });
    const preBlocks = [];
    s = s.replace(/<pre>[\s\S]*?<\/pre>/g, function (m) { preBlocks.push(m); return '\u0000PRE' + (preBlocks.length - 1) + '\u0000'; });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.split('\n').join('<br>');
    s = s.replace(/\u0000PRE(\d+)\u0000/g, function (m, idx) { return preBlocks[parseInt(idx, 10)]; });
    return s;
  }

  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function partRange(part) {
    if (part === 1) return [0, 3];
    if (part === 2) return [3, 7];

  function renderTabs() {

    for (let i = range[0]; i < range[1]; i++) {

      const tab = document.createElement('div');

      tab.addEventListener('click', () => { state.blockIndex = i; renderActive(); });
      tabsEl.appendChild(tab);
    }
  }

      practiceView.style.display = 'none';

      runBtn.style.display = 'none';
      againPracticeBtn.style.display = 'block';
      practiceLinks.style.display = 'none';

      progressLabel.textContent = st.passed + ' / ' + st.total;

  function selectQuizOption(letter) {
    const st = currentQuizState();
    const block = currentQuizBlock();
    const q = block.questions[st.currentIndex];
    if (st.answers[st.currentIndex] !== null) return;
    st.answers[st.currentIndex] = letter;
    if (letter === q.correct) bumpStreak(true); else bumpStreak(false);
    renderQuiz();
  }

  function renderQuiz() {
    const block = currentQuizBlock();
    const st = currentQuizState();
    const q = block.questions[st.currentIndex];

    renderQuizTabs();
    renderQuizGrid();

    quizView.style.display = 'flex';
    quizEyebrow.textContent = 'Вопрос ' + (st.currentIndex + 1) + ' / ' + st.total + ' (№' + q.num + ')';
    quizQText.innerHTML = render(q.code);
    quizOptions.innerHTML = '';
    quizAWrap.classList.remove('shown');

    const answeredLetter = st.answers[st.currentIndex];
    const letters = Object.keys(q.options);
    letters.forEach(letter => {
      const opt = document.createElement('div');
      opt.className = 'quiz-option';
      let html = '<span class="opt-letter">' + letter + '</span><span class="opt-body">' + render(q.options[letter]);
      if (answeredLetter !== null) {
        opt.classList.add('disabled');
        let icon = '— ';
        if (letter === q.correct) { opt.classList.add('correct'); icon = '✅ '; }
        else if (letter === answeredLetter) { opt.classList.add('wrong'); icon = '❌ '; }
        const expl = (q.optionExplain && q.optionExplain[letter]) ? q.optionExplain[letter] : '';
        html += '<span class="opt-explain">' + icon + render(expl) + '</span>';
      } else {
        opt.addEventListener('click', () => selectQuizOption(letter));
      }
      html += '</span>';
      opt.innerHTML = html;
      quizOptions.appendChild(opt);
    });

    if (answeredLetter !== null) {
      const isCorrect = answeredLetter === q.correct;
      quizAWrap.classList.add('shown');
      quizResultBadge.textContent = isCorrect ? '✅ Верно' : '❌ Неверно (выбрано ' + answeredLetter + ')';
      quizResultBadge.className = 'quiz-result-badge ' + (isCorrect ? 'ok' : 'bad');
      quizExplain.innerHTML = render(q.verdict || '');
    }

    quizPrevBtn.disabled = st.currentIndex === 0;
    quizNextBtn.disabled = st.currentIndex === st.total - 1;

    const answeredCount = st.answers.filter(a => a !== null).length;
    progressFill.style.width = Math.round((answeredCount / st.total) * 100) + '%';
    progressLabel.textContent = answeredCount + ' / ' + st.total;
  }

  function resetQuizBlock() {
    const st = currentQuizState();
    const block = currentQuizBlock();
    st.currentIndex = 0;
    st.answers = new Array(block.questions.length).fill(null);
    renderQuiz();
  }

  /* ===================== PART SWITCHER ===================== */

  function switchPart(part) {
    state.part = part;
    partTabs.forEach(b => b.classList.toggle('active', b.getAttribute('data-part') === String(part)));

    if (part === 3) {
      modeTabsWrap.style.display = 'none';
      cardView.style.display = 'none';
      practiceView.style.display = 'none';
      celebrate.classList.remove('show');
      celebratePractice.classList.remove('show');
      navRow.style.display = 'none';
      practiceNavRow.style.display = 'none';
      practiceLinks.style.display = 'none';
      quizGrid.style.display = 'flex';
      quizNavRow.style.display = 'flex';
      modeSub.textContent = '📝 Квиз: выбери вариант — сразу откроются все варианты с объяснением. Прыгай между вопросами свободно.';
      renderQuizTabs();
      renderQuiz();
    } else {
      modeTabsWrap.style.display = 'flex';
      quizView.style.display = 'none';
      quizGrid.style.display = 'none';
      quizNavRow.style.display = 'none';
      const range = partRange(part);
      if (state.blockIndex < range[0] || state.blockIndex >= range[1]) state.blockIndex = range[0];
      if (state.mode === 'theory') {
        navRow.style.display = 'flex';
        practiceNavRow.style.display = 'none';
        practiceLinks.style.display = 'none';
        modeSub.textContent = '📖 Тапни по карточке — открой ответ. Оцени себя честно.';
      } else {
        navRow.style.display = 'none';
        practiceNavRow.style.display = 'flex';
        practiceLinks.style.display = 'flex';
        modeSub.textContent = '💻 Пиши код в поле и жми «Проверить» — тесты запускаются прямо в браузере.';
      }
      renderActive();
    }
  }

  partTabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const part = parseInt(btn.getAttribute('data-part'), 10);
      if (part === state.part) return;
      switchPart(part);
    });
  });

  cardView.addEventListener('click', function () {
    if (!aWrap.classList.contains('shown')) reveal();
  });

  forgotBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    const ci = st.queue.shift();
    const insertAt = Math.min(3, st.queue.length);
    st.queue.splice(insertAt, 0, ci);
    bumpStreak(false);
    renderCard();
  });

  knowBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    st.queue.shift();
    st.mastered += 1;
    bumpStreak(true);
    renderCard();
  });

  againBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    st.queue = makeQueue(st.total);
    st.mastered = 0;
    st.done = false;
    renderCard();
  });

  resetBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state.part === 3) {
      resetQuizBlock();
    } else if (state.mode === 'theory') {
      const st = currentState();
      st.queue = makeQueue(st.total);
      st.mastered = 0;
      st.done = false;
      renderCard();
    } else {
      resetPracticeBlock();
    }
  });

  modeTabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const mode = btn.getAttribute('data-mode');
      if (mode === state.mode) return;
      state.mode = mode;
      modeTabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
      if (mode === 'theory') {
        practiceView.style.display = 'none';
        celebratePractice.classList.remove('show');
        practiceNavRow.style.display = 'none';
        practiceLinks.style.display = 'none';
        navRow.style.display = 'flex';
        modeSub.textContent = '📖 Тапни по карточке — открой ответ. Оцени себя честно.';
      } else {
        cardView.style.display = 'none';
        celebrate.classList.remove('show');
        navRow.style.display = 'none';
        practiceNavRow.style.display = 'flex';
        practiceLinks.style.display = 'flex';
        modeSub.textContent = '💻 Пиши код в поле и жми «Проверить» — тесты запускаются прямо в браузере.';
      }
      renderActive();
    });
  });

  runBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const block = currentPracticeBlock();
    const ex = block.exercises[st.pointer];
    st.codes[st.pointer] = codeEditor.value;
    runBtn.disabled = true;
    runBtn.textContent = '⏳ Проверяю...';
    let result;
    try {
      result = await runExercise(ex, codeEditor.value);
    } catch (err) {
      result = { ok: false, message: '💥 Неожиданная ошибка: ' + err.message };
    }
    feedback.textContent = result.message;
    feedback.className = 'feedback show ' + (result.ok ? 'ok' : 'err');
    if (result.ok) {
      st.passed += 1;
      st.pointer += 1;
      bumpStreak(true);
      runBtn.disabled = true;
      practiceLinks.style.display = 'none';
      setTimeout(renderPractice, 750);
    } else {
      runBtn.disabled = false;
      runBtn.textContent = '▶ Проверить код';
    }
  });

  skipBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    if (st.pointer >= st.total) return;
    st.pointer += 1;
    renderPractice();
  });

  solutionBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const ex = currentPracticeBlock().exercises[st.pointer];
    if (!ex) return;
    solutionBox.innerHTML = '<strong style="color:var(--teal)">Решение:</strong><pre><code>' + escapeHtml(ex.solution) + '</code></pre>';
    solutionBox.className = 'solution-box show';
  });

  restartCodeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const ex = currentPracticeBlock().exercises[st.pointer];
    if (!ex) return;
    st.codes[st.pointer] = ex.starter;
    codeEditor.value = ex.starter;
    feedback.className = 'feedback';
    solutionBox.className = 'solution-box';
  });

  againPracticeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    resetPracticeBlock();
  });

  codeEditor.addEventListener('input', function () {
    const st = currentPracticeState();
    st.codes[st.pointer] = codeEditor.value;
  });

  quizPrevBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentQuizState();
    if (st.currentIndex > 0) { st.currentIndex -= 1; renderQuiz(); }
  });

  quizNextBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentQuizState();
    if (st.currentIndex < st.total - 1) { st.currentIndex += 1; renderQuiz(); }
  });

  switchPart(1);
})();
</script>

</body>
</html>
