<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>JS Продвинутый Экзамен — 3 части</title>
	<style>
		:root {
			--bg: #16181c;
			--panel: #1f2226;
			--panel-2: #262a2f;
			--stripe-a: #ffb020;
			--stripe-b: #16181c;
			--text: #ece9e2;
			--text-dim: #8b9098;
			--accent: #ffb020;
			--teal: #48c9b0;
			--danger: #e5533d;
			--border: #33373d;
			--radius: 14px;
		}
		* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
		html, body {
			margin: 0; padding: 0; height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
			overscroll-behavior: none;
		}
		#app {
			max-width: 640px;
			margin: 0 auto;
			min-height: 100%;
			display: flex;
			flex-direction: column;
			padding: 14px 14px 28px;
		}
		
		.stripe {
			height: 8px;
			border-radius: 5px;
			background: repeating-linear-gradient(135deg, var(--stripe-a), var(--stripe-a) 10px, var(--stripe-b) 10px, var(--stripe-b) 20px);
			opacity: 0.9;
			flex-shrink: 0;
		}
		
		header {
			padding: 16px 2px 8px;
			flex-shrink: 0;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 10px;
		}
		h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }
		.sub { margin-top: 4px; font-size: 12px; color: var(--text-dim); }
		
		.streak {
			flex-shrink: 0;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 8px 12px;
			text-align: center;
			min-width: 62px;
		}
		.streak-num { font-size: 18px; font-weight: 800; color: var(--accent); line-height: 1; }
		.streak-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
		.streak.pulse { animation: pulse .35s ease; }
		@keyframes pulse { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }
		
		.part-tabs { display: flex; gap: 8px; padding: 10px 2px 0; flex-shrink: 0; }
		.part-tab {
			flex: 1; padding: 11px 6px; border-radius: 10px; border: 1px solid var(--border);
			background: var(--panel); color: var(--text-dim); font-size: 12.5px; font-weight: 800;
			cursor: pointer; transition: all .15s ease; text-align: center;
		}
		.part-tab.active { background: var(--teal); color: #062420; border-color: var(--teal); }
		
		.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 2px 4px; flex-shrink: 0; }
		.tab {
			flex: 1 1 auto; min-width: 0; padding: 9px 8px;
			border-radius: 10px; border: 1px solid var(--border);
			background: var(--panel); color: var(--text-dim);
			font-size: 11.5px; font-weight: 700; white-space: nowrap;
			overflow: hidden; text-overflow: ellipsis; text-align: center;
			cursor: pointer; transition: all .15s ease; position: relative;
		}
		.tab.active { background: var(--accent); color: #201400; border-color: var(--accent); }
		.tab.complete:not(.active) { border-color: var(--teal); color: var(--teal); }
		.tab .count { opacity: 0.75; font-weight: 600; margin-left: 2px; }
		
		.progress-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px 4px; flex-shrink: 0; }
		.progress-track { flex: 1; height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
		.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--accent)); border-radius: 4px; transition: width .25s ease; width: 0%; }
		.progress-label { font-size: 11.5px; color: var(--text-dim); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
		
		.card-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 2px; min-height: 340px; }
		.card {
			background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
			padding: 22px 20px 20px; min-height: 300px; display: flex; flex-direction: column;
			position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
		}
		.card-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); font-weight: 800; margin-bottom: 10px; }
		.q-text { font-size: 17px; font-weight: 700; line-height: 1.45; color: var(--text); }
		.q-text pre, .a-text pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 10px 0; font-size: 13px; }
		.q-text code, .a-text code { font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
		.q-text pre code, .a-text pre code { background: none; padding: 0; }
		.q-text code, .a-text code { background: rgba(255,176,32,0.12); color: #ffcf7a; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
		.a-text strong { color: var(--teal); }
		
		.answer-zone { margin-top: 16px; flex: 1; display: flex; flex-direction: column; position: relative; }
		
		.blur-hint {
			margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--panel-2);
			border: 1px dashed var(--border); color: var(--text-dim); font-size: 13px;
			text-align: center; letter-spacing: 0.2px; cursor: pointer;
		}
		
		.a-wrap { display: none; animation: reveal .25s ease; }
		.a-wrap.shown { display: block; }
		@keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
		.a-divider { height: 1px; background: repeating-linear-gradient(90deg, var(--accent), var(--accent) 6px, transparent 6px, transparent 12px); opacity: 0.5; margin: 4px 0 14px; }
		.a-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--teal); font-weight: 800; margin-bottom: 8px; }
		.a-text { font-size: 15.5px; line-height: 1.55; color: var(--text); }
		
		.nav-row { display: flex; gap: 10px; padding: 14px 2px 0; flex-shrink: 0; }
		.nav-btn {
			flex: 1; padding: 15px; border-radius: 10px; border: 1px solid var(--border);
			background: var(--panel); color: var(--text); font-size: 14px; font-weight: 800;
			cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
		}
		.nav-btn:active { transform: scale(0.98); }
		.nav-btn.forgot { background: rgba(229,83,61,0.12); border-color: var(--danger); color: #ff8b78; }
		.nav-btn.know { background: var(--teal); border-color: var(--teal); color: #062420; }
		.nav-btn.wide { flex: 1 1 100%; }
		
		.reset-row { text-align: center; padding-top: 12px; }
		.reset-link { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px; }
		
		.celebrate { text-align: center; padding: 30px 10px; display: none; }
		.celebrate.show { display: block; animation: reveal .3s ease; }
		.celebrate .big { font-size: 44px; margin-bottom: 6px; }
		.celebrate h2 { margin: 6px 0; font-size: 19px; }
		.celebrate p { color: var(--text-dim); font-size: 13px; margin: 4px 0 18px; }
		
		@media (max-width: 380px) {
			.q-text { font-size: 15.5px; }
			.a-text { font-size: 14.5px; }
		}
		
		.mode-tabs { display: flex; gap: 8px; padding: 2px 2px 0; flex-shrink: 0; }
		.mode-tab {
			flex: 1; padding: 11px 8px; border-radius: 10px; border: 1px solid var(--border);
			background: var(--panel-2); color: var(--text-dim); font-size: 13px; font-weight: 800;
			cursor: pointer; transition: all .15s ease;
		}
		.mode-tab.active { background: var(--accent); color: #201400; border-color: var(--accent); }
		
		.practice-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--teal); font-weight: 800; margin-bottom: 10px; }
		.prompt-text { font-size: 15.5px; font-weight: 700; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
		.prompt-text pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
		.prompt-text code { font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; background: rgba(255,176,32,0.12); color: #ffcf7a; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
		.prompt-text pre code { background: none; padding: 0; }
		
		.code-editor {
			width: 100%; flex: 1; min-height: 130px; resize: vertical;
			background: #101214; color: #d9e6e2; border: 1px solid var(--border); border-radius: 10px;
			padding: 12px 14px; font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
			font-size: 13.5px; line-height: 1.5; tab-size: 2; outline: none;
		}
		.code-editor:focus { border-color: var(--accent); }
		
		.feedback {
			margin-top: 10px; padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.45;
			display: none; word-break: break-word;
		}
		.feedback.show { display: block; animation: reveal .2s ease; }
		.feedback.ok { background: rgba(72,201,176,0.12); border: 1px solid var(--teal); color: #b6ede2; }
		.feedback.err { background: rgba(229,83,61,0.12); border: 1px solid var(--danger); color: #ffb3a5; }
		
		.solution-box {
			display: none; margin-top: 10px; padding: 11px 13px; border-radius: 10px;
			background: var(--panel-2); border: 1px dashed var(--border); font-size: 13px;
		}
		.solution-box.show { display: block; }
		.solution-box pre { background: #101214; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 0; font-size: 12.5px; }
		
		.practice-links { display: flex; justify-content: center; gap: 18px; padding-top: 10px; flex-wrap: wrap; }
		.practice-link { background: none; border: none; color: var(--text-dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
		
		.run-btn {
			width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--accent);
			background: var(--accent); color: #201400; font-size: 14.5px; font-weight: 800;
			cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
		}
		.run-btn:active { transform: scale(0.98); }
		
		.quiz-options { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
		.quiz-option {
			display: flex; align-items: flex-start; gap: 0; text-align: left; padding: 12px 14px;
			border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2);
			color: var(--text); font-size: 14px; line-height: 1.45; cursor: pointer; transition: all .15s ease;
		}
		.quiz-option:active { transform: scale(0.99); }
		.opt-letter {
			display: inline-flex; align-items: center; justify-content: center;
			width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--text-dim);
			font-size: 11px; font-weight: 800; margin-right: 10px; flex-shrink: 0;
		}
		.opt-body code { font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; background: rgba(255,176,32,0.12); color: #ffcf7a; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
		.quiz-option.correct { background: rgba(72,201,176,0.15); border-color: var(--teal); color: #d3f5ec; }
		.quiz-option.correct .opt-letter { background: var(--teal); color: #062420; }
		.quiz-option.wrong { background: rgba(229,83,61,0.15); border-color: var(--danger); color: #ffd5cc; }
		.quiz-option.wrong .opt-letter { background: var(--danger); color: #200a06; }
		.quiz-option.disabled { cursor: default; }
		.quiz-result-badge { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
		.quiz-result-badge.ok { background: rgba(72,201,176,0.15); color: #8be8d6; }
		.quiz-result-badge.bad { background: rgba(229,83,61,0.15); color: #ffb3a5; }
	</style>
</head>
<body>

<div id="app">
	<div class="stripe"></div>
	<header>
		<div>
			<h1>&#9881;&#65039; JS Продвинутый Экзамен</h1>
			<div class="sub" id="modeSub">&#128214; Тапни по карточке &#8212; открой ответ. Оцени себя честно.</div>
		</div>
		<div class="streak" id="streakBox">
			<div class="streak-num" id="streakNum">0</div>
			<div class="streak-label">&#128293; стрик</div>
		</div>
	</header>
	
	<div class="part-tabs" id="partTabs">
		<button class="part-tab active" data-part="1">Часть 1</button>
		<button class="part-tab" data-part="2">Часть 2</button>
		<button class="part-tab" data-part="3">Часть 3 · Квиз</button>
	</div>
	
	<div class="mode-tabs" id="modeTabs">
		<button class="mode-tab active" data-mode="theory">&#128214; Карточки</button>
		<button class="mode-tab" data-mode="practice">&#128187; Практика</button>
	</div>
	
	<div class="tabs" id="tabs"></div>
	
	<div class="progress-row">
		<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
		<div class="progress-label" id="progressLabel">0 / 0</div>
	</div>
	
	<div class="card-zone">
		<div class="card" id="cardView">
			<div class="card-eyebrow" id="cardEyebrow">БЛОК &#183; 1 / 25</div>
			<div class="q-text" id="qText"></div>
			<div class="answer-zone">
				<div class="blur-hint" id="blurHint">&#128274; Тапни, чтобы увидеть ответ</div>
				<div class="a-wrap" id="aWrap">
					<div class="a-divider"></div>
					<div class="a-label">Ответ</div>
					<div class="a-text" id="aText"></div>
				</div>
			</div>
		</div>
		
		<div class="card" id="practiceView" style="display:none;">
			<div class="practice-eyebrow" id="practiceEyebrow">БЛОК &#183; ЗАДАЧА 1 / 6</div>
			<div class="prompt-text" id="promptText"></div>
			<textarea class="code-editor" id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
			<div class="feedback" id="feedback"></div>
			<div class="solution-box" id="solutionBox"></div>
		</div>
		
		<div class="card" id="quizView" style="display:none;">
			<div class="card-eyebrow" id="quizEyebrow">ВОПРОС 1 / 12</div>
			<div class="q-text" id="quizQText"></div>
			<div class="quiz-options" id="quizOptions"></div>
			<div class="a-wrap" id="quizAWrap">
				<div class="a-divider"></div>
				<div class="quiz-result-badge" id="quizResultBadge"></div>
				<div class="a-label">Объяснение</div>
				<div class="a-text" id="quizExplain"></div>
			</div>
		</div>
		
		<div class="celebrate" id="celebrate">
			<div class="big">&#127881;</div>
			<h2>Блок пройден!</h2>
			<p id="celebrateStats"></p>
		</div>
		
		<div class="celebrate" id="celebratePractice">
			<div class="big">&#127942;</div>
			<h2>Все задачи решены!</h2>
			<p id="celebratePracticeStats"></p>
		</div>
		
		<div class="celebrate" id="celebrateQuiz">
			<div class="big">&#129504;</div>
			<h2>Блок квиза пройден!</h2>
			<p id="celebrateQuizStats"></p>
		</div>
	</div>
	
	<div class="nav-row" id="navRow">
		<button class="nav-btn forgot" id="forgotBtn" style="display:none;">&#128565; Забыл</button>
		<button class="nav-btn know" id="knowBtn" style="display:none;">&#128170; Знаю</button>
		<button class="nav-btn wide" id="againBtn" style="display:none;">&#128257; Пройти блок ещё раз</button>
	</div>
	
	<div class="nav-row" id="practiceNavRow" style="display:none;">
		<button class="run-btn" id="runBtn">&#9654; Проверить код</button>
		<button class="nav-btn wide" id="againPracticeBtn" style="display:none;">&#128257; Пройти блок ещё раз</button>
	</div>
	<div class="practice-links" id="practiceLinks" style="display:none;">
		<button class="practice-link" id="skipBtn">Пропустить задачу &#8594;</button>
		
		<button class="practice-link" id="solutionBtn">Показать решение</button>
		<button class="practice-link" id="restartCodeBtn">Начать код заново</button>
	</div>
	
	<div class="nav-row" id="quizNavRow" style="display:none;">
		<button class="nav-btn wide" id="quizNextBtn" style="display:none;">Дальше &#8594;</button>
		<button class="nav-btn wide" id="quizAgainBtn" style="display:none;">&#128257; Пройти блок ещё раз</button>
	</div>
	
	<div class="reset-row" id="resetRow"><button class="reset-link" id="resetBtn">Сбросить прогресс этого блока</button></div>
</div>


<script id="cards-data" type="application/json">[{"title": "📗 ЧАСТЬ 1 · БЛОК 1. АРГУМЕНТЫ И REST", "cards": [{"q": "**В паре `function greet(name) {...}` и вызове `greet(\"Анна\")` — что здесь параметр, а что аргумент?**", "a": "`name` — параметр (переменная в объявлении функции). `\"Анна\"` — аргумент (конкретное значение, переданное при вызове)."}, {"q": "**Как аргументы сопоставляются с параметрами при вызове?**\n```js\nfunction subtract(a, b) {\n  return a - b;\n}\nsubtract(10, 3);\nsubtract(3, 10);\nsubtract(10);\n```", "a": "По позиции: первый аргумент → первый параметр, и т.д. `subtract(10,3)` → `7`, `subtract(3,10)` → `-7`, `subtract(10)` → `NaN` (пропущенный параметр `b` становится `undefined`, `10 - undefined = NaN`)."}, {"q": "**Что выведут 4 вызова этой функции?**\n```js\nfunction greet(name = \"Гость\") {\n  return `Привет, ${name}!`;\n}\ngreet();\ngreet(undefined);\ngreet(null);\ngreet(\"\");\n```", "a": "`\"Привет, Гость!\"`, `\"Привет, Гость!\"`, `\"Привет, null!\"`, `\"Привет, !\"`. Значение по умолчанию срабатывает **только** когда аргумент равен `undefined` (или пропущен). `null` и пустая строка `\"\"` — это тоже значения, и они **сохраняются**, значение по умолчанию их не заменяет."}, {"q": "**Почему значение параметра по умолчанию — это НЕ проверка «заполненности» поля?**", "a": "Потому что оно реагирует только на `undefined`. Если пользователь явно передал `null` или `\"\"` (например, из пустого поля формы), дефолт не подставится — значит, нельзя полагаться на `name = \"Гость\"` как на валидацию «поле не пустое»."}, {"q": "**Что делает `...numbers` в объявлении функции и что выведет код?**\n```js\nfunction sum(...numbers) {\n  let total = 0;\n  for (const n of numbers) total += n;\n  return total;\n}\nsum(5, 7, 9, 11);\nsum();\n```", "a": "`...numbers` — rest-параметр: собирает ВСЕ переданные аргументы в настоящий массив. `sum(5,7,9,11)` → `32`, `sum()` → `0` (массив пустой, но существует)."}, {"q": "**Можно ли поставить rest-параметр не последним, например `function f(...rest, last) {}`?**", "a": "Нет, это `SyntaxError`. Rest-параметр всегда должен стоять **последним** в списке параметров — после него нельзя объявлять другие параметры."}, {"q": "**Что выведет этот код с дефолтом и rest вместе?**\n```js\nfunction test(a = 5, ...rest) {\n  console.log(a);\n  console.log(rest);\n}\ntest(undefined, 10, 20);\n```", "a": "`5` (первый аргумент `undefined` → срабатывает дефолт), затем `[10, 20]` (все остальные аргументы ушли в rest-массив)."}, {"q": "**Есть ли у стрелочных функций собственный объект `arguments`?**", "a": "Нет. У обычной `function` есть собственный `arguments` (псевдомассив всех переданных значений). У стрелочной функции своего `arguments` нет — если внутри стрелочной функции написать `arguments`, JavaScript будет искать его в ближайшей обычной функции-родителе (а если такой нет — будет `ReferenceError`)."}, {"q": "**НАЙДИ ОШИБКУ. Что здесь не так, если хотели получить сумму первых двух конкретных аргументов + остальные отдельно?**\n```js\nfunction process(...items, a, b) {\n  return [a, b, items];\n}\n```", "a": "`SyntaxError: Rest parameter must be last formal parameter`. Rest обязан идти последним — нужно переставить: `function process(a, b, ...items) {}`."}, {"q": "**Реши в уме: что выведет?**\n```js\nfunction greet(name = \"Гость\", greeting = \"Привет\") {\n  return `${greeting}, ${name}!`;\n}\nconsole.log(greet(undefined, \"Добрый день\"));\n```", "a": "`\"Добрый день, Гость!\"` — первый аргумент `undefined` включает дефолт для `name`, второй аргумент `\"Добрый день\"` передан явно и заменяет дефолт для `greeting`."}, {"q": "**Сопоставь по памяти: 4 визуальные аналогии аргументов из урока — «один аргумент», «аргумент пропущен», «запасное значение», «rest собирает массив». Объясни своими словами каждую.**", "a": "Один аргумент — обычная передача значения. Аргумент пропущен — параметр получает `undefined`. Запасное значение — срабатывает значение по умолчанию (только для `undefined`). Rest собирает массив — `...rest` упаковывает все «лишние» аргументы в реальный массив."}, {"q": "**Что выведет вызов с лишними (незадекларированными) аргументами?**\n```js\nfunction greet(name) {\n  return `Привет, ${name}!`;\n}\nconsole.log(greet(\"Анна\", \"Борис\", \"Вера\"));\n```", "a": "`\"Привет, Анна!\"` — лишние аргументы (`\"Борис\"`, `\"Вера\"`) просто игнорируются, если для них нет параметров. Ошибки не будет."}]}, {"title": "📘 ЧАСТЬ 1 · БЛОК 2. ДЕСТРУКТУРИЗАЦИЯ", "cards": [{"q": "**Что делает деструктуризация объекта и что выведет код?**\n```js\nconst user = { name: \"Анна\", age: 28, city: \"Хайфа\" };\nconst { name, city } = user;\nconsole.log(name);\nconsole.log(city);\n```", "a": "`\"Анна\"`, `\"Хайфа\"`. Деструктуризация объекта выбирает свойства **по имени**: имена слева должны совпадать с ключами справа. Порядок свойств не важен, а сам объект `user` остаётся без изменений."}, {"q": "**Как переименовать свойство при деструктуризации и задать значение по умолчанию одновременно?**\n```js\nconst user = { name: \"Анна\" };\nconst {\n  name: userName,\n  city = \"Неизвестно\"\n} = user;\n```", "a": "`name: userName` — создаёт переменную `userName` со значением свойства `name` (а не переменную `name`). `city = \"Неизвестно\"` — так как у `user` нет свойства `city`, переменная `city` получает значение по умолчанию. Итог: `userName === \"Анна\"`, `city === \"Неизвестно\"`."}, {"q": "**Что выведет вложенная деструктуризация?**\n```js\nconst user = {\n  address: { city: \"Хайфа\" }\n};\nconst { address: { city } } = user;\nconsole.log(city);\n```", "a": "`\"Хайфа\"`. Важная деталь: при таком шаблоне создаётся переменная `city`, но переменная `address` **не создаётся** — `address:` здесь просто указывает путь, а не создаёт отдельную переменную."}, {"q": "**В предыдущем примере — можно ли после `const { address: { city } } = user;` обратиться к переменной `address`?**", "a": "Нет, `ReferenceError: address is not defined`. `address` в шаблоне деструктуризации — это только путь к вложенному свойству, самостоятельной переменной он не становится (в отличие от `city`, которая объявляется explicit)."}, {"q": "**Что выведет деструктуризация массива с пропуском элемента?**\n```js\nconst colors = [\"red\", \"green\", \"blue\"];\nconst [first, , third] = colors;\nconsole.log(first);\nconsole.log(third);\n```", "a": "`\"red\"`, `\"blue\"`. Массив выбирает значения **по позиции** (индексу), а не по имени. Пустое место между запятыми (`, ,`) пропускает элемент с индексом 1 (`\"green\"`), не создавая для него переменную."}, {"q": "**Как с помощью деструктуризации массива поменять местами значения двух переменных без временной переменной?**\n```js\nlet a = 10, b = 20;\n// однострочный обмен\n```", "a": "```js\n[a, b] = [b, a];\n```\nСправа строится временный массив `[b, a]` (то есть `[20, 10]`), а слева он тут же деструктурируется обратно в `a` и `b` — элегантный обмен значениями без вспомогательной переменной."}, {"q": "**В чём принципиальная разница между `{ city } = user` и `[first] = colors` — как каждая структура выбирает значение?**", "a": "Объект выбирает по **имени** свойства (ключу) — порядок не важен. Массив выбирает по **позиции** (индексу) — порядок критичен. Одинаковые фигурные/квадратные скобки слева означают разные правила выбора в зависимости от того, что деструктурируется справа."}, {"q": "**Что выведет деструктуризация прямо в параметрах функции?**\n```js\nfunction printUser({ name, age }) {\n  return `${name}, ${age} лет`;\n}\nprintUser({ name: \"Анна\", age: 28 });\n```", "a": "`\"Анна, 28 лет\"`. Функция получает один аргумент-объект, а деструктуризация в параметрах сразу «распаковывает» из него нужные свойства — не нужно внутри функции писать `user.name`, `user.age`."}, {"q": "**НАЙДИ ОШИБКУ. Что будет при вызове без аргумента?**\n```js\nfunction printUser({ name, age }) {\n  return `${name}, ${age} лет`;\n}\nprintUser();\n```", "a": "`TypeError: Cannot destructure property 'name' of 'undefined' as it is undefined.` Деструктуризация пытается прочитать свойства из `undefined` (аргумент не передан) — это ошибка. Чтобы защититься, нужно значение по умолчанию для всего объекта: `function printUser({ name, age } = {})`."}, {"q": "**Реши в уме: что выведет вложенная деструктуризация с дефолтом на отсутствующем пути?**\n```js\nconst user = { address: { city: \"Хайфа\" } };\nconst { address: { street = \"—\" } } = user;\nconsole.log(street);\n```", "a": "`\"—\"`. У вложенного объекта `address` нет свойства `street`, поэтому срабатывает значение по умолчанию `\"—\"`."}, {"q": "**Собери по памяти 4 визуальные идеи деструктуризации из урока: «выбор по имени», «выбор по позиции», «вложенный объект», «обмен значениями». Приведи код на каждую.**", "a": "Выбор по имени: `const { name } = user;`. Выбор по позиции: `const [first] = arr;`. Вложенный объект: `const { address: { city } } = user;`. Обмен значениями: `[a, b] = [b, a];`."}, {"q": "**Что выведет, если в шаблоне деструктуризации объекта указать свойство, которого нет, без значения по умолчанию?**\n```js\nconst user = { name: \"Илья\" };\nconst { name, city } = user;\nconsole.log(city);\n```", "a": "`undefined`. Если свойства нет в объекте и дефолтного значения не задано — переменная просто получает `undefined`, ошибки не возникает (в отличие от попытки деструктурировать сам `undefined` как объект)."}]}, {"title": "📙 ЧАСТЬ 1 · БЛОК 3. ПРОТОТИПЫ И КЛАССЫ", "cards": [{"q": "**Что делает `Object.create(animal)` и что выведет код?**\n```js\nconst animal = {\n  eats: true,\n  walk() { return \"Идёт\"; }\n};\nconst dog = Object.create(animal);\ndog.name = \"Рекс\";\ndog.eats;\ndog.walk();\n```", "a": "`true`, `\"Идёт\"`. `Object.create(animal)` создаёт новый объект `dog`, у которого прототипом (объектом для поиска «наследуемых» свойств) становится `animal`. Сам `dog` хранит только `name`, а `eats` и `walk` JavaScript находит в `animal` через прототипную цепочку."}, {"q": "**Опиши по шагам: как JavaScript ищет свойство `dog.walk`, если у самого `dog` такого свойства нет?**", "a": "JavaScript проверяет каждый объект цепочки по очереди: сначала сам `dog` → если не найдено, его прототип `animal` → если не найдено, `Object.prototype` → если не найдено, `null` (конец цепочки). Поиск останавливается на первом найденном совпадении. Если дошли до `null` — результат `undefined`."}, {"q": "**Что выведет код про собственное и унаследованное свойство?**\n```js\nconst animal = { eats: true };\nconst dog = Object.create(animal);\ndog.eats = false;\nconsole.log(dog.eats);\nconsole.log(animal.eats);\n```", "a": "`false`, `true`. Присваивание `dog.eats = false` создаёт **собственное** свойство `eats` прямо на `dog`, которое перекрывает (затеняет) одноимённое свойство прототипа — не изменяя сам `animal`."}, {"q": "**Что выведет код с `Object.hasOwn` и `delete`?**\n```js\nconst animal = { eats: true };\nconst dog = Object.create(animal);\ndog.eats = false;\nObject.hasOwn(dog, \"eats\"); // ?\ndelete dog.eats;\nconsole.log(dog.eats); // ?\n```", "a": "`true` (у `dog` ЕСТЬ собственное свойство `eats`, поэтому `Object.hasOwn` → `true`). После `delete dog.eats` собственное свойство удаляется, и чтение `dog.eats` снова «проваливается» по прототипной цепочке к `animal.eats` → `true`."}, {"q": "**Как создать класс и экземпляр, и что выведет код?**\n```js\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  walk() {\n    return `${this.name} идёт`;\n  }\n}\nconst rex = new Animal(\"Рекс\");\nrex.walk();\n```", "a": "`\"Рекс идёт\"`. `new Animal(\"Рекс\")` создаёт экземпляр и сразу запускает `constructor`. `name` хранится в самом экземпляре `rex`, а метод `walk` находится не в `rex`, а в `Animal.prototype` — JavaScript находит его через прототипную цепочку."}, {"q": "**Что делает `extends` и что обязательно нужно вызвать в конструкторе дочернего класса ДО обращения к `this`?**\n```js\nclass Dog extends Animal {\n  constructor(name, breed) {\n    super(name);\n    this.breed = breed;\n  }\n  bark() { return \"Гав!\"; }\n}\n```", "a": "`extends` задаёт наследование — `Dog` получает весь функционал `Animal`. `super(name)` обязательно вызывается **первым**, до любого обращения к `this` — он запускает родительский конструктор `Animal`, который и инициализирует `this.name`. Без `super()` обращение к `this` в конструкторе дочернего класса вызовет ошибку."}, {"q": "**Опиши по шагам поиск метода `rex.walk()`, если `rex = new Dog(\"Рекс\", \"Лабрадор\")`, а в `Dog` метод `walk` не переопределён.**", "a": "1) JavaScript смотрит на сам экземпляр `rex` — там только `name` и `breed`, `walk` нет. 2) Смотрит в `Dog.prototype` — там `bark`, но `walk` нет. 3) Смотрит в `Animal.prototype` — находит `walk`, поиск останавливается. 4) Метод вызывается с `this === rex`, поэтому результат — `\"Рекс идёт\"` (имя берётся из экземпляра, а сам метод — из прототипа родителя)."}, {"q": "**Что выведет код с переопределением метода и `super.walk()`?**\n```js\nclass Dog extends Animal {\n  walk() {\n    return super.walk() + \" и бежит\";\n  }\n}\nconst rex = new Dog(\"Рекс\");\nconsole.log(rex.walk());\n```", "a": "`\"Рекс идёт и бежит\"`. `Dog.prototype.walk` перекрывает родительский метод `Animal.prototype.walk` (JavaScript находит метод `walk` уже в `Dog.prototype`, не доходя до `Animal.prototype`). Но `super.walk()` внутри явно вызывает именно родительскую реализацию и дополняет её результат."}, {"q": "**Предскажи 3 результата:**\n```js\nconst rex = new Animal(\"Рекс\");\nconst cat = new Animal(\"Мурка\");\nconsole.log(rex.walk === cat.walk);\nconsole.log(Object.hasOwn(rex, \"walk\"));\nconsole.log(Object.hasOwn(rex, \"name\"));\n```", "a": "`true`, `false`, `true`. Метод `walk` хранится ОДИН раз в `Animal.prototype` и используется всеми экземплярами — поэтому `rex.walk === cat.walk` (это буквально одна и та же функция в памяти). У `rex` собственного `walk` нет (`hasOwn` → `false`), а `name` — собственное свойство экземпляра (`hasOwn` → `true`)."}, {"q": "**НАЙДИ ОШИБКУ. Что будет, если в конструкторе дочернего класса обратиться к `this` ДО вызова `super()`?**\n```js\nclass Dog extends Animal {\n  constructor(name, breed) {\n    this.breed = breed; // до super()\n    super(name);\n  }\n}\n```", "a": "`ReferenceError: Must call super constructor in this before accessing 'this' or returning from derived constructor`. В классе с `extends` объект `this` не существует, пока не отработает родительский конструктор через `super()` — поэтому `super(name)` обязан идти первой строкой до любого использования `this`."}, {"q": "**Собери по памяти: 4 визуальные идеи прототипов из урока — «метод у родителя», «поиск по цепочке», «собственное свойство», «расширение поведения». Приведи по строке кода на каждую.**", "a": "Метод у родителя: `class Animal { walk() {...} }`. Поиск по цепочке: `dog.walk()` ищет вверх, пока не найдёт. Собственное свойство: `dog.eats = false` перекрывает прототип. Расширение поведения: `class Dog extends Animal { walk() { return super.walk() + \"...\"; } }`."}, {"q": "**Чем принципиально отличается `Object.create` + обычные объекты от `class` + `new`, если результат (прототипная цепочка) похож?**", "a": "`Object.create(animal)` вручную создаёт объект с явно указанным прототипом — низкоуровневый механизм. `class`/`new`/`extends` — это более читаемый синтаксис поверх того же самого прототипного наследования: `constructor` играет роль инициализации, а методы класса автоматически попадают в `ClassName.prototype`, как и при ручном `Object.create`."}]}, {"title": "📕 ЧАСТЬ 2 · БЛОК 4. SPREAD И КОПИРОВАНИЕ", "cards": [{"q": "**В чём разница между rest (`...numbers` в параметрах) и spread (`...values` при вызове)?**\n```js\nfunction sum(...numbers) {\n  let total = 0;\n  for (const n of numbers) total += n;\n  return total;\n}\nconst values = [10, 20, 30];\nsum(...values);\n```", "a": "`42` не подходит — тут правильный ответ `60`. Rest (в объявлении параметров) **собирает** отдельные значения в один массив. Spread (при вызове/в литерале) делает обратное — **разворачивает** массив обратно в отдельные значения. `sum(...values)` передаёт элементы `values` как три отдельных аргумента: `sum(10, 20, 30)`."}, {"q": "**Что выведет код с объединением массивов через spread и отдельным копированием?**\n```js\nconst first = [1, 2];\nconst second = [3, 4];\nconst all = [0, ...first, ...second];\nconst copy = [...first];\ncopy.push(9);\nconsole.log(all);\nconsole.log(first);\nconsole.log(copy);\n```", "a": "`[0, 1, 2, 3, 4]`, `[1, 2]`, `[1, 2, 9]`. `[0, ...first, ...second]` разворачивает оба массива по порядку записи в новый массив. `[...first]` создаёт НОВЫЙ массив (копию) — поэтому `copy.push(9)` не влияет на `first`."}, {"q": "**Чем простое присваивание `const other = user;` отличается от копирования через spread `const copy = { ...user };`?**\n```js\nconst user = { age: 28 };\nconst other = user;\nother.age = 30;\nconsole.log(user.age);\nconsole.log(user === other);\n```", "a": "`30`, `true`. Простое присваивание НЕ создаёт копию — `other` и `user` это две переменные, ссылающиеся на один и тот же объект в памяти. Изменение через `other.age = 30` виднo и через `user`, потому что это буквально один объект."}, {"q": "**Что выведет spread-копирование объекта и что оно доказывает про независимость копий верхнего уровня?**\n```js\nconst user = { name: \"Анна\", age: 28 };\nconst updated = { ...user, age: 30 };\nconsole.log(user.age);\nconsole.log(updated.age);\nconsole.log(user === updated);\n```", "a": "`28`, `30`, `false`. `{ ...user }` создаёт НОВЫЙ объект-обёртку (`user !== updated`), копируя его собственные перечисляемые свойства. `age: 30` после spread перезаписывает скопированное значение `age` только в `updated`, не трогая `user`."}, {"q": "**Почему это называют «поверхностным копированием» (shallow copy)? Что выведет код?**\n```js\nconst user = { address: { city: \"Хайфа\" } };\nconst copy = { ...user };\ncopy.address.city = \"Тель-Авив\";\nconsole.log(user === copy);\nconsole.log(user.address === copy.address);\nconsole.log(user.address.city);\n```", "a": "`false`, `true`, `\"Тель-Авив\"`. Spread копирует только **значения свойств верхнего уровня**. Значением свойства `address` является ссылка на объект — spread копирует эту ссылку, а не создаёт новый вложенный объект. Поэтому `user.address` и `copy.address` — один и тот же объект, и изменение через `copy` видно и в `user`."}, {"q": "**Как сделать независимую копию и вложенного объекта тоже? Что выведет такой код?**\n```js\nconst user = { address: { city: \"Хайфа\" } };\nconst copy = { ...user, address: { ...user.address } };\ncopy.address.city = \"Эйлат\";\nconsole.log(user.address === copy.address);\nconsole.log(user.address.city);\n```", "a": "`false`, `\"Хайфа\"`. Явно разворачивая `{ ...user.address }` отдельно, мы создаём новый объект и для вложенного уровня тоже — теперь `user.address` и `copy.address` это разные объекты, и `user.address.city` не меняется. Более глубокие уровни (если бы они были) всё ещё остались бы общими — копировать нужно на каждом уровне, который собираетесь менять."}, {"q": "**Что выведет код про порядок spread и перезапись одноимённых свойств?**\n```js\nconst user = { age: 28 };\nconst r1 = { ...user, age: 30 };\nconst r2 = { age: 30, ...user };\nconsole.log(r1.age);\nconsole.log(r2.age);\n```", "a": "`30`, `28`. При совпадении имён свойств побеждает **последнее по порядку** присвоенное значение. В `r1` `age: 30` идёт ПОСЛЕ `...user`, поэтому перезаписывает его. В `r2` `age: 30` идёт ДО `...user`, поэтому `...user` (с `age: 28`) перезаписывает его обратно."}, {"q": "**НАЙДИ ОШИБКУ. Разработчик думал, что spread делает полную («глубокую») копию. Что пойдёт не так?**\n```js\nconst state = { user: { name: \"Анна\" }, count: 0 };\nconst newState = { ...state, count: 1 };\nnewState.user.name = \"Илья\";\nconsole.log(state.user.name);\n```", "a": "`\"Илья\"` — ошибка! Разработчик ожидал `\"Анна\"`, но spread копирует только верхний уровень. `newState.user` — это та же ссылка, что и `state.user`, так что изменение `newState.user.name` затронуло и `state`. Частая ловушка при работе с состоянием (React/Redux и подобные паттерны)."}, {"q": "**Собери по памяти: 4 визуальные идеи из урока про spread — «spread разворачивает», «объединение массивов», «вложенный объект общий», «вложенные копии разные». Поясни каждую одной фразой.**", "a": "Spread разворачивает: `...arr` превращает массив в отдельные элементы. Объединение массивов: `[...a, ...b]` склеивает по порядку. Вложенный объект общий: `{ ...obj }` копирует только ссылку на вложенный объект. Вложенные копии разные: если явно сделать `{ ...obj.nested }` на каждом уровне — объекты станут независимыми."}, {"q": "**Реши в уме: что выведет обновление товара через spread?**\n```js\nconst product = { title: \"Ноутбук\", price: 3000, options: { color: \"black\" } };\nconst sale = { ...product, price: 2700 };\nsale.options.color = \"silver\";\nconsole.log(product.price, sale.price, product.options.color);\n```", "a": "`3000 2700 \"silver\"`. `price` — примитив, скопирован независимо, и `sale.price` переопределён явно → у `product` остаётся `3000`. А `options` — объект, его ссылка общая для обоих, поэтому изменение `sale.options.color` видно и через `product.options.color`."}, {"q": "**Чем спред-объект `{ ...obj }` отличается от `Object.assign({}, obj)` по глубине копирования?**", "a": "Они эквивалентны по глубине — оба делают **поверхностную** (shallow) копию: только свойства верхнего уровня копируются как новые значения, а вложенные объекты/массивы остаются общими ссылками. `{ ...obj }` — просто более новый и короткий синтаксис для того же результата."}, {"q": "**Что безопаснее для копирования массива: `arr.slice()`, `[...arr]` или `arr` (простое присваивание)? Почему?**", "a": "И `arr.slice()`, и `[...arr]` создают НОВЫЙ массив (поверхностную копию) — оба безопасны для независимого изменения верхнего уровня. Простое присваивание `const copy = arr;` НЕ копирует ничего — `copy` и `arr` это один и тот же массив, изменения через любую переменную видны через обе."}]}, {"title": "📔 ЧАСТЬ 2 · БЛОК 5. ЗАМЫКАНИЯ", "cards": [{"q": "**Что такое лексическая область видимости и что выведет код?**\n```js\nconst message = \"Снаружи\";\nfunction outer() {\n  const message = \"Внутри outer\";\n  function inner() {\n    console.log(message);\n  }\n  inner();\n}\nouter();\n```", "a": "`\"Внутри outer\"`. Функция ищет переменную сначала в своём собственном окружении, затем — в окружении, где она была СОЗДАНА (а не откуда вызвана). `inner` создана внутри `outer`, поэтому находит `message` из `outer`, даже не заглядывая на внешний уровень модуля."}, {"q": "**Что выведет код и почему это возможно, ведь `makeGreeting` уже завершила выполнение?**\n```js\nfunction makeGreeting(name) {\n  return function () {\n    return `Привет, ${name}!`;\n  };\n}\nconst greetAnna = makeGreeting(\"Анна\");\nconsole.log(greetAnna());\n```", "a": "`\"Привет, Анна!\"`. Это и есть замыкание (closure): возвращённая функция «запоминает» окружение, в котором была создана, и продолжает иметь к нему доступ — даже после того, как внешняя функция `makeGreeting` уже отработала и обычно её локальные переменные должны были бы исчезнуть."}, {"q": "**Что выведет «счётчик с закрытым состоянием»?**\n```js\nfunction createCounter() {\n  let count = 0;\n  return function () {\n    count += 1;\n    return count;\n  };\n}\nconst next = createCounter();\nnext();\nnext();\n```", "a": "`1`, затем `2`. Переменная `count` «закрыта» внутри замыкания — снаружи нет прямого доступа к ней (`createCounter.count` не существует), но возвращённая функция хранит к ней доступ и изменяет её между вызовами."}, {"q": "**Что выведет создание ДВУХ независимых счётчиков?**\n```js\nconst first = createCounter();\nconst second = createCounter();\nfirst();  // ?\nfirst();  // ?\nsecond(); // ?\nfirst();  // ?\n```", "a": "`1`, `2`, `1`, `3`. Каждый вызов `createCounter()` создаёт СВОЁ собственное окружение с собственной переменной `count`. `first` и `second` — это два полностью независимых замыкания: вызовы `second()` никак не влияют на счётчик `first`."}, {"q": "**Что выведет «фабрика множителей» — два независимых вызова с разным `factor`?**\n```js\nfunction createMultiplier(factor) {\n  return function (number) {\n    return number * factor;\n  };\n}\nconst double = createMultiplier(2);\nconst triple = createMultiplier(3);\ndouble(10);\ntriple(10);\n```", "a": "`20`, `30`. `factor` — это параметр-настройка, зафиксированная в момент создания функции (`createMultiplier(2)` создаёт замыкание с `factor=2`). `number` — приходит отдельно, при каждом вызове самой возвращённой функции."}, {"q": "**Как замыкание используется в обработчике события и что оно сохраняет?**\n```js\nfunction setupCounter(button) {\n  let count = 0;\n  button.addEventListener(\"click\", () => {\n    count += 1;\n    button.textContent = `Клики: ${count}`;\n  });\n}\nsetupCounter(document.querySelector(\"#counter\"));\n```", "a": "Обработчик клика — это функция, которая выполнится значительно позже (при клике пользователя), но благодаря замыканию она сохраняет доступ и к `count`, и к `button` из окружения `setupCounter`, даже когда сама `setupCounter` уже давно завершила выполнение."}, {"q": "**НАЙДИ ОШИБКУ. Программист хотел получить независимые счётчики для каждой кнопки на странице, но все кнопки показывают одно и то же число. Что не так?**\n```js\nlet count = 0; // снаружи, одна на всех\nfunction attachCounter(button) {\n  button.addEventListener(\"click\", () => {\n    count += 1;\n    button.textContent = count;\n  });\n}\ndocument.querySelectorAll(\"button\").forEach(attachCounter);\n```", "a": "`count` объявлена СНАРУЖИ `attachCounter`, поэтому все обработчики замыкают одну и ту же общую переменную — клик по любой кнопке увеличивает общий счётчик. Чтобы получить независимые счётчики, `let count = 0;` нужно перенести ВНУТРЬ `attachCounter`, чтобы каждый вызов создавал своё собственное замыкание."}, {"q": "**Почему замыкание можно сравнить с «рюкзаком», который функция берёт с собой?**", "a": "Когда функция создаётся внутри другой функции, она «забирает с собой» доступ к переменным окружения, в котором родилась — как рюкзак с нужными вещами. Даже если «дом» (внешняя функция) уже «снесли» (функция завершила выполнение), функция всё ещё может пользоваться тем, что «унесла с собой» в замыкании."}, {"q": "**Реши в уме: что выведет комбинация счётчика и сброса через новое замыкание?**\n```js\nfunction createCounter() {\n  let count = 0;\n  return {\n    next: () => ++count,\n    reset: () => { count = 0; }\n  };\n}\nconst c = createCounter();\nc.next();\nc.next();\nc.reset();\nconsole.log(c.next());\n```", "a": "`1`. `next` и `reset` — это ДВЕ функции, замыкающие ОДНУ и ту же переменную `count` (одно и то же окружение `createCounter`). `reset()` обнуляет `count`, поэтому следующий `next()` снова начинает с `1`."}, {"q": "**Можно ли назвать переменную цикла `let i` в `for` своеобразным мини-замыканием на каждой итерации? Почему это важно для `setTimeout`?**", "a": "Да — `let` в заголовке `for` создаёт ОТДЕЛЬНУЮ привязку переменной на каждую итерацию цикла. Если внутри цикла создать функцию (например, колбэк для `setTimeout`), она замкнёт именно «свою» версию `i`, а не одну общую переменную — это разбирается подробнее в следующем блоке (var/let/const)."}]}, {"title": "📒 ЧАСТЬ 2 · БЛОК 6. VAR / LET / CONST", "cards": [{"q": "**Кратко сформулируй разницу между `var`, `let` и `const`.**", "a": "`const` — привязка БЕЗ переприсваивания (`x = ...` после объявления вызовет ошибку). `let` — привязка С переприсваиванием. `var` — область видимости ФУНКЦИИ (а не блока), встречается в старом коде, в современном JS почти не используется."}, {"q": "**Что выведет код про область видимости блока и функции?**\n```js\n{\n  let inside = 10;\n  var visible = 20;\n}\nconsole.log(visible);\nconsole.log(inside);\n```", "a": "`20`, затем `ReferenceError: inside is not defined`. `let` ограничена блоком `{}`, в котором объявлена — снаружи недоступна. `var` игнорирует границы блока — она привязана к функции (или глобальной области), поэтому `visible` доступна и после закрывающей `}`."}, {"q": "**Что такое hoisting и TDZ? Что выведет код?**\n```js\nconsole.log(a); // ?\nvar a = 10;\n\nconsole.log(b); // ?\nlet b = 10;\n```", "a": "`undefined`, затем `ReferenceError: Cannot access 'b' before initialization`. Обе переменные технически «поднимаются» (hoisting) к началу области видимости, но по-разному: `var` сразу инициализируется значением `undefined`, а `let`/`const` остаются в «мёртвой зоне» (Temporal Dead Zone, TDZ) — недоступны для чтения до строки, где они фактически объявлены."}, {"q": "**Что выведет код про `const` и изменение свойств объекта?**\n```js\nconst user = { name: \"Анна\" };\nuser.name = \"Илья\"; // ?\nuser = { name: \"Мария\" }; // ?\n```", "a": "Первая строка — ДОПУСТИМО (`user.name` становится `\"Илья\"`). Вторая строка — `TypeError: Assignment to constant variable`. `const` фиксирует ПРИВЯЗКУ переменной к конкретному объекту (нельзя переприсвоить саму переменную), но НЕ делает сам объект неизменяемым — его свойства по-прежнему можно менять."}, {"q": "**Классический пример: что выведут два похожих цикла с `var` и `let` + `setTimeout`?**\n```js\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 100);\n}\nfor (let j = 0; j < 3; j++) {\n  setTimeout(() => console.log(j), 100);\n}\n```", "a": "Первый цикл выведет `3 3 3`, второй — `0 1 2`. `var` создаёт ОДНУ общую переменную `i` на весь цикл — к моменту срабатывания колбэков (через 100мс, когда цикл уже полностью завершился) `i` равна `3` для всех трёх вызовов. `let` создаёт ОТДЕЛЬНУЮ привязку переменной `j` на каждую итерацию — каждый колбэк замыкает «своё» значение."}, {"q": "**Почему именно `setTimeout` «обнажает» разницу между `var` и `let` в цикле — что происходит по времени?**", "a": "Колбэки `setTimeout` выполняются ПОЗЖЕ, когда синхронный цикл уже полностью завершён. С `var` к этому моменту существует только одна (общая) переменная `i`, и она уже равна конечному значению. С `let` каждая итерация оставила «свою» версию переменной с тем значением, которое было на момент этой итерации."}, {"q": "**Что выведет попытка прочитать переменную в её Temporal Dead Zone?**\n```js\nif (true) {\n  console.log(score); // ?\n  let score = 10;\n}\n```", "a": "`ReferenceError: Cannot access 'score' before initialization`. До строки `let score = 10;` переменная `score` формально уже существует (привязка создана при входе в блок), но находится в TDZ — читать её запрещено. Если эта ошибка не перехвачена `try/catch`, выполнение остановится раньше, чем дойдёт до самого объявления."}, {"q": "**НАЙДИ ОШИБКУ. Почему этот код выбросит ошибку, хотя выглядит логично?**\n```js\nfunction getDiscount(price) {\n  if (price > 100) {\n    const discount = price * 0.1;\n  } else {\n    const discount = 0;\n  }\n  return discount;\n}\n```", "a": "`ReferenceError: discount is not defined`. Обе переменные `discount` объявлены через `const` ВНУТРИ блоков `if`/`else` — у `const`/`let` блочная область видимости, поэтому снаружи (`return discount;`) переменной не существует. Нужно объявить `let discount;` ДО `if`, а внутри блоков только присваивать значение."}, {"q": "**Реши в уме: сколько раз одна и та же переменная `var x` может быть объявлена в одной функции без ошибки?**\n```js\nfunction f() {\n  var x = 1;\n  var x = 2;\n  console.log(x);\n}\n```", "a": "`2`. Повторное объявление через `var` в той же области видимости НЕ вызывает ошибку — просто последнее присваивание побеждает. (Для сравнения: `let x = 1; let x = 2;` в одной области видимости — это `SyntaxError: Identifier 'x' has already been declared`.)"}, {"q": "**Собери по памяти 4 визуальные идеи урока про var/let/const — «переменная внутри блока», «объект при const меняется», «доступ до let запрещён», «let для каждой итерации». Поясни каждую.**", "a": "Переменная внутри блока: `let`/`const` не «выходят» за `{}`. Объект при `const` меняется: привязка переменной фиксирована, но свойства объекта — нет. Доступ до `let` запрещён: TDZ не даёт прочитать переменную раньше её строки объявления. `let` для каждой итерации: в цикле `for` каждая итерация получает свою отдельную привязку переменной."}, {"q": "**Почему в современном коде рекомендуют почти всегда использовать `const`, переключаясь на `let` только когда переменную реально нужно переприсвоить, и почти никогда не использовать `var`?**", "a": "`const` сразу сигнализирует другим разработчикам (и самому коду), что привязка не будет меняться — это снижает количество случайных ошибок и упрощает чтение кода. `let` явно показывает «эта переменная будет меняться». `var` же из-за function-scope и hoisting-без-TDZ создаёт менее предсказуемое поведение (как показано в примерах с циклом и `setTimeout`) и сегодня используется в основном в старом (legacy) коде."}]}, {"title": "📓 ЧАСТЬ 2 · БЛОК 7. ИСКЛЮЧЕНИЯ И ОБЩИЙ ПРИМЕР", "cards": [{"q": "**Что выведет код и почему «Шаг 2» не выводится?**\n```js\ntry {\n  console.log(\"Шаг 1\");\n  const user = null;\n  console.log(user.name);\n  console.log(\"Шаг 2\");\n} catch (error) {\n  console.log(error.name);\n}\nconsole.log(\"Шаг 3\");\n```", "a": "`\"Шаг 1\"`, `\"TypeError\"`, `\"Шаг 3\"`. Ошибка (обращение к `.name` на `null`) немедленно прерывает дальнейшее выполнение кода внутри `try` — строка `\"Шаг 2\"` никогда не выполнится. Управление сразу переходит в `catch`, а после него код продолжается как обычно."}, {"q": "**Опиши порядок выполнения `try / catch / finally` для ДВУХ случаев: когда ошибки нет и когда ошибка есть.**", "a": "Без ошибки: `try` (весь код) → `catch` пропускается → `finally`. С ошибкой: `try` (до места ошибки) → `catch` (обработка) → `finally`. В обоих случаях `finally` выполняется ВСЕГДА — его используют для завершающих действий (закрыть соединение, снять флаг загрузки и т.п.), которые должны произойти в любом случае."}, {"q": "**Как `throw` передаёт управление и что выведет код?**\n```js\nfunction divide(a, b) {\n  if (b === 0) {\n    throw new Error(\"Деление на ноль\");\n  }\n  return a / b;\n}\ntry {\n  divide(10, 0);\n} catch (error) {\n  console.log(error.message);\n}\n```", "a": "`\"Деление на ноль\"`. `throw` немедленно прерывает выполнение текущей функции и передаёт управление к БЛИЖАЙШЕМУ подходящему `catch` вверх по стеку вызовов — минуя весь промежуточный код (включая `return a / b;`, до которого в этом случае дело не доходит)."}, {"q": "**Чем это собственное исключение отличается от обычного поведения деления на ноль в JS?**\n```js\nconsole.log(10 / 0);\n```", "a": "Обычное `10 / 0` в JavaScript НЕ бросает ошибку — оно возвращает `Infinity` (специальное числовое значение). Функция `divide` из прошлой карточки явно добавляет собственную проверку и осознанно выбрасывает `Error`, чтобы деление на ноль считалось в этой программе некорректным вводом, а не просто давало `Infinity`."}, {"q": "**Как «безопасно» прочитать JSON, не роняя программу при некорректных данных?**\n```js\nfunction parseUser(json) {\n  try {\n    return JSON.parse(json);\n  } catch (error) {\n    console.log(error.message);\n    return null;\n  } finally {\n    console.log(\"Попытка завершена\");\n  }\n}\nparseUser('{\"a\":1}');  // ?\nparseUser('not json'); // ?\n```", "a": "Первый вызов вернёт `{a: 1}` (корректный JSON распарсился нормально). Второй вызов вернёт `null` (`JSON.parse` выбросил `SyntaxError`, он пойман в `catch`, функция возвращает безопасный fallback `null` вместо падения всей программы). В обоих случаях в консоли также выведется `\"Попытка завершена\"` — `finally` срабатывает независимо от исхода."}, {"q": "**НАЙДИ ОШИБКУ. Почему внешний `try/catch` НЕ перехватит ошибку из `setTimeout`?**\n```js\ntry {\n  setTimeout(() => {\n    throw new Error(\"Ошибка таймера\");\n  }, 100);\n} catch (error) {\n  console.log(\"Поймано:\", error.message); // никогда не выполнится\n}\n```", "a": "К моменту, когда колбэк `setTimeout` реально выполняется (через 100мс), внешний блок `try` уже давно ЗАВЕРШИЛ своё выполнение — синхронный код в `try` закончился мгновенно, а колбэк запускается асинхронно, вне этого `try`. `try` должен находиться ВНУТРИ самого колбэка, чтобы перехватить ошибку, возникающую в момент его выполнения."}, {"q": "**В итоговом примере (регистрация пользователей) — что делает функция `createUser` и какие 2 проверки она выполняет перед тем как создать пользователя?**\n```js\nfunction createUser({ name, age, ...extra }) {\n  if (!name.trim()) {\n    throw new Error(\"Введите имя\");\n  }\n  if (!Number.isFinite(age) || age < 0) {\n    throw new Error(\"Проверьте возраст\");\n  }\n  return { ...extra, name: name.trim(), age };\n}\n```", "a": "Проверка 1: имя не должно быть пустым после удаления пробелов (`!name.trim()`). Проверка 2: возраст должен быть конечным числом и неотрицательным (`!Number.isFinite(age) || age < 0`). Если любая проверка не пройдена — функция выбрасывает `Error` с понятным сообщением вместо того, чтобы молча создать «плохого» пользователя."}, {"q": "**Предскажи результат «проверки приложения» из урока: что произойдёт в каждом из 5 сценариев?**\n- Анна, 28\n- Пустое имя\n- Пустой возраст\n- Возраст −1\n- Возраст 0", "a": "Анна, 28 — появляется новая запись в списке (всё валидно). Пустое имя — ошибка, список не меняется. Пустой возраст — ошибка (`Number.isFinite(\"\")` даёт `false`, т.к. это не число), список не меняется. Возраст −1 — ошибка (`age < 0`). Возраст 0 — ДОПУСТИМО по текущему правилу (`age < 0` не срабатывает на `0`), запись создаётся. После каждой попытки (успешной или нет) в консоли выводится сообщение из `finally`."}, {"q": "**Как `createUserManager` хранит список пользователей и что выведет код?**\n```js\nfunction createUserManager() {\n  const users = [];\n  return {\n    addUser(user) { users.push(user); },\n    getUsers() { return [...users]; }\n  };\n}\nconst manager = createUserManager();\nmanager.addUser({ name: \"Анна\", age: 28 });\nconst result = manager.getUsers();\nresult.push({ name: \"Fake\", age: 0 });\nconsole.log(manager.getUsers().length);\n```", "a": "`1`. `users` — переменная, «закрытая» в замыкании `createUserManager` (знакомый паттерн из блока про замыкания). `getUsers()` возвращает НОВЫЙ массив через spread `[...users]` — поэтому `result.push(...)` меняет только локальную копию `result`, а не внутренний `users` менеджера. Поэтому длина всё ещё `1`, даже после `result.push`."}, {"q": "**НАЙДИ ОШИБКУ. В предыдущем примере — если взять `manager.getUsers()[0]` и изменить его свойство напрямую, повлияет ли это на данные внутри менеджера?**\n```js\nconst result = manager.getUsers();\nresult[0].age = 99;\nconsole.log(manager.getUsers()[0].age);\n```", "a": "Да, повлияет: выведет `99`. `getUsers()` копирует только сам МАССИВ (spread `[...users]`), но НЕ копирует объекты пользователей внутри него — это та же самая ловушка «поверхностного копирования» (shallow copy), что и со spread объектов из блока 4. Чтобы защититься полностью, пришлось бы копировать и вложенные объекты."}, {"q": "**В обработчике регистрации — почему возраст `agingInput.value` сначала нужно привести через `Number(...)`, а не использовать сразу?**\n```js\nconst ageText = ageInput.value.trim();\nif (ageText === \"\") {\n  throw new Error(\"Введите возраст\");\n}\nconst user = createUser({ name: nameInput.value, age: Number(ageText) });\n```", "a": "Значение из `<input>` всегда приходит СТРОКОЙ, даже если `type=\"number\"`. А `createUser` ожидает, что `age` — настоящее число (проверяет через `Number.isFinite(age)`). Если не сделать `Number(ageText)`, строка `\"28\"` не пройдёт проверку `Number.isFinite` (вернёт `false` для строки) и пользователь получит ошибку валидации даже при корректном вводе."}, {"q": "**Собери по памяти итоговые связи между темами (как заканчивается лекция): «Rest собирает, spread разворачивает», «Деструктуризация извлекает нужные поля», «Прототипы дают доступ к общему поведению», «Замыкание сохраняет доступ к состоянию», «let и const ограничивают область блока», «throw и catch управляют исключениями». Как все они встречаются в общем примере регистрации?**", "a": "Деструктуризация `{ name, age, ...extra }` извлекает поля из входного объекта в `createUser` (и заодно rest собирает остальные). Spread `{...extra, ...}` и `[...users]` создают новые объекты/массивы. Замыкание в `createUserManager` сохраняет `users` между вызовами `addUser`/`getUsers`. `const`/`let` используются для объявления переменных с правильной областью видимости. `throw`/`try`/`catch` в `createUser` и в обработчике клика защищают приложение от некорректного ввода, не давая ему «упасть»."}]}]</script>
<script>
	(function () {
		const DATA = JSON.parse(document.getElementById('cards-data').textContent);
		const QUIZ = [{"title": "📝 ЧАСТЬ 3 · БЛОК 1 (вопросы 1–12)", "questions": [{"num": 1, "code": "**What's the output?**\n```js\n!!null;\n!!\"\";\n!!1;\n```", "options": {"A": "`false` `true` `false`", "B": "`false` `false` `true`", "C": "`false` `true` `true`", "D": "`true` `true` `false`"}, "correct": "B", "explain": "`null` — falsy, `!!null` → `false`. Пустая строка `\"\"` — falsy, `!!\"\"` → `false`. `1` — truthy, `!!1` → `true`. Итог: `false, false, true`."}, {"num": 2, "code": "What does this return?\n```js\n[...\"Lydia\"];\n```", "options": {"A": "`[\"L\", \"y\", \"d\", \"i\", \"a\"]`", "B": "`[\"Lydia\"]`", "C": "`[[], \"Lydia\"]`", "D": "`[[\"L\", \"y\", \"d\", \"i\", \"a\"]]`"}, "correct": "A", "explain": "Строка — итерируемый объект (iterable): spread разворачивает её посимвольно в элементы нового массива, давая `[\"L\",\"y\",\"d\",\"i\",\"a\"]`."}, {"num": 3, "code": "What does this return?\n```js\nconst firstPromise = new Promise((res, rej) => {\n  setTimeout(res, 500, \"one\");\n});\nconst secondPromise = new Promise((res, rej) => {\n  setTimeout(res, 100, \"two\");\n});\nPromise.race([firstPromise, secondPromise]).then(res => console.log(res));\n```", "options": {"A": "`\"one\"`", "B": "`\"two\"`", "C": "`\"two\" \"one\"`", "D": "`\"one\" \"two\"`"}, "correct": "B", "explain": "`Promise.race` разрешается значением ПЕРВОГО промиса, который завершится — а не первого по порядку в массиве. `secondPromise` завершается через 100мс (раньше, чем `firstPromise` через 500мс), поэтому в консоль попадёт только `\"two\"`."}, {"num": 4, "code": "What's the output?\n```js\nlet person = { name: \"Lydia\" };\nconst members = [person];\nperson = null;\nconsole.log(members);\n```", "options": {"A": "`null`", "B": "`[null]`", "C": "`[{}]`", "D": "`[{ name: \"Lydia\" }]`"}, "correct": "D", "explain": "`members` хранит ссылку на тот же объект, на который указывала переменная `person` в момент `[person]`. Переприсваивание `person = null` меняет лишь саму переменную `person` — объект `{ name: \"Lydia\" }` при этом не удаляется и не затрагивается, массив `members` продолжает на него указывать."}, {"num": 5, "code": "What's the output?\n```js\nconst person = {\n  name: \"Lydia\",\n  age: 21\n};\nfor (const item in person) {\n  console.log(item);\n}\n```", "options": {"A": "`{ name: \"Lydia\" }, { age: 21 }`", "B": "`\"name\", \"age\"`", "C": "`\"Lydia\", 21`", "D": "`[\"name\", \"Lydia\"], [\"age\", 21]`"}, "correct": "B", "explain": "`for...in` перебирает КЛЮЧИ (имена свойств) объекта, а не значения. Выведутся строки `\"name\"` и `\"age\"`."}, {"num": 6, "code": "What's the output?\n```js\nconsole.log(3 + 4 + \"5\");\n```", "options": {"A": "`\"345\"`", "B": "`\"75\"`", "C": "`12`", "D": "`\"12\"`"}, "correct": "B", "explain": "Операторы `+` выполняются слева направо. Сначала `3 + 4 = 7` (оба числа). Затем `7 + \"5\"` — число встречает строку, число приводится к строке: `\"7\" + \"5\" = \"75\"`."}, {"num": 7, "code": "What's the output?\n```js\nconst a = {};\nconst b = { key: \"b\" };\nconst c = { key: \"c\" };\na[b] = 123;\na[c] = 456;\nconsole.log(a[b]);\n```", "options": {"A": "`123`", "B": "`456`", "C": "`undefined`", "D": "`ReferenceError`"}, "correct": "B", "explain": "Ключ объекта всегда приводится к строке. И `b`, и `c` при преобразовании в строку (нет метода `toString`, используется поведение по умолчанию) дают ОДНУ и ту же строку `\"[object Object]\"`. Значит `a[b]` и `a[c]` — это буквально один и тот же ключ `a[\"[object Object]\"]`. `a[c] = 456` перезаписывает значение, записанное `a[b] = 123`, поэтому `a[b]` (= тот же ключ) читает `456`."}, {"num": 8, "code": "What's the output?\n```js\nconst numbers = [1, 2, 3];\nnumbers[10] = 11;\nconsole.log(numbers.length);\n```", "options": {"A": "11", "B": "4", "C": "Error"}, "correct": "A", "explain": "Присваивание индексу `10` растягивает массив — `.length` становится `10 + 1 = 11` (индекс последнего заданного элемента + 1), даже если промежуточные индексы (3–9) остаются пустыми «дырами» (empty slots), а не `undefined`-элементами."}, {"num": 9, "code": "What's the value of `num`?\n```js\nconst num = parseInt(\"7*6\");\n```", "options": {"A": "`42`", "B": "`\"42\"`", "C": "`7`", "D": "`NaN`"}, "correct": "C", "explain": "`parseInt` читает строку слева направо и останавливается на первом символе, который не является частью числа. `\"7*6\"` — цифра `7`, затем `*` (не цифра) → парсинг останавливается, результат `7` (число, не строка). `parseInt` НЕ вычисляет выражение."}, {"num": 10, "code": "What's the output?\n```js\nfunction getInfo(member, year) {\n  member.name = \"Lydia\";\n  year = \"1998\";\n}\nconst person = { name: \"Sarah\" };\nconst birthYear = \"1997\";\ngetInfo(person, birthYear);\nconsole.log(person, birthYear);\n```", "options": {"A": "`{ name: \"Lydia\" }, \"1997\"`", "B": "`{ name: \"Sarah\" }, \"1998\"`", "C": "`{ name: \"Lydia\" }, \"1998\"`", "D": "`{ name: \"Sarah\" }, \"1997\"`"}, "correct": "A", "explain": "Объекты передаются «по ссылке на значение»: `member` внутри функции — это копия ССЫЛКИ на тот же объект, что и `person`, поэтому `member.name = \"Lydia\"` меняет сам объект — видно и снаружи. А `year` — примитив (строка): `year = \"1998\"` внутри функции просто переприсваивает ЛОКАЛЬНЫЙ параметр, никак не затрагивая внешнюю `birthYear`."}, {"num": 11, "code": "What's the output?\n```js\nfunction greeting() {\n  throw \"Hello world!\";\n}\nfunction sayHi() {\n  try {\n    const data = greeting();\n    console.log(\"It worked!\", data);\n  } catch (e) {\n    console.log(\"Oh no an error:\", e);\n  }\n}\nsayHi();\n```", "options": {"A": "`It worked! Hello world!`", "B": "`Oh no an error: undefined`", "C": "`SyntaxError: can only throw Error objects`", "D": "`Oh no an error: Hello world!`"}, "correct": "D", "explain": "В JavaScript МОЖНО бросить (`throw`) любое значение, не только объект `Error` — в том числе простую строку. `catch (e)` ловит именно это значение (строку `\"Hello world!\"`), а не объект ошибки. Поэтому выводится `\"Oh no an error:\" \"Hello world!\"`. (Хорошая практика — бросать `new Error(...)`, но языковых ограничений на это нет.)"}, {"num": 12, "code": "What's the output?\n```js\nconst numbers = [1, 2, 3, 4, 5];\nconst [y] = numbers;\nconsole.log(y);\n```", "options": {"A": "`[[1, 2, 3, 4, 5]]`", "B": "`[1, 2, 3, 4, 5]`", "C": "`1`", "D": "`[1]`"}, "correct": "C", "explain": "`const [y] = numbers;` — деструктуризация массива: `y` получает значение ПЕРВОГО элемента (индекс 0), то есть `1` — не массив, не обёртку, а само значение."}]}, {"title": "📝 ЧАСТЬ 3 · БЛОК 2 (вопросы 13–24)", "questions": [{"num": 13, "code": "What's the output?\n```js\nconst user = { name: \"Lydia\", age: 21 };\nconst admin = { admin: true, ...user };\nconsole.log(admin);\n```", "options": {"A": "`{ admin: true, user: { name: \"Lydia\", age: 21 } }`", "B": "`{ admin: true, name: \"Lydia\", age: 21 }`", "C": "`{ admin: true, user: [\"Lydia\", 21] }`", "D": "`{ admin: true }`"}, "correct": "B", "explain": "`...user` разворачивает СОБСТВЕННЫЕ перечисляемые свойства `user` прямо в новый объект (`name` и `age` становятся свойствами `admin` напрямую, а не вложенным объектом `user`). Результат: `{ admin: true, name: \"Lydia\", age: 21 }`."}, {"num": 14, "code": "What's the output?\n```js\nconst settings = {\n  username: \"lydiahallie\",\n  level: 19,\n  health: 90\n};\nconst data = JSON.stringify(settings, [\"level\", \"health\"]);\nconsole.log(data);\n```", "options": {"A": "`\"{\"level\":19, \"health\":90}\"`", "B": "`\"{\"username\": \"lydiahallie\"}\"`", "C": "`\"[\"level\", \"health\"]\"`", "D": "`\"{\"username\": \"lydiahallie\", \"level\":19, \"health\":90}\"`"}, "correct": "A", "explain": "Второй аргумент `JSON.stringify(value, replacer)` может быть массивом строк — «белым списком» имён свойств, которые нужно включить в результат. Все остальные свойства (`username`) исключаются. Получаем `{\"level\":19,\"health\":90}`."}, {"num": 15, "code": "What's the output?\n```js\nlet num = 10;\nconst increaseNumber = () => num++;\nconst increasePassedNumber = number => number++;\nconst num1 = increaseNumber();\nconst num2 = increasePassedNumber(num1);\nconsole.log(num1);\nconsole.log(num2);\n```", "options": {"A": "`10`, `10`", "B": "`10`, `11`", "C": "`11`, `11`", "D": "`11`, `12`"}, "correct": "A", "explain": "`num++` — постфиксный инкремент: ВОЗВРАЩАЕТ старое значение, а увеличивает переменную уже ПОСЛЕ. `increaseNumber()` возвращает старое `num` (10), поэтому `num1 = 10` (сам `num` после этого стал 11, но это уже не важно). Аналогично `increasePassedNumber(num1)` получает локальный параметр `number = 10` и возвращает его СТАРОЕ значение `10` — поэтому `num2 = 10` тоже."}, {"num": 16, "code": "What's the output?\n```js\n[1, 2, 3, 4].reduce((x, y) => console.log(x, y));\n```", "options": {"A": "`1` `2` and `3` `3` and `6` `4`", "B": "`1` `2` and `2` `3` and `3` `4`", "C": "`1` `undefined` and `2` `undefined` and `3` `undefined` and `4` `undefined`", "D": "`1` `2` and `undefined` `3` and `undefined` `4`"}, "correct": "D", "explain": "Без начального значения `reduce` берёт первый элемент (`1`) как стартовый аккумулятор и вызывает колбэк 3 раза (для оставшихся 3 элементов). Колбэк возвращает `console.log(...)`, а это всегда `undefined` — значит на втором и третьем шаге аккумулятор `x` уже `undefined`. Логи: `(1, 2)`, `(undefined, 3)`, `(undefined, 4)`."}, {"num": 17, "code": "What's the output?\n```js\nfunction addToList(item, list) {\n  return list.push(item);\n}\nconst result = addToList(\"apple\", [\"banana\"]);\nconsole.log(result);\n```", "options": {"A": "`['apple', 'banana']`", "B": "`2`", "C": "`true`", "D": "`undefined`"}, "correct": "B", "explain": "`Array.prototype.push` возвращает НОВУЮ ДЛИНУ массива (число), а не сам изменённый массив. После `push(\"apple\")` массив становится `[\"banana\", \"apple\"]` длиной `2` — и именно `2` возвращает функция."}, {"num": 18, "code": "What is the output?\n```js\nconst list = [1 + 2, 1 * 2, 1 / 2]\nconsole.log(list)\n```", "options": {"A": "`[\"1 + 2\", \"1 * 2\", \"1 / 2\"]`", "B": "`[\"12\", 2, 0.5]`", "C": "`[3, 2, 0.5]`", "D": "`[1, 1, 1]`"}, "correct": "C", "explain": "Внутри литерала массива каждое выражение ВЫЧИСЛЯЕТСЯ немедленно, а не сохраняется как текст. `1+2=3`, `1*2=2`, `1/2=0.5` → `[3, 2, 0.5]`."}, {"num": 19, "code": "What is the output?\n```js\nfunction sayHi(name) {\n  return `Hi there, ${name}`\n}\nconsole.log(sayHi())\n```", "options": {"A": "`Hi there,`", "B": "`Hi there, undefined`", "C": "`Hi there, null`", "D": "`ReferenceError`"}, "correct": "B", "explain": "`sayHi()` вызвана без аргумента — параметр `name` (без значения по умолчанию) получает `undefined`. Шаблонная строка вставляет `undefined` как текст: `\"Hi there, undefined\"`."}, {"num": 20, "code": "What's the output?\n```js\nconsole.log(\"I want pizza\"[0])\n```", "options": {"A": "`\"\"\"`", "B": "`\"I\"`", "C": "`SyntaxError`", "D": "`undefined`"}, "correct": "B", "explain": "Строки можно индексировать как массивы символов через `[]`. `\"I want pizza\"[0]` — первый символ строки, `\"I\"`."}, {"num": 21, "code": "What is the output?\n```js\nfunction checkAge(age) {\n  if (age < 18) {\n    const message = \"Sorry, you're too young.\"\n  } else {\n    const message = \"Yay! You're old enough!\"\n  }\n  return message\n}\nconsole.log(checkAge(21))\n```", "options": {"A": "`\"Sorry, you're too young.\"`", "B": "`\"Yay! You're old enough!\"`", "C": "`ReferenceError`", "D": "`undefined`"}, "correct": "C", "explain": "Обе переменные `message` объявлены через `const` ВНУТРИ блоков `if`/`else` — область видимости блочная, снаружи блока переменная не существует. `return message;` обращается к несуществующей в этой области видимости переменной → `ReferenceError: message is not defined`."}, {"num": 22, "code": "What's the output?\n```js\nfunction sum(num1, num2 = num1) {\n  console.log(num1 + num2)\n}\nsum(10)\n```", "options": {"A": "`NaN`", "B": "`20`", "C": "`ReferenceError`", "D": "`undefined`"}, "correct": "B", "explain": "Значение параметра по умолчанию может ссылаться на УЖЕ объявленный более ранний параметр той же функции. `sum(10)` передаёт только `num1 = 10`; `num2` не передан → срабатывает дефолт `num2 = num1 = 10`. `10 + 10 = 20`."}, {"num": 23, "code": "What's the output?\n```js\nlet newList = [1, 2, 3].push(4)\nconsole.log(newList.push(5))\n```", "options": {"A": "`[1, 2, 3, 4, 5]`", "B": "`[1, 2, 3, 5]`", "C": "`[1, 2, 3, 4]`", "D": "`Error`"}, "correct": "D", "explain": "`[1,2,3].push(4)` возвращает НОВУЮ ДЛИНУ (`4`), а не массив — поэтому `newList` оказывается числом `4`, а не массивом. У чисел нет метода `.push`. `newList.push(5)` бросает `TypeError: newList.push is not a function` — это и есть `Error`."}, {"num": 24, "code": "What's the output?\n```js\nfunction sayHi() {\n  console.log(name);\n  console.log(age);\n  var name = \"Lydia\";\n  let age = 21;\n}\nsayHi();\n```", "options": {"A": "`Lydia` and `undefined`", "B": "`Lydia` and `ReferenceError`", "C": "`ReferenceError` and `21`", "D": "`undefined` and `ReferenceError`"}, "correct": "D", "explain": "`var name` поднимается (hoisting) и сразу инициализируется `undefined` — читать её до присваивания можно, получим `undefined`. `let age` тоже технически поднимается, но остаётся в Temporal Dead Zone до своей строки объявления — попытка чтения до неё бросает `ReferenceError`, что и останавливает выполнение на втором `console.log`."}]}, {"title": "📝 ЧАСТЬ 3 · БЛОК 3 (вопросы 25–36)", "questions": [{"num": 25, "code": "What's the output?\n```js\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 1);\n}\nfor (let i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 1);\n}\n```", "options": {"A": "`0 1 2` and `0 1 2`", "B": "`0 1 2` and `3 3 3`", "C": "`3 3 3` and `0 1 2`"}, "correct": "C", "explain": "Первый цикл с `var` создаёт ОДНУ общую переменную `i` на весь цикл — к моменту срабатывания всех трёх колбэков (асинхронно, позже) цикл уже завершён и `i = 3` для всех. Второй цикл с `let` создаёт ОТДЕЛЬНУЮ привязку `i` на каждую итерацию — каждый колбэк замыкает «своё» значение: `0, 1, 2`."}, {"num": 26, "code": "What's the output?\n```js\n+true;\n!\"Lydia\";\n```", "options": {"A": "`1` and `false`", "B": "`false` and `NaN`", "C": "`false` and `false`"}, "correct": "A", "explain": "Унарный `+` приводит операнд к числу: `+true` → `1` (`true` приводится к `1`). `!\"Lydia\"` — непустая строка truthy, логическое отрицание truthy-значения → `false`."}, {"num": 27, "code": "What's the output?\n```js\nconst shape = {\n  radius: 10,\n  diameter() {\n    return this.radius * 2;\n  },\n  perimeter: () => 2 * Math.PI * this.radius\n};\nconsole.log(shape.diameter());\nconsole.log(shape.perimeter());\n```", "options": {"A": "`20` and `62.83185307179586`", "B": "`20` and `NaN`", "C": "`20` and `63`", "D": "`NaN` and `63`"}, "correct": "B", "explain": "`diameter()` — обычный метод: `this` внутри ссылается на сам объект `shape` при вызове `shape.diameter()`, поэтому `this.radius = 10`, результат `20`. `perimeter` — стрелочная функция: она НЕ имеет своего `this`, а берёт его из ОКРУЖАЮЩЕЙ (лексической) области видимости — то есть из области видимости верхнего уровня скрипта, где `this` НЕ равен `shape` (в обычном скрипте это глобальный объект без свойства `radius`). `this.radius` там `undefined`, значит `2 * Math.PI * undefined = NaN`."}, {"num": 28, "code": "Which one is true?\n```js\nconst bird = {\n  size: \"small\"\n};\nconst mouse = {\n  name: \"Mickey\",\n  small: true\n};\n```\n(о допустимости `mouse.bird.size`, `mouse[bird.size]`, `mouse[bird[\"size\"]]`)", "options": {"A": "`mouse.bird.size` is not valid", "B": "`mouse[bird.size]` is not valid", "C": "`mouse[bird[\"size\"]]` is not valid", "D": "All of them are valid"}, "correct": "D", "explain": "`mouse.bird` обратится к несуществующему свойству `bird` на `mouse` и просто даст `undefined` (а не ошибку!) — дальнейшее `.size` на `undefined` уже бросило бы `TypeError`, но сама по себе запись синтаксически валидна (ошибка произойдёт только при реальном выполнении этой третьей точки, а варианты в вопросе проверяют только `mouse.bird`, не `.size` после него, т.к. опечатка в условии — фактический акцент в оригинале на `mouse[bird.size]` и `mouse[bird[\"size\"]]`). `bird.size` → `\"small\"`, значит `mouse[bird.size]` = `mouse[\"small\"]` = `true` — валидно. `bird[\"size\"]` — то же самое через скобочную нотацию — тоже `\"small\"`, тоже валидно. Все варианты являются синтаксически и семантически допустимым JS-кодом."}, {"num": 29, "code": "What's the output?\n```js\nlet c = { greeting: \"Hey!\" };\nlet d;\nd = c;\nc.greeting = \"Hello\";\nconsole.log(d.greeting);\n```", "options": {"A": "`Hello`", "B": "`Hey!`", "C": "`undefined`", "D": "`ReferenceError`", "E": "`TypeError`"}, "correct": "A", "explain": "`d = c;` не копирует объект — `d` и `c` теперь указывают на ОДИН и тот же объект в памяти. Изменение через `c.greeting = \"Hello\"` видно и через `d`, потому что это один и тот же объект."}, {"num": 30, "code": "What's the output?\n```js\nlet a = 3;\nlet b = new Number(3);\nlet c = 3;\nconsole.log(a == b);\nconsole.log(a === b);\nconsole.log(b === c);\n```", "options": {"A": "`true` `false` `true`", "B": "`false` `false` `true`", "C": "`true` `false` `false`", "D": "`false` `true` `true`"}, "correct": "C", "explain": "`new Number(3)` создаёт ОБЪЕКТ-обёртку, не примитив. `a == b`: `==` допускает приведение типов — объект приводится к примитиву `3`, `3 == 3` → `true`. `a === b`: `===` без приведения типов — число и объект РАЗНЫХ типов → `false`. `b === c`: объект и примитивное число — тоже разные типы → `false`."}, {"num": 31, "code": "What happens when we do this?\n```js\nfunction bark() {\n  console.log(\"Woof!\");\n}\nbark.animal = \"dog\";\n```", "options": {"A": "Nothing, this is totally fine!", "B": "`SyntaxError`. You cannot add properties to a function this way.", "C": "`\"Woof\"` gets logged.", "D": "`ReferenceError`"}, "correct": "A", "explain": "Функции в JavaScript st`) запрещено и бросает `ReferenceError: age is not defined` — в отличие от нестрогого режима, где такая переменная молча стала бы глобальной."}, {"num": 38, "code": "What's value of `sum`?\n```js\nconst sum = eval(\"10*10+5\");\n```", "options": {"A": "`105`", "B": "`\"105\"`", "C": "`TypeError`", "D": "`\"10*10+5\"`"}, "correct": "A", "explain": "`eval` выполняет переданную строку как JavaScript-код и возвращает результат вычисления. `10*10+5` вычисляется как выражение: `100 + 5 = 105` — число, а не строка."}, {"num": 39, "code": "What's the output?\n```js\nvar num = 8;\nvar num = 10;\nconsole.log(num);\n```", "options": {"A": "`8`", "B": "`10`", "C": "`SyntaxError`", "D": "`ReferenceError`"}, "correct": "B", "explain": "`var` разрешает повторное объявление одной и той же переменной в одной области видимости без какой-либо ошибки — просто последнее присваивание побеждает. (Для сравнения: с `let`/`const` это был бы `SyntaxError: Identifier 'num' has already been declared`.)"}, {"num": 40, "code": "What's the output?\n```js\nconst obj = { a: \"one\", b: \"two\", a: \"three\" };\nconsole.log(obj);\n```", "options": {"A": "`{ a: \"one\", b: \"two\" }`", "B": "`{ b: \"two\", a: \"three\" }`", "C": "`{ a: \"three\", b: \"two\" }`", "D": "`SyntaxError`"}, "correct": "C", "explain": "Дублирующиеся ключи в объектном литерале НЕ являются ошибкой — побеждает ПОСЛЕДНЕЕ значение для этого ключа (`a: \"three\"`), а позиция свойства в объекте сохраняется там, где ключ впервые встретился (`a` — первое свойство по порядку). Итог: `{ a: \"three\", b: \"two\" }`."}, {"num": 41, "code": "What's the output?\n```js\nconst foo = () => console.log(\"First\");\nconst bar = () => setTimeout(() => console.log(\"Second\"));\nconst baz = () => console.log(\"Third\");\nbar();\nfoo();\nbaz();\n```", "options": {"A": "`First` `Second` `Third`", "B": "`First` `Third` `Second`", "C": "`Second` `First` `Third`", "D": "`Second` `Third` `First`"}, "correct": "B", "explain": "`bar()` вызывается перво 		function deepEqual(a, b) {
			if (a === b) return true;
			if (typeof a === "number" && typeof b === "number" && Number.isNaN(a) && Number.isNaN(b)) return true;
			if (a === null || b === null || typeof a !== "object" || typeof b !== "object") return false;
			if (Array.isArray(a) !== Array.isArray(b)) return false;
			const aKeys = Object.keys(a), bKeys = Object.keys(b);
			if (aKeys.length !== bKeys.length) return false;
			for (const k of aKeys) {
				if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
				if (!deepEqual(a[k], b[k])) return false;
			}
			return true;
		}
		
		function fmtVal(v) {

		async function runExercise(ex, code) {
			let fn;
			try {
				const factory = new Function("mockData", "mockFetch", "mockPost", "wait",
						code + "\n;return typeof " + ex.fn + " !== 'undefined' ? " + ex.fn + " : undefined;");
				fn = factory(ex.mockData || {}, mockFetchImpl, mockPostImpl, waitImpl);
			} catch (e) {
				return { ok: false, message: "💥 Ошибка в коде: " + e.message };
			}
			if (typeof fn !== "function") {
				return { ok: false, message: "Не нашёл функцию `" + ex.fn + "`. Проверь, что ты назвал её именно так." };
			}
			for (const t of ex.tests) {
				let actual;
				try {
					actual = fn.apply(null, t.args);
					if (ex.isAsync || (actual && typeof actual.then === "function")) {
						actual = await actual;
					}
				} catch (e) {
					return { ok: false, message: "💥 Ошибка при вызове " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + "): " + e.message };
				}
				if (!deepEqual(actual, t.expected)) {
					return { ok: false, message: "❌ " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + ") вернул " + fmtVal(actual) + ", а ожидалось " + fmtVal(t.expected) };
				}
			}
			return { ok: true, message: "✅ Все проверки пройдены (" + ex.tests.length + ")! Отличная работа." };
		}

		function shortTitle(t) {
			const m = t.match(/БЛОК\s*(\d+)\.\s*([^\(]+)/);
			if (m) return m[1] + '. ' + m[2].trim();
			return t;
		}
		
		function render(str) {
			let s = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
			s = s.replace(/```(?:\w+)?\n([\s\S]*?)```/g, function (m, code) { return '<pre><code>' + code.trim() + '</code></pre>'; });
			const preBlocks = [];
			s = s.replace(/<pre>[\s\S]*?<\/pre>/g, function (m) { preBlocks.push(m); return '\u0000PRE' + (preBlocks.length - 1) + '\u0000'; });
			s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
			s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
			s = s.split('\n').join('<br>');
			s = s.replace(/\u0000PRE(\d+)\u0000/g, function (m, idx) { return preBlocks[parseInt(idx, 10)]; });
			return s;
		}
		
		function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
