.count += count` внутри `addOrUpdateProduct`? В чём разница по смыслу?**", "a": "`= count` — заменяет количество новым значением («теперь молока 3 штуки»). `+= count` — прибавляет к уже имеющемуся («докупили ещё 3 штуки»). Смысл разный: замена против добавления."}, {"q": "**Что делает функция-помощник `removeProduct(fridge, name)`?**\n```js\nfunction removeProduct(fridge, name) {\n  const idx = fridge.findIndex((product) => product.name === name);\n  if (idx !== -1) {\n    fridge.splice(idx, 1);\n  }\n}\n```", "a": "Находит индекс товара по имени и удаляет его из массива через `splice`. Если товар не найден (`idx === -1`), ничего не делает — `splice` не вызывается вовсе."}, {"q": "**Согласно заданию HW-25, вместо чего в основном цикле `while` теперь нужно вызывать `removeProduct` и `addOrUpdateProduct`?**", "a": "Вместо того чтобы вручную внутри `while` искать `findIndex` и напрямую менять/удалять элементы массива (`fridge[idx]...`, `fridge.splice(...)`, `fridge.push(...)`) — вся эта логика поручается готовым функциям-помощникам."}, {"q": "**Что делает `displayFridgeContents(fridge)`?**", "a": "Красиво выводит в консоль пронумерованный список всех продуктов холодильника (или сообщение «Холодильник пуст», если список пустой) — с названием, количеством, ценой и сроком годности."}, {"q": "**Согласно HW-25, что нужно сделать с дублирующим циклом `forEach` в конце программы?**", "a": "Удалить его и вместо него один раз вызвать готовую функцию `displayFridgeContents(saveProducts)` — не нужно писать один и тот же вывод дважды."}, {"q": "**В чём разница между `readFromJsonFile(filePath)` и `displayFileJsonContents(filePath)`?**\n```js\nasync function readFromJsonFile(filePath) {\n  const fileData = await readFile(filePath, \"utf-8\");\n  return JSON.parse(fileData);\n}\nasync function displayFileJsonContents(filePath) {\n  const fileData = await readFile(filePath, \"utf-8\");\n  console.log(\"Данные из файла:\", fileData);\n}\n```", "a": "`readFromJsonFile` читает файл и возвращает готовый JS-объект (распарсенный), чтобы дальше с ним работать. `displayFileJsonContents` читает файл и просто печатает его «сырое» текстовое содержимое — не возвращает данные."}, {"q": "**Почему в новой версии `runFridgeApp(fileName, stopWords)` принимает имя файла и список стоп-слов как параметры, а не использует их напрямую внутри функции?**", "a": "Так функцию можно переиспользовать с разными файлами и разными стоп-словами, не переписывая её код — параметры делают функцию гибче и независимой от конкретных значений."}, {"q": "**Что выведет?**\n```js\nfunction removeProduct(fridge, name) {\n  const idx = fridge.findIndex((p) => p.name === name);\n  if (idx !== -1) fridge.splice(idx, 1);\n}\nlet fridge = [{ name: \"Хлеб\", count: 1 }];\nremoveProduct(fridge, \"Сыр\");\nconsole.log(fridge.length);\n```", "a": "`1` (товара «Сыр» не было, поэтому `idx === -1`, и `splice` не вызывался — массив не изменился)"}, {"q": "**Каким должен остаться главный код `runFridgeApp` после рефакторинга по заданию HW-25 (одним предложением)?**", "a": "Он должен заниматься только общением с пользователем (задавать вопросы через `rl.question`, получать ответы) — вся работа с массивом продуктов и файлами делегирована готовым функциям-помощникам."}, {"q": "**НАЙДИ ОШИБКУ. В чём проблема с такой версией `addOrUpdateProduct`, если вызвать её для НОВОГО товара?**\n```js\nfunction addOrUpdateProduct(fridge, name, count, price, expDate) {\n  const idx = fridge.findIndex((p) => p.name === name);\n  fridge[idx].count += count;\n}\n```", "a": "Не обработан случай, когда товара ещё нет (`idx === -1`). Обращение к `fridge[-1]` вернёт `undefined`, и `undefined.count` выбросит ошибку `TypeError`."}, {"q": "**Что такое «функция-помощник» (helper function) в контексте рефакторинга?**", "a": "Небольшая функция с одной чёткой задачей (например, «удалить товар» или «сохранить в файл»), которую можно переиспользовать в разных местах программы вместо повторения одного и того же кода."}, {"q": "**Собери по памяти: какие 4 группы функций-помощников появились в HW-25?**", "a": "1) Работа с файлами: `writeToJsonFile`, `appendToJsonFile`, `readFromJsonFile`, `displayFileJsonContents`.\n2) Работа с массивом продуктов: `addOrUpdateProduct`, `removeProduct`.\n3) Вывод: `displayFridgeContents`.\n4) Основной цикл `runFridgeApp`, который теперь только вызывает всё перечисленное."}, {"q": "**Собери по памяти: 3 главных вывода темы «Рефакторинг: функции-помощники».**", "a": "1) Рефакторинг не меняет поведение программы, только её внутреннюю структуру.\n2) Каждая функция должна отвечать за одну задачу (принцип единственной ответственности).\n3) Параметры вместо захардкоженных значений делают функции переиспользуемыми."}]}, {"title": "🌦️ БЛОК 26. ЦЕПОЧКИ API-ЗАПРОСОВ И ВАЛИДАЦИЯ ДАННЫХ", "cards": [{"q": "**Опиши по шагам, что нужно сделать в домашке HW-26 (цепочка из двух API).**", "a": "1) Получить список пользователей с jsonplaceholder.\n2) Для каждого пользователя достать `latitude`/`longitude` из `address.geo`.\n3) По этим координатам запросить погоду с Open-Meteo.\n4) Найти пользователя с максимальной температурой и вывести его имя, телефон и температуру."}, {"q": "**Что выведет?**\n```js\nconst weatherData = { current_weather: { temperature: 21.4, windspeed: 5 } };\nconst key = \"windspeed\";\nconsole.log(weatherData.current_weather[key]);\n```", "a": "`5`"}, {"q": "**Почему `person.address city` вызовет синтаксическую ошибку, а `person[\"address city\"]` — нет?**\n```js\nconst person = { name: \"John\", \"address city\": \"New York\" };\n```", "a": "Точечная нотация не может содержать пробел — JS воспримет `city` как отдельное выражение. Квадратные скобки принимают ЛЮБУЮ строку в качестве имени свойства, включая пробелы."}, {"q": "**Что выведет?**\n```js\nconst data = { current_weather: { temperature: 18 } };\nconst k1 = \"current_weather\", k2 = \"temperature\";\nconsole.log(data[k1][k2]);\n```", "a": "`18`"}, {"q": "**Чем получение данных через `axios.get(url)` отличается от `fetch(url)` — что нужно/не нужно делать после запроса?**", "a": "У `fetch` нужно вручную вызвать `await response.json()`, чтобы получить данные. У `axios` данные уже лежат готовые в `response.data` — `.json()` вызывать не нужно (и такого метода там нет)."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с этим кодом на axios?**\n```js\nasync function returnWeatherAxios(lat, lon) {\n  return axios.get(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);\n}\nconst res = await returnWeatherAxios(44.49, 20.27);\nconsole.log(res.temperature);\n```", "a": "Забыли `.data`: сначала нужно `res.data`, а потом уже `.current_weather.temperature`. `res` — это весь объект ответа axios (со статусом, заголовками и т.д.), а не сами данные."}, {"q": "**Что делает `userData.address.geo.lat`? Опиши структуру вложенности одним предложением.**", "a": "Читает поле `lat` внутри объекта `geo`, который лежит внутри объекта `address`, который лежит внутри объекта пользователя `userData` — три уровня вложенности."}, {"q": "**Что в итоге лежит в `people` после этого цикла?**\n```js\nconst people = [];\nfor (let i = 1; i <= 3; i++) {\n  const userData = await returnUser(i);\n  people.push({\n    id: userData.id,\n    name: userData.name,\n    latitude: userData.address.geo.lat,\n    longitude: userData.address.geo.lng,\n  });\n}\n```", "a": "Массив из 3 объектов упрощённого вида `{ id, name, latitude, longitude }` — по одному на каждого из первых трёх пользователей, координаты вытащены из вложенного `address.geo`."}, {"q": "**Зачем в задаче нужно сначала получить пользователей, а только потом — погоду? Почему нельзя запросить погоду сразу?**", "a": "Погодное API принимает координаты (`latitude`/`longitude`), а не имя человека — эти координаты хранятся в данных пользователя. Один запрос зависит от результата другого: сначала нужно узнать «где» пользователь, и только потом — «какая там погода»."}, {"q": "**Как найти пользователя с максимальной температурой в массиве `{name, phone, temperature}` (используя reduce)?**\n```js\nconst withWeather = [\n  { name: \"Ivan\", phone: \"111\", temperature: 18 },\n  { name: \"Anna\", phone: \"222\", temperature: 24 },\n];\nconst hottest = withWeather.reduce((best, current) =>\n  current.temperature > best.temperature ? current : best\n);\nconsole.log(hottest.name);\n```", "a": "`Anna` (у неё температура больше — 24 против 18)"}, {"q": "**Что делает `parseNonNegativeNumber(raw)` и почему пустую строку проверяют отдельно от `NaN`?**\n```js\nfunction parseNonNegativeNumber(raw) {\n  const trimmed = raw.trim();\n  if (trimmed === \"\") return null;\n  const value = Number(trimmed);\n  if (Number.isNaN(value) || value < 0) return null;\n  return value;\n}\n```", "a": "Разбирает ввод в неотрицательное число или возвращает `null` при ошибке. Пустую строку проверяют отдельно, потому что `Number(\"\")` равно `0`, а не `NaN` — без этой проверки пустой ввод тихо превратился бы в валидный ноль."}, {"q": "**Что выведет?**\n```js\nconsole.log(Number(\"\"));\nconsole.log(Number(\"   \"));\nconsole.log(Number(\"abc\"));\n```", "a": "`0`, `0`, `NaN` (пустая строка или только пробелы превращаются в 0, а нечисловой текст — в NaN)"}, {"q": "**Зачем в `isValidExpDate` сравнение `date.toISOString().slice(0, 10) === value`, а не просто `!Number.isNaN(date.getTime())`?**\n```js\nfunction isValidExpDate(value) {\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return false;\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) return false;\n  return date.toISOString().slice(0, 10) === value;\n}\n```", "a": "`new Date(\"2024-02-31\")` не даёт `NaN` — JS «перекатывает» несуществующую дату на 2 марта. Финальное сравнение ловит именно такие случаи: если после конвертации обратно в строку дата не совпала с исходной — введённой даты на самом деле не существует."}, {"q": "**Что выведет (используя `isValidExpDate` из прошлой карточки)?**\n```js\nconsole.log(isValidExpDate(\"2024-02-31\"));\nconsole.log(isValidExpDate(\"2024-02-28\"));\nconsole.log(isValidExpDate(\"31-02-2024\"));\n```", "a": "`false` (31 февраля не существует, дата «перекатится»), `true` (28 февраля — валидная дата), `false` (не соответствует формату `YYYY-MM-DD` по регулярке)"}, {"q": "**Зачем в `escapeCsvField` оборачивают значение в кавычки и удваивают внутренние кавычки?**\n```js\nfunction escapeCsvField(value) {\n  const str = String(value);\n  const needsQuoting = str.includes(\",\") || str.includes('\"') || str.includes(\"\\n\");\n  if (!needsQuoting) return str;\n  return `\"${str.replaceAll('\"', '\"\"')}\"`;\n}\n```", "a": "Если значение содержит запятую, кавычку или перенос строки, без экранирования оно сломает структуру CSV (запятая внутри значения будет воспринята как разделитель столбцов). Обёртка в кавычки + удвоение внутренних кавычек — стандартное правило формата CSV (RFC 4180)."}, {"q": "**Что выведет?**\n```js\nconsole.log(escapeCsvField(\"Молоко\"));\nconsole.log(escapeCsvField(\"Хлеб, белый\"));\nconsole.log(escapeCsvField('Сыр \"Российский\"'));\n```", "a": "`Молоко` (без изменений), `\"Хлеб, белый\"` (в кавычках из-за запятой), `\"Сыр \"\"Российский\"\"\"` (в кавычках, внутренние кавычки удвоены)"}, {"q": "**Почему для разбора CSV-строки обратно в поля нельзя просто написать `line.split(\",\")`, если значения могут содержать кавычки?**", "a": "Если поле в кавычках содержит запятую (например `\"Хлеб, белый\"`), простой `split(\",\")` разобьёт его на два отдельных поля — нужен построчный разбор символ за символом с отслеживанием, находимся ли мы внутри кавычек (`insideQuotes`)."}, {"q": "**Что делает `findProductIndex(fridge, name)` иначе, чем прежняя версия с прямым `p.name === name`?**\n```js\nfunction findProductIndex(fridge, name) {\n  return fridge.findIndex(\n    (product) => product.name.toLowerCase() === name.toLowerCase()\n  );\n}\n```", "a": "Сравнивает названия без учёта регистра — «Хлеб» и «хлеб» теперь считаются одним и тем же товаром."}, {"q": "**Зачем `addOrUpdateProduct` теперь возвращает строку `\"added\"` или `\"updated\"` вместо того, чтобы просто печатать сообщение внутри самой функции?**\n```js\nfunction addOrUpdateProduct(fridge, name, count, price, expDate) {\n  const idx = findProductIndex(fridge, name);\n  if (idx !== -1) { /* ... */ return \"updated\"; }\n  fridge.push({ name, count, price, expDate });\n  return \"added\";\n}\n```", "a": "Так функция отвечает только за изменение данных, а решение, ЧТО и КАК вывести пользователю, остаётся за вызывающим кодом — это разделение ответственности упрощает переиспользование функции в других местах (например, вообще без вывода в консоль)."}, {"q": "**НАЙДИ ОШИБКУ. Почему эта проверка названия товара всегда пропускает валидацию, даже для очень короткого имени?**\n```js\nif (title.lenght < 3) {\n  return false;\n}\n```", "a": "Опечатка: `lenght` вместо `length`. `title.lenght` — несуществующее свойство, равно `undefined`. Сравнение `undefined < 3` всегда даёт `false`, поэтому проверка длины никогда не срабатывает."}, {"q": "**Почему перед вызовом `product.name.toUpperCase()` важно сначала проверить `product.name !== null`?**", "a": "Если `name` равно `null`, вызов `.toUpperCase()` на `null` выбросит `TypeError: Cannot read properties of null` — программа упадёт с ошибкой вместо того, чтобы просто вернуть что-то не то."}, {"q": "**Что делает `filterProducts(products)` и какую задачу решает?**\n```js\nfunction filterProducts(products) {\n  return products.filter((p) => isProductValid(p));\n}\n```", "a": "Оставляет в массиве только те товары, которые прошли все проверки валидации (`isProductValid`) — «мусорные»/некорректные записи (отрицательная цена, пустое имя и т.д.) не попадают в дальнейшую обработку."}, {"q": "**Собери по памяти: 5 главных выводов темы «Цепочки API-запросов и валидация данных».**", "a": "1) Один запрос может зависеть от результата другого (сначала координаты — потом погода).\n2) `axios` даёт данные сразу через `.data`, `fetch` требует `await response.json()`.\n3) Квадратные скобки `[...]` нужны для свойств с пробелами и для динамических/переменных имён ключей.\n4) Проверку ввода стоит делать явными функциями-валидаторами (числа, даты), а не понадеявшись на «авось сработает».\n5) Опечатки в именах свойств (`lenght` вместо `length`) не вызывают ошибку — они просто тихо возвращают `undefined`, и баг трудно заметить."}, {"q": "**Дай определение: что такое валидация данных?**", "a": "Валидация данных — процесс проверки входящих данных на корректность, полноту и соответствие ожидаемому формату перед их использованием в программе."}, {"q": "**Опиши 3-шаговую схему валидации из урока: Входные данные → ? → ?**", "a": "Входные данные (поступают из форм, API, файлов или БД) → Проверка (программа анализирует структуру, тип и значения) → Результат (только корректные данные допускаются к обработке)."}, {"q": "**Назови 3 причины, зачем нужна валидация данных.**", "a": "1) Предотвращение ошибок — некорректные данные не попадают в логику программы. 2) Стабильность работы — приложение ведёт себя предсказуемо при любых входных данных. 3) Качество данных — сохраняется целостность и достоверность информации."}, {"q": "**Какие 3 типичных класса ошибок возникают без валидации?**", "a": "1) Отсутствующие поля — программа обращается к `undefined`/`null`. 2) Неправильные типы — строка вместо числа, массив вместо объекта, логика ломается на первой операции. 3) Неожиданные значения — отрицательная цена, пустое имя, неизвестный статус."}, {"q": "**Дан проблемный ответ API:**\n```json\n[\n  { \"id\": 1, \"name\": \"Laptop\", \"price\": 999, \"category\": \"electronics\" },\n  { \"id\": 2, \"name\": \"\", \"price\": -50, \"category\": \"electronics\" },\n  { \"id\": 3, \"price\": \"free\", \"category\": null },\n  { \"id\": 4, \"name\": \"Mouse\", \"price\": 25 }\n]\n```\nЧто не так с записями 2, 3 и 4?", "a": "Запись 2 — пустое имя и отрицательная цена. Запись 3 — нет поля `name`, цена передана строкой `\"free\"` вместо числа, категория `null`. Запись 4 — отсутствует поле `category`."}, {"q": "**Назови 3 уровня проверки данных из урока.**", "a": "1) Наличие полей — все обязательные ключи должны присутствовать в объекте. 2) Тип данных — например, `typeof price === \"number\"`. 3) Допустимые значения — цена больше 0, имя непустое, категория из разрешённого списка."}, {"q": "**Какой удобный паттерн возврата результата валидации показан в уроке?**\n```js\nfunction validateProduct(product) {\n  if (!product.name || product.name.trim() === \"\") {\n    return { valid: false, error: \"Название обязательно\" };\n  }\n  // ...\n  return { valid: true };\n}\n```", "a": "Функция возвращает объект с флагом `valid` (true/false) и полем `error` с описанием проблемы. Это удобно, потому что вызывающий код сразу видит и результат, и причину отказа, без выбрасывания исключений."}, {"q": "**Почему в проверке `!product.name || product.name.trim() === \"\"` нужны обе части условия?**", "a": "`!product.name` отсеивает случаи, когда поля вообще нет, `undefined` или пустая строка. `product.name.trim() === \"\"` отдельно отсеивает строку из одних пробелов (`\"   \"`), которая формально не пустая, но по смыслу — не является настоящим названием."}, {"q": "**Как влияет валидация на дальнейшую фильтрацию списка товаров?**", "a": "Некорректные записи отсеиваются до обработки — в списке остаются только валидные товары, поэтому вычисления, сортировка и группировка дальше работают без сбоев на чистых данных."}, {"q": "**Как валидация влияет на то, что видит пользователь в интерфейсе?**", "a": "Пользователь видит корректный интерфейс без пустых полей и неожиданных значений — то есть валидация напрямую влияет не только на логику, но и на качество отображения данных."}, {"q": "**НАЙДИ ОШИБКУ. Почему такая проверка цены пропустит запись с ценой `\"free\"`?**\n```js\nif (product.price <= 0) {\n  return { valid: false, error: \"Некорректная цена\" };\n}\n```", "a": "Проверка сравнивает значение как число, но не проверяет его тип. Строка `\"free\"` не пройдёт математическое сравнение так, как ожидается (JS попытается привести её к числу и получит `NaN`, а `NaN <= 0` — `false`), поэтому невалидная запись «проскочит». Нужно сначала проверить `typeof product.price === \"number\"`."}, {"q": "**Собери по памяти 4 связанных понятия из финального слайда темы валидации.**", "a": "Проверять → Защищать → Доверять → Стабильность (валидация — это цикл: проверяем данные, чтобы защитить программу, чтобы можно было доверять результатам и получить стабильную работу)."}, {"q": "**Чем «отсутствующее поле» отличается от «неправильного типа» как класс ошибки?**", "a": "Отсутствующее поле — ключа вообще нет в объекте, обращение к нему даёт `undefined`. Неправильный тип — поле есть, но хранит значение не того типа (например, число как строка), из-за чего операции с ним работают не так, как ожидается, хотя `undefined` не возникает."}, {"q": "**Почему валидацию данных называют «фундаментальным навыком разработчика»?**", "a": "Потому что она защищает программу от непредсказуемых ошибок и гарантирует, что бизнес-логика работает на надёжных, проверенных данных — без этого любое приложение, принимающее внешние данные (из форм, API, файлов), рано или поздно упадёт на «грязных» данных."}, {"q": "**Как соотносятся общая теория валидации из этого урока и функции `parseNonNegativeNumber`/`isValidExpDate`/`isProductValid`, которые вы уже писали?**", "a": "Это конкретные реализации трёх уровней проверки из теории: `parseNonNegativeNumber` проверяет тип и допустимое значение числа, `isValidExpDate` проверяет формат и корректность даты, а `isProductValid` объединяет проверку наличия полей, типов и допустимых значений в одну функцию — ровно так, как описано в паттерне `validateProduct`."}]}, {"title": "🔐 БЛОК 27. КОНТРОЛЬ ДОСТУПА И РУЧНАЯ AI-ЛОГИКА (Access Control & Custom AI Logic)", "cards": [{"q": "**Что такое авторизация одним предложением?**", "a": "Процесс проверки того, какие действия разрешено выполнять конкретному пользователю в системе."}, {"q": "**Чем авторизация отличается от аутентификации?**", "a": "Аутентификация отвечает на вопрос «кто ты?» (логин/пароль), а авторизация — «что тебе можно?» (права доступа). Авторизация всегда идёт ПОСЛЕ успешной аутентификации."}, {"q": "**Назови 3 причины, зачем нужна система ролей.**", "a": "Безопасность (защита критических функций от несанкционированного использования), гибкость (тонкая настройка прав для каждой группы пользователей), порядок (чёткое разделение ответственности внутри системы)."}, {"q": "**Заполни таблицу прав: у кого есть доступ к просмотру / редактированию / удалению / управлению ролями (User / Manager / Admin)?**", "a": "Просмотр — user, manager, admin. Редактирование — manager, admin. Удаление — только admin. Управление ролями — только admin."}, {"q": "**Опиши главный принцип контроля доступа по схеме урока (4 шага).**", "a": "Извлечь роль пользователя → Сравнить роль с требованием действия → Принять решение (разрешить/отклонить) → выполнить действие или выбросить ошибку доступа."}, {"q": "**Почему нельзя доверять роли пользователя, которая пришла с клиента?**", "a": "Клиентские данные можно подделать (изменить в браузере/запросе). Проверка роли обязательно должна происходить на сервере — иначе злоумышленник может просто отправить запрос с ролью «admin» и получить доступ."}, {"q": "**Что произойдёт, если вызвать этот `handleAction` для пользователя с ролью «manager» и `action=\"delete\"`?**\n```js\nconst handleAction = (user, action) => {\n  if (user.role === 'admin') {\n    return performAction(action);\n  }\n  if (user.role === 'manager') {\n    if (action !== 'delete') {\n      return performAction(action);\n    }\n  }\n  throw new Error('Доступ запрещён');\n};\n```", "a": "Функция дойдёт до конца без `return` внутри блока `manager` (условие `action !== 'delete'` не выполнится) и выбросит `Error('Доступ запрещён')` — то есть менеджеру запрещено удаление, как и задумано."}, {"q": "**Как получить список продуктов через API с токеном авторизации (axios)? Что передаётся в headers?**", "a": "`Authorization: \\`Bearer ${token}\\`` — токен передаётся в заголовке Authorization, сервер проверяет его и роль пользователя, прежде чем вернуть данные."}, {"q": "**Какой альтернативный подход урок советует при большом количестве ролей вместо цепочки if?**", "a": "Объект-словарь с разрешениями (permission map) — например, `{ admin: [...], manager: [...] }` — это быстрее проверять и легче расширять, чем длинную цепочку if/else."}, {"q": "**Сценарий: что может обычный пользователь (не manager, не admin)?**", "a": "Только просматривать данные — кнопки «Удалить» и «Изменить» скрыты или заблокированы."}, {"q": "**Собери по памяти: 3 итога занятия «Контроль доступа и роли».**", "a": "1) Авторизация определяет, что разрешено пользователю (в отличие от аутентификации). 2) Система ролей (user/manager/admin) задаёт уровни доступа. 3) Практическая реализация — axios для запросов + проверка роли через if (или permission map), причём проверка обязательна на сервере."}, {"q": "**Какое принципиальное ограничение есть у AI, по мнению урока «Custom AI Logic»?**", "a": "AI не управляет логикой приложения и не контролирует бизнес-правила самостоятельно — он не принимает решения о доступе, не контролирует поток приложения и не применяет бизнес-правила сам."}, {"q": "**Что AI умеет, а что не умеет, по схеме урока?**", "a": "Умеет: генерировать текст, отвечать на вопросы, обрабатывать данные. Не умеет: принимать решения о доступе, контролировать поток приложения, применять бизнес-правила."}, {"q": "**Назови 3 уровня, из которых состоит рабочее AI-приложение.**", "a": "API (получение/отправка данных), AI (обработка текста/генерация), Ручная логика (роли, доступ, бизнес-правила) — только совместная работа всех трёх уровней даёт управляемую и надёжную систему."}, {"q": "**Что вернёт эта функция, если запрос к API упадёт с ошибкой сети?**\n```js\nasync function getProducts() {\n  try {\n    const response = await axios.get('https://api.example.com/products');\n    const products = response.data;\n    return products;\n  } catch (error) {\n    console.error('Ошибка запроса:', error.message);\n    return [];\n  }\n}\n```", "a": "Пустой массив `[]` — ошибка перехватывается в `catch`, логируется через `console.error`, и функция возвращает безопасное значение по умолчанию вместо падения программы."}, {"q": "**Что вернёт `checkAccess({ role: \"editor\" }, \"delete\")` и почему?**\n```js\nfunction checkAccess(user, action) {\n  if (user.role === 'admin') return true;\n  if (user.role === 'editor' && action !== 'delete') return true;\n  return false;\n}\n```", "a": "`false` — первое условие (`admin`) не выполняется, второе выполняется только частично (роль editor, но `action === 'delete'`, значит `action !== 'delete'` ложно), и функция доходит до `return false`."}, {"q": "**Может ли AI-модель сама решить, вызывать ли `checkAccess` перед действием пользователя?**", "a": "Нет — AI не имеет доступа к данным о ролях и не может принять такое решение самостоятельно. Проверку прав всегда пишет разработчик вручную в коде, до или вокруг любого вызова AI."}, {"q": "**Зачем на раннем этапе разработки хранить пользователей в обычном JS-массиве, а не в настоящей БД?**", "a": "Это позволяет быстро прототипировать логику без настройки полноценной базы данных. Плюсы: быстро, просто, нет зависимостей. Ограничения: данные не сохраняются между запусками, подход не масштабируется."}, {"q": "**Что вернёт `getUserById(5)`, если такого id нет в массиве?**\n```js\nconst users = [\n  { id: 1, name: \"Анна\", role: \"admin\" },\n  { id: 2, name: \"Борис\", role: \"editor\" },\n  { id: 3, name: \"Вера\", role: \"guest\" }\n];\nfunction getUserById(id) {\n  return users.find(u => u.id === id);\n}\n```", "a": "`undefined` — метод `find()` возвращает `undefined`, если ни один элемент не подошёл под условие."}, {"q": "**Собери по памяти: 3 итога занятия «Custom AI Logic».**", "a": "1) AI обрабатывает текст и данные — это его зона ответственности. 2) Логика управления (роли, доступ, бизнес-правила) прописывается разработчиком вручную в коде. 3) Только связка API + AI + ручная логика вместе даёт управляемую и надёжную систему."}, {"q": "**Почему нельзя просто попросить AI «не давать доступ пользователям без прав» вместо того, чтобы писать `checkAccess` в коде?**", "a": "AI не знает, кто пользователь, какие у него права и что должно произойти дальше в приложении — он не хранит и не проверяет состояние системы. Контроль действий пользователя — ответственность разработчика, а не модели."}, {"q": "**В сравнении ролей из «Access Control» (user/manager/admin) и «Custom AI Logic» (admin/editor/guest) — что общего в логике проверки?**", "a": "И там, и там проверка идёт по одному и тому же принципу: сначала самая привилегированная роль получает полный доступ, затем более ограниченная роль получает часть прав (без удаления), а роли без явного разрешения получают отказ по умолчанию (`throw new Error` или `return false`)."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с этим кодом?**\n```js\nfunction checkAccess(user, action) {\n  if (user.role = 'admin') {\n    return true;\n  }\n  return false;\n}\n```", "a": "`user.role = 'admin'` — это оператор ПРИСВАИВАНИЯ (`=`), а не сравнения (`===`). Код случайно перезапишет роль пользователя на `'admin'`, и условие всегда будет истинным — серьёзная дыра в безопасности."}, {"q": "**Почему принцип «Никогда не доверяйте данным, пришедшим с клиента» особенно важен именно для проверки роли?**", "a": "Потому что роль определяет, что пользователю разрешено делать. Если проверять роль, присланную самим клиентом (например, из тела запроса), пользователь может просто отправить `{ role: \"admin\" }` и получить полный доступ. Роль нужно определять на сервере — например, по токену авторизации, а не по данным из запроса."}, {"q": "**Какие 3 зоны ответственности выделяет схема «Связка компонентов системы»?**", "a": "Управление поведением (что происходит при каждом действии пользователя), принятие решений (ветвление логики на основе данных, ролей и контекста), бизнес-правила (ограничения доступа, валидация, политики приложения)."}, {"q": "**Guest-пользователь в примере из «Custom AI Logic» — какой у него доступ по умолчанию?**", "a": "Доступ запрещён по умолчанию — в отличие от admin (полный доступ) и editor (чтение и редактирование без удаления), guest не получает никаких прав, если это явно не разрешено в коде."}, {"q": "**В чём смысл фразы «Авторизация всегда следует после успешной аутентификации»?**", "a": "Сначала система должна узнать, кто пользователь (аутентификация — логин/пароль), и только потом решать, что ему разрешено делать (авторизация). Проверять права до того, как известна личность пользователя, не имеет смысла."}, {"q": "**Менеджер попытался удалить запись через API, но получил отказ. Почему, судя по таблице ролей?**", "a": "Потому что в таблице ролей «Удаление записей» разрешено только Админу — у Менеджера доступа к удалению нет (❌), поэтому сервер отклоняет запрос независимо от того, что прислал клиент."}, {"q": "**Чем «объект-словарь с разрешениями» (permission map) удобнее длинной цепочки if?**", "a": "Легче добавлять новые роли — не нужно дописывать ещё один блок if/else, достаточно добавить новый ключ в объект. Код становится компактнее и легче читается при росте числа ролей."}, {"q": "**Собери по памяти структуру `checkAccess`: в каком порядке проверяются роли и почему?**", "a": "Сначала проверяется самая привилегированная роль (admin — полный доступ), затем более ограниченная (editor/manager — доступ без удаления), и в конце — запрет по умолчанию для всех остальных случаев (`return false` / `throw Error`). Порядок важен: от более широких прав к более узким."}, {"q": "**Что произойдёт с заголовком `Authorization: Bearer ${token}`, если `token === undefined`?**", "a": "Заголовок получится `Authorization: \"Bearer undefined\"` — сервер не сможет проверить валидный токен и, скорее всего, отклонит запрос как неавторизованный, даже если сам запрос синтаксически отправится."}, {"q": "**Почему в примере `getProducts()` обработка ошибок написана вручную, а не оставлена на AI?**", "a": "Потому что формат запроса и логика обработки ошибок — это зона ответственности разработчика. AI получает уже готовые данные ПОСЛЕ успешного запроса и не участвует в решении, что делать при сбое сети или сервера."}, {"q": "**Финальная связка: что нужно сделать ПЕРЕД вызовом AI, если действие требует проверки прав?**", "a": "Сначала проверить права пользователя на конкретное действие (например, через `checkAccess`), и только если доступ разрешён — обращаться к AI. AI никогда не должен быть «последней линией защиты» для проверки прав."}, {"q": "**Что означает принцип «доступ запрещён по умолчанию» в контексте безопасности?**", "a": "Если роль пользователя явно не даёт разрешения на действие, система должна ЗАПРЕТИТЬ его, а не разрешить «на всякий случай». Лучше по умолчанию отказать, чем случайно открыть доступ из-за ошибки в логике."}, {"q": "**НАЙДИ ОШИБКУ. Что не так с этой версией `checkAccess` по сравнению с оригиналом урока?**\n```js\nfunction checkAccess(user, action) {\n  if (user.role === 'admin' || user.role === 'editor') {\n    return true;\n  }\n  return false;\n}\n```", "a": "Здесь `editor` получает точно такие же права, как `admin`, — включая удаление (`delete`), хотя по условию editor должен читать и редактировать, но НЕ удалять. Нужна отдельная проверка `action !== 'delete'` именно для роли editor."}, {"q": "**Собери по памяти: у какой роли прав меньше всего (из двух уроков), и что ей разрешено?**", "a": "User (Access Control) или Guest (Custom AI Logic) — у user разрешён только просмотр данных, у guest доступ запрещён по умолчанию, то есть у guest прав ещё меньше, чем у user."}, {"q": "**Как можно описать роль AI в связке «API + AI + ручная логика» одним предложением?**", "a": "AI — это инструмент, который обрабатывает текст и данные внутри системы, но не управляет тем, что происходит вокруг него — этим занимается ручная логика, написанная разработчиком."}, {"q": "**Собери финальную формулу темы: где данные, где интеллект, где правила?**", "a": "API приносит данные, AI их обрабатывает и генерирует текст, а ручная логика (роли, валидация, бизнес-правила) решает, что со всем этим делать — и именно ручная логика остаётся «в руках» разработчика."}, {"q": "**Простой пример из практики: что выведет?**\n```js\nconst autenticatedUser = { name: 'Alex', role: 'USER' };\nif (autenticatedUser.role === 'ADMIN') {\n  console.log('Удаление данных разрешено');\n} else {\n  console.log('Операция запрещена!');\n}\n```", "a": "`Операция запрещена!` — роль пользователя `\"USER\"`, а не `\"ADMIN\"`, поэтому условие ложно."}, {"q": "**Почему проверка роли прямо внутри `if` в основном коде (как в примере выше) считается плохой практикой, даже если работает правильно?**", "a": "Логика проверки прав «хардкодится» прямо в бизнес-коде вместо отдельной функции — её нельзя переиспользовать, тяжело поддерживать, и легко забыть повторить такую же проверку в другом месте программы. Правильнее выделить отдельную функцию, например `canDelete(user)`."}, {"q": "**Собери по памяти: 3 версии функции проверки роли (`canUpdate`) от худшей к лучшей — как каждая проверяет ADMIN/MANAGER?**", "a": "Версия 1 — цепочка отдельных `if` с `return true` для каждой роли по очереди. Версия 2 — одно условие через `||` (`user.role===\"ADMIN\" || user.role===\"MANAGER\"`). Версия 3 (лучшая) — `['ADMIN','MANAGER'].includes(user.role)`: компактно и легко расширяется новыми ролями."}, {"q": "**Почему `['ADMIN','MANAGER'].includes(user.role)` считается лучшим решением, чем цепочка `if`?**", "a": "Код короче и читается как «роль входит в список разрешённых», а не как последовательность отдельных проверок. Чтобы добавить новую роль, достаточно дописать строку в массив — логику функции трогать не нужно."}, {"q": "**Что делает `updatePriceProduct(productId, newPrice, userId)` по шагам в этом примере?**\n```js\nfunction updatePriceProduct(productId, newPrice, userId){\n    const product=findProductById(productId);\n    const user = findUserById(userId);\n    if (!product || !user) { return; }\n    if (canUpdateProduct(user)) {\n        product.price = newPrice;\n    } else {\n        console.log(\"Операция запрещена!\");\n    }\n}\n```", "a": "1) Находит товар по id. 2) Находит пользователя по id. 3) Если товар или пользователь не найден — тихо завершает работу. 4) Если у пользователя есть право (`canUpdateProduct`) — меняет цену. Иначе выводит «Операция запрещена!»."}, {"q": "**НАЙДИ ОШИБКУ. Что будет, если вызвать `updatePriceProduct(999, 5, 1)` (товара с id=999 не существует)?**", "a": "Функция дойдёт до `if (!product || !user) return;` и просто тихо завершится — без изменений и без какого-либо сообщения об ошибке. Пользователь не узнает, что товар не найден — это можно считать недостатком дизайна (лучше вывести понятное сообщение)."}, {"q": "**Почему проверка роли (`canUpdateProduct`) в этом примере — отдельная функция, а не встроена прямо в `updatePriceProduct`?**", "a": "Разделение ответственности: `updatePriceProduct` отвечает за сам процесс обновления, а `canUpdateProduct` — только за проверку прав. Это позволяет тестировать и менять логику доступа отдельно от логики обновления данных."}, {"q": "**Из домашки про AI-повара: что делает `createBasePromptByRole(user)` — как меняется системный промпт в зависимости от роли?**", "a": "Если роль `ADMIN` — промпт просит AI составить список продуктов, которые НАДО ЗАКУПИТЬ (чего не хватает для блюда). Если роль обычная — промпт просит составить список продуктов, которые НАДО ИСПОЛЬЗОВАТЬ из уже имеющихся в холодильнике. Один и тот же AI-запрос даёт разный практический результат в зависимости от прав пользователя."}, {"q": "**Зачем в системе «AI-повар» вообще разделять промпт по ролям — какую бизнес-задачу это решает?**", "a": "ADMIN, вероятно, отвечает за закупки — ему нужен список того, что докупить. Обычный пользователь просто хочет приготовить блюдо из того, что уже есть — ему нужен список того, что использовать. Роль здесь определяет не доступ к данным, а то, какую именно помощь даёт AI."}, {"q": "**Собери по памяти 5 шагов полного процесса Custom AI Logic из теории: [API данные] → ? → ? → ? → ? → [Ответ]**", "a": "[API данные] → Валидация → Проверка ролей → Подготовка данных → AI запрос → Обработка ответа."}, {"q": "**Что делает этот код и почему он существует отдельно от проверки роли на использование AI?**\n```js\nlet safeProducts = products.filter(function(product) {\n  return product.isPublic;\n});\n```", "a": "Отфильтровывает только публичные товары ПЕРЕД тем, как передать их в AI — контролирует, какие данные AI вообще увидит. Это отдельная задача от вопроса «можно ли пользователю обращаться к AI вообще» (за это отвечает проверка роли)."}, {"q": "**НАЙДИ ОШИБКУ. Чем опасен этот код?**\n```js\naskAI(\"Delete all products\");\n```", "a": "AI не должен получать прямую команду на выполнение действия — он может «дать опасный совет», либо его ответ по ошибке интерпретируют как разрешение выполнить нежелательное действие. AI должен только анализировать/предлагать, а решение и выполнение остаются в ручной логике приложения."}, {"q": "**Назови 4 частых ошибки темы «Custom AI Logic» из конспекта.**", "a": "1) Отправлять все данные в AI (утечка информации). 2) Не проверять роль пользователя. 3) Доверять ответу AI без проверки. 4) Отсутствие фильтрации данных перед отправкой в AI."}, {"q": "**Назови 4 частых ошибки темы «Access Control» из конспекта.**", "a": "1) Не проверять роль (любой пользователь может выполнить действие). 2) Хардкод логики проверки везде в коде (трудно поддерживать). 3) Смешивать роли и данные (сложный код). 4) Отсутствие централизованной логики проверки (ошибки доступа)."}, {"q": "**Что делает `getProductsForUser(user, products)` — более полная версия комбинации роли и фильтрации?**\n```js\nfunction getProductsForUser(user, products) {\n  if (user.role === \"admin\") {\n    return products;\n  }\n  return products.filter(function(product) {\n    return product.isPublic;\n  });\n}\n```", "a": "Если пользователь admin — возвращает ВСЕ товары без ограничений. Если нет — только те, у которых `isPublic === true`. Функция объединяет проверку роли и фильтрацию данных в одном месте — удобно вызывать перед отправкой данных в AI или на экран."}, {"q": "**Собери по памяти: как правильно готовить prompt для AI с учётом доступа — назови 3 шага из практического примера.**", "a": "1) Отфильтровать данные под права пользователя (например, `safeProducts`). 2) Собрать из них текстовый context (например, через `.map().join(\", \")`). 3) Вставить этот context в prompt и только потом отправить запрос AI."}]}, {"title": "🧯 БЛОК 28. ОБРАБОТКА ОШИБОК (Error Handling)", "cards": [{"q": "**Что такое ошибка (error) простыми словами?**", "a": "Ситуация, при которой программа не может выполнить действие корректно — например, обратиться к несуществующему файлу, получить неожиданный тип данных или потерять соединение с сервером."}, {"q": "**Назови 3 типа ошибок из урока и коротко опиши каждый.**", "a": "Runtime Error — возникает во время выполнения программы. Syntax Error — неправильно написанный код. Logic Error — программа работает без сбоев, но даёт неверный результат."}, {"q": "**Чем Logic Error отличается от двух других типов ошибок принципиально?**", "a": "Runtime и Syntax Error останавливают программу явным сбоем/сообщением. Logic Error — самый коварный тип: программа выполняется без падений, просто выдаёт неверный результат, и заметить это можно только по факту неправильного поведения."}, {"q": "**Назови 3 преимущества, которые даёт грамотная обработка ошибок.**", "a": "1) Позволяет продолжить работу при возникновении проблемы. 2) Даёт возможность сообщить пользователю понятное сообщение (вместо белого экрана). 3) Позволяет записать ошибку в лог для отладки."}, {"q": "**Что произойдёт с программой без обработки ошибок, по описанию урока?**", "a": "Программа просто «падает» — пользователь видит белый экран или необъяснимый сбой, без понятного объяснения, что пошло не так."}, {"q": "**Назови 4 «горячие точки», где ошибки возникают особенно часто.**", "a": "Запросы к API (сервер недоступен, таймаут, 404/500), некорректный JSON (ответ не является валидным JSON), проблемы сети (пользователь офлайн, соединение прерывается), неверные данные (пользователь ввёл данные не того типа/формата)."}, {"q": "**Что делает конструкция try-catch одним предложением?**", "a": "Позволяет «обернуть» потенциально опасный код и обработать любую возникшую в нём ошибку, не давая программе упасть целиком."}, {"q": "**Что выведет этот код, если `userInput` — невалидный JSON?**\n```js\ntry {\n  const data = JSON.parse(userInput);\n  console.log(data);\n} catch (error) {\n  console.error('Ошибка разбора JSON:', error.message);\n}\n```", "a": "`Ошибка разбора JSON: <текст сообщения об ошибке>` — исключение из `JSON.parse` будет перехвачено в `catch`, и выполнение продолжится, а не упадёт всей программой."}, {"q": "**Какие 3 поля обычно есть у объекта ошибки, который получает `catch`?**", "a": "`message` (текст ошибки), `name` (тип/имя ошибки, например `SyntaxError`), `stack` (стек вызовов — где именно произошла ошибка)."}, {"q": "**Что произойдёт с блоком `catch`, если в блоке `try` ошибки не было?**", "a": "Блок `catch` просто пропускается — код внутри него не выполняется, программа продолжает работу после всей конструкции `try-catch`."}, {"q": "**Для чего нужен опциональный блок `finally` и когда он выполняется?**", "a": "`finally` выполняется ВСЕГДА, независимо от того, была ошибка или нет — удобно для закрытия соединений, освобождения ресурсов, очистки после операции."}, {"q": "**Собери по памяти 4 шага работы try-catch: Выполняется try → ? → ? → ?**", "a": "Выполняется try → (если) Происходит ошибка → Переход в catch → Продолжение работы (после catch/finally)."}, {"q": "**Зачем иногда выбрасывать ошибку вручную через `throw new Error(...)`, если JavaScript сам её не обнаружил?**", "a": "Бывают логические проблемы, которые JS не считает синтаксической или runtime-ошибкой (например, функция получила `null` вместо числа) — но для бизнес-логики это ошибка. `throw` явно сигнализирует об этом и делает контракт функции понятным для других разработчиков."}, {"q": "**Что выведет этот код?**\n```js\nfunction divide(a, b) {\n  if (b === 0) {\n    throw new Error('Деление на ноль!');\n  }\n  return a / b;\n}\nconsole.log(divide(10, 0));\n```", "a": "Программа выбросит исключение `Error: Деление на ноль!` — если этот вызов не обёрнут в `try-catch`, программа «упадёт» с этой ошибкой."}, {"q": "**НАЙДИ ОШИБКУ. Что не так, если вызвать `divide` без try-catch там, где `b` может быть 0 по вводу пользователя?**\n```js\nconst result = divide(userA, userB);\nconsole.log(result);\n```", "a": "Если `userB === 0`, вызов `divide` выбросит ошибку, и без `try-catch` вокруг этого места программа упадёт целиком — нужно обернуть вызов в `try { ... } catch (error) { ... }`."}, {"q": "**Назови 3 причины, зачем throw делает код «предсказуемым» (по итогам урока).**", "a": "1) Ошибка будет поймана ближайшим `catch`. 2) Сообщение станет информативным — понятно, что именно пошло не так. 3) Код станет предсказуемым — контракт функции явно говорит, при каких условиях будет ошибка."}, {"q": "**В типичном паттерне обработки ошибок Axios — что означает `error.response`?**", "a": "Сервер ОТВЕТИЛ, но с кодом ошибки (например, 404 или 500) — соединение было, запрос дошёл, но сервер вернул неуспешный статус."}, {"q": "**Что означает `error.request` (без `.response`) в обработке ошибок Axios?**", "a": "Запрос был отправлен, но ответа от сервера не пришло вообще (например, сервер недоступен или истёк таймаут) — в отличие от `error.response`, где ответ был, просто с ошибкой."}, {"q": "**Когда сработает третья ветка (`else { console.error('Ошибка запроса:', error.message) }`) в паттерне обработки Axios-ошибок?**", "a": "Когда проблема возникла ещё ДО отправки запроса — например, неправильно сформирован сам запрос (ошибка в коде, а не в сети или на сервере)."}, {"q": "**Собери по памяти полный паттерн обработки ошибок Axios (3 ветки) по образцу из урока.**", "a": "```js\ntry {\n  const response = await axios.get(url);\n  return response.data;\n} catch (error) {\n  if (error.response) {\n    // сервер ответил с ошибкой\n  } else if (error.request) {\n    // запрос ушёл, ответа нет\n  } else {\n    // ошибка при формировании запроса\n  }\n}\n```"}, {"q": "**НАЙДИ ОШИБКУ. В чём проблема этой функции запроса к серверу?**\n```js\nasync function fetchUser(id) {\n  const response = await axios.get(`/api/users/${id}`);\n  return response.data;\n}\n```", "a": "Нет `try-catch` вокруг `await axios.get(...)`. Если сервер недоступен или вернёт ошибку, вызов выбросит исключение, и без обработки оно «всплывёт» наверх непойманным — программа (или вызывающий код) может упасть."}, {"q": "**Собери по памяти: 4 итога занятия «Обработка ошибок».**", "a": "1) Понять природу ошибок — они неизбежны, важно их предвидеть. 2) Использовать try-catch — перехватывать и обрабатывать все опасные операции. 3) Выбрасывать throw — явно сигнализировать о логических проблемах. 4) Применять на практике — особенно при работе с API и внешними данными."}, {"q": "**Что значит финальная фраза урока: «Надёжный код — это не тот, в котором нет ошибок, а тот, который умеет с ними справляться»?**", "a": "Ошибки неизбежны в реальных приложениях (сеть нестабильна, пользователи вводят что угодно) — цель не «написать код без единой ошибки», а построить код так, чтобы он предсказуемо и без падений реагировал на любые сбои."}, {"q": "**Что выведет этот код, если `weatherResponse.ok === false` (проверка статуса fetch)?**\n```js\nconst weatherResponse = await fetch(url);\nif (!weatherResponse.ok) {\n  throw new Error(`Ошибка получения погоды: ${weatherResponse.status}`);\n}\n```", "a": "Будет выброшена ошибка вида `Ошибка получения погоды: 404` (или другой код статуса) — в отличие от axios, `fetch` НЕ выбрасывает ошибку сам при статусах 4xx/5xx, поэтому нужно проверять `response.ok` вручную и делать `throw` самостоятельно."}, {"q": "**Чем поведение `fetch` при ошибке HTTP-статуса (404/500) отличается от поведения `axios`?**", "a": "`axios` сам выбрасывает исключение при статусах 4xx/5xx (его можно перехватить в `catch`). `fetch` НЕ выбрасывает ошибку сама по себе на такие статусы — `response.ok` будет `false`, и разработчику нужно самому это проверить и сделать `throw`, иначе ошибка останется незамеченной."}, {"q": "**НАЙДИ ОШИБКУ. Какую типичную ошибку API совершает этот код (не проверяя fetch-статус)?**\n```js\nconst response = await fetch(url);\nconst data = await response.json();\nconsole.log(data);\n```", "a": "Не проверяется `response.ok` перед разбором JSON. Если сервер вернул 404/500, `fetch` не выбросит ошибку сама — код попытается распарсить тело ответа (возможно, страницу с текстом ошибки) как JSON, что приведёт к путанице или к ошибке разбора JSON вместо понятного сообщения об HTTP-ошибке."}, {"q": "**Какая ошибка произойдёт, если попытаться `JSON.parse` то, что не является валидным JSON (например, HTML-страницу с ошибкой 404)?**", "a": "`SyntaxError` — `JSON.parse` не сможет разобрать невалидную JSON-строку и выбросит исключение синтаксической ошибки, которое нужно перехватывать через `try-catch`."}, {"q": "**Почему error handling особенно важен именно «при работе с API и внешними данными» (по итогу урока)?**", "a": "Потому что внешние данные (ответы сервера, ввод пользователя, файлы) — это то, что программа НЕ контролирует напрямую: сервер может быть недоступен, пользователь может ввести что угодно, файл может отсутствовать. Всё это — источники непредсказуемых ошибок, которые нужно уметь перехватывать."}, {"q": "**Собери по памяти: разница между тем, что делает `catch`, и тем, что делает `finally`.**", "a": "`catch` выполняется ТОЛЬКО если в `try` произошла ошибка — обрабатывает саму проблему. `finally` выполняется ВСЕГДА (было исключение или нет) — используется для действий, которые обязательно нужно сделать в любом случае (закрыть файл, освободить ресурс)."}, {"q": "**Что не так с этим кодом, если задача — не дать программе упасть при неверном вводе пользователя?**\n```js\nfunction parseAge(input) {\n  return JSON.parse(input);\n}\nconsole.log(parseAge(userInput));\n```", "a": "Нет обработки ошибок вообще — если `userInput` не является валидным JSON, `JSON.parse` выбросит `SyntaxError`, и без `try-catch` вокруг вызова (или внутри функции) программа упадёт."}, {"q": "**Как правильно переписать `parseAge` из прошлой карточки, чтобы она не «падала», а возвращала, например, `null` при ошибке?**", "a": "```js\nfunction parseAge(input) {\n  try {\n    return JSON.parse(input);\n  } catch (error) {\n    console.error('Некорректный ввод:', error.message);\n    return null;\n  }\n}\n```"}, {"q": "**Собери по памяти: 4 «горячие точки» ошибок — с чем конкретно там может пойти что-то не так?**", "a": "Запросы к API (сервер недоступен, таймаут, 404/500), некорректный JSON (ответ не парсится), проблемы сети (офлайн, разрыв соединения), неверные данные от пользователя (не тот тип/формат)."}, {"q": "**Что означает фраза «throw делает контракт функции явным»?**", "a": "Функция явно «документирует» через `throw`, при каких условиях она откажется работать (например, `divide` явно говорит: «я выброшу ошибку, если b === 0») — это понятнее для других разработчиков, чем молчаливое неправильное поведение."}, {"q": "**Почему НЕЛЬЗЯ просто «игнорировать» пойманную ошибку — например, оставить пустой `catch`?**\n```js\ntry {\n  riskyOperation();\n} catch (error) {\n  // ничего не делаем\n}\n```", "a": "Хотя программа не упадёт, ошибка останется полностью незамеченной — не будет ни сообщения пользователю, ни записи в лог. Проблему невозможно будет отладить, а пользователь может решить, что операция прошла успешно, хотя это не так."}, {"q": "**Собери финальную формулу темы: какие 2 инструмента даёт JavaScript для работы с ошибками, и в чём разница между ними?**", "a": "`try-catch` — перехватывает ошибки, которые УЖЕ произошли (в том числе неожиданные). `throw` — позволяет самому СОЗДАТЬ ошибку там, где JavaScript её не обнаружил бы сам, но по бизнес-логике это проблема."}]}]</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('cards-data').textContent);

  /* ===================== PRACTICE MODE ===================== */

  const MOCK_DB = {
    posts: [
      { id: 1, userId: 1, title: "Hello World" },
      { id: 2, userId: 1, title: "JS Basics" },
      { id: 3, userId: 2, title: "Learning Loops" }
    ],
    users: [
      { id: 1, name: "Ivan", email: "ivan@example.com", age: 20 },
      { id: 2, name: "Anna", email: "anna@example.com", age: 17 },
      { id: 3, name: "Oleg", email: "oleg@example.com", age: 25 }
    ],
    roleUsers: [
      { id: 1, name: "Анна", role: "admin" },
      { id: 2, name: "Борис", role: "editor" },
      { id: 3, name: "Вера", role: "guest" }
    ]
  };

  function mockFetchImpl(url) {
    const key = String(url).replace(/^\//, "");
    const data = MOCK_DB[key];
    return Promise.resolve({ json: function () { return Promise.resolve(data); } });
  }
  function mockPostImpl(url, body) {
    return Promise.resolve(Object.assign({ id: 1 }, body));
  }
  function waitImpl() { return Promise.resolve(); }

  const PRACTICE = [
    { exercises: [
      { fn: "sumRange",
        prompt: "Напиши функцию `sumRange(n)`, которая с помощью цикла `for` считает сумму всех чисел от 1 до `n` включительно.\n\nПример: `sumRange(5)` → `15` (1+2+3+4+5).",
        starter: "function sumRange(n) {\n  let total = 0;\n  // твой код здесь\n\n  return total;\n}",
        solution: "function sumRange(n) {\n  let total = 0;\n  for (let i = 1; i <= n; i++) {\n    total += i;\n  }\n  return total;\n}",
        tests: [{ args: [5], expected: 15 }, { args: [1], expected: 1 }, { args: [10], expected: 55 }] },
      { fn: "countEven",
        prompt: "Напиши функцию `countEven(arr)`, которая считает, сколько чётных чисел в массиве `arr` (используй цикл `for` или `for...of`).\n\nПример: `countEven([1,2,3,4,5,6])` → `3`.",
        starter: "function countEven(arr) {\n  let count = 0;\n  // твой код здесь\n\n  return count;\n}",
        solution: "function countEven(arr) {\n  let count = 0;\n  for (let num of arr) {\n    if (num % 2 === 0) count++;\n  }\n  return count;\n}",
        tests: [{ args: [[1,2,3,4,5,6]], expected: 3 }, { args: [[1,3,5]], expected: 0 }, { args: [[2,4,6,8]], expected: 4 }] },
      { fn: "reverseArrayManual",
        prompt: "Напиши функцию `reverseArrayManual(arr)`, которая переворачивает массив с помощью цикла (не используя встроенный `.reverse()`).\n\nПример: `reverseArrayManual([1,2,3])` → `[3,2,1]`.",
        starter: "function reverseArrayManual(arr) {\n  let result = [];\n  // твой код здесь\n\n  return result;\n}",
        solution: "function reverseArrayManual(arr) {\n  let result = [];\n  for (let i = arr.length - 1; i >= 0; i--) {\n    result.push(arr[i]);\n  }\n  return result;\n}",
        tests: [{ args: [[1,2,3]], expected: [3,2,1] }, { args: [["a","b"]], expected: ["b","a"] }] },
      { fn: "findMax",
        prompt: "Напиши функцию `findMax(arr)`, которая находит максимальное число в массиве с помощью цикла (без `Math.max`).\n\nПример: `findMax([3,7,2,9,4])` → `9`.",
        starter: "function findMax(arr) {\n  let max = arr[0];\n  // твой код здесь\n\n  return max;\n}",
        solution: "function findMax(arr) {\n  let max = arr[0];\n  for (let i = 1; i < arr.length; i++) {\n    if (arr[i] > max) max = arr[i];\n  }\n  return max;\n}",
        tests: [{ args: [[3,7,2,9,4]], expected: 9 }, { args: [[-1,-5,-2]], expected: -1 }] },
      { fn: "repeatString",
        prompt: "Напиши функцию `repeatString(str, times)`, которая с помощью цикла `while` возвращает строку `str`, повторённую `times` раз (без встроенного `.repeat()`).\n\nПример: `repeatString(\"ab\", 3)` → `\"ababab\"`.",
        starter: "function repeatString(str, times) {\n  let result = \"\";\n  let i = 0;\n  // твой код здесь (цикл while)\n\n  return result;\n}",
        solution: "function repeatString(str, times) {\n  let result = \"\";\n  let i = 0;\n  while (i < times) {\n    result += str;\n    i++;\n  }\n  return result;\n}",
        tests: [{ args: ["ab",3], expected: "ababab" }, { args: ["x",1], expected: "x" }] },
      { fn: "fizzBuzzArray",
        prompt: "Напиши функцию `fizzBuzzArray(n)`, которая возвращает массив чисел от 1 до `n`, заменяя числа кратные 3 на `\"Fizz\"`, кратные 5 — на `\"Buzz\"`, а кратные и 3, и 5 — на `\"FizzBuzz\"`.\n\nПример: `fizzBuzzArray(5)` → `[1, 2, \"Fizz\", 4, \"Buzz\"]`.",
        starter: "function fizzBuzzArray(n) {\n  let result = [];\n  for (let i = 1; i <= n; i++) {\n    // твой код здесь\n  }\n  return result;\n}",
        solution: "function fizzBuzzArray(n) {\n  let result = [];\n  for (let i = 1; i <= n; i++) {\n    if (i % 15 === 0) result.push(\"FizzBuzz\");\n    else if (i % 3 === 0) result.push(\"Fizz\");\n    else if (i % 5 === 0) result.push(\"Buzz\");\n    else result.push(i);\n  }\n  return result;\n}",
        tests: [{ args: [5], expected: [1,2,"Fizz",4,"Buzz"] }, { args: [15], expected: [1,2,"Fizz",4,"Buzz","Fizz",7,8,"Fizz","Buzz",11,"Fizz",13,14,"FizzBuzz"] }] }
    ]},
    { exercises: [
      { fn: "calculateTotal",
        prompt: "Напиши функцию `calculateTotal(price, quantity)`, которая возвращает общую стоимость (`price * quantity`).\n\nПример: `calculateTotal(100, 3)` → `300`.",
        starter: "function calculateTotal(price, quantity) {\n  // твой код здесь\n}",
        solution: "function calculateTotal(price, quantity) {\n  return price * quantity;\n}",
        tests: [{ args: [100,3], expected: 300 }, { args: [50,2], expected: 100 }] },
      { fn: "greet",
        prompt: "Напиши функцию `greet(name)`, которая возвращает строку `\"Hello, <имя>!\"`.\n\nПример: `greet(\"Ivan\")` → `\"Hello, Ivan!\"`.",

        prompt: "Напиши функцию `safeJsonParse(str)`: попробуй разобрать строку через `JSON.parse` внутри `try`. Если всё получилось — верни результат. Если `JSON.parse` выбросил ошибку — поймай её в `catch` и верни `null`.",
        starter: "function safeJsonParse(str) {\n  // твой код здесь (try/catch)\n}",
        solution: "function safeJsonParse(str) {\n  try {\n    return JSON.parse(str);\n  } catch (error) {\n    return null;\n  }\n}",
        tests: [
          { args: ["{\"a\":1}"], expected: {a:1} },
          { args: ["not json"], expected: null },
          { args: ["[1,2,3]"], expected: [1,2,3] }
        ] },
      { fn: "safeDivideOrMessage",
        prompt: "Напиши функцию `safeDivideOrMessage(a, b)` (как пример `divide` из урока «Обработка ошибок»): внутри `try`, если `b === 0` — сделай `throw new Error('Деление на ноль!')`, иначе верни `a / b`. В `catch` верни `error.message` (текст ошибки) вместо того, чтобы дать программе упасть.",
        starter: "function safeDivideOrMessage(a, b) {\n  try {\n    // твой код здесь\n  } catch (error) {\n    return error.message;\n  }\n}",
        solution: "function safeDivideOrMessage(a, b) {\n  try {\n    if (b === 0) {\n      throw new Error('Деление на ноль!');\n    }\n    return a / b;\n  } catch (error) {\n    return error.message;\n  }\n}",
        tests: [
          { args: [10, 2], expected: 5 },
          { args: [10, 0], expected: "Деление на ноль!" },
          { args: [9, 3], expected: 3 }
        ] },
      { fn: "classifyAxiosError",
        prompt: "Напиши функцию `classifyAxiosError(error)` по паттерну обработки ошибок Axios из урока: если у `error` есть поле `response` — верни `\"server-error\"`. Если есть `request` (но нет `response`) — верни `\"no-response\"`. Иначе верни `\"request-error\"`.",
        starter: "function classifyAxiosError(error) {\n  // твой код здесь\n}",
        solution: "function classifyAxiosError(error) {\n  if (error.response) return \"server-error\";\n  if (error.request) return \"no-response\";\n  return \"request-error\";\n}",
        tests: [
          { args: [{response:{status:404}}], expected: "server-error" },
          { args: [{request:{}}], expected: "no-response" },
          { args: [{message:"bad config"}], expected: "request-error" }
        ] },
      { fn: "describeFetchResult",
        prompt: "Напиши функцию `describeFetchResult(response)`: `response` — объект вида `{ ok, status, data }`, имитирующий ответ `fetch`. Если `response.ok` ложно — верни `{ error: \"Ошибка запроса: \" + response.status }`. Если `response.ok` истинно — верни `response.data`.",
        starter: "function describeFetchResult(response) {\n  // твой код здесь\n}",
        solution: "function describeFetchResult(response) {\n  if (!response.ok) {\n    return { error: \"Ошибка запроса: \" + response.status };\n  }\n  return response.data;\n}",
        tests: [
          { args: [{ok:true,status:200,data:{name:"Ivan"}}], expected: {name:"Ivan"} },
          { args: [{ok:false,status:404}], expected: {error:"Ошибка запроса: 404"} },
          { args: [{ok:false,status:500}], expected: {error:"Ошибка запроса: 500"} }
        ] },
      { fn: "parsePositiveAge",
        prompt: "Напиши функцию `parsePositiveAge(input)`: преобразуй `input` в число (`Number(...)`). Если получилось `NaN` — выбрось `throw new Error(\"Некорректный возраст: не число\")`. Если число отрицательное — выбрось `throw new Error(\"Некорректный возраст: отрицательное число\")`. Иначе верни число. Обе ошибки лови в `catch` и возвращай `error.message`.",
        starter: "function parsePositiveAge(input) {\n  try {\n    // твой код здесь\n  } catch (error) {\n    return error.message;\n  }\n}",
        solution: "function parsePositiveAge(input) {\n  try {\n    const age = Number(input);\n    if (Number.isNaN(age)) {\n      throw new Error(\"Некорректный возраст: не число\");\n    }\n    if (age < 0) {\n      throw new Error(\"Некорректный возраст: отрицательное число\");\n    }\n    return age;\n  } catch (error) {\n    return error.message;\n  }\n}",
        tests: [
          { args: ["25"], expected: 25 },
          { args: ["abc"], expected: "Некорректный возраст: не число" },
          { args: ["-5"], expected: "Некорректный возраст: отрицательное число" }
        ] },
      { fn: "logAndRecover",
        prompt: "Напиши функцию `logAndRecover(operations)`: `operations` — массив функций без аргументов. Для каждой функции из массива: вызови её в `try`, и если получилось — добавь в результат `{ ok: true, value: <результат> }`; если функция выбросила ошибку — поймай в `catch` и добавь `{ ok: false, error: error.message }`. Верни массив результатов в том же порядке.",
        starter: "function logAndRecover(operations) {\n  const results = [];\n  for (const op of operations) {\n    try {\n      // твой код здесь\n    } catch (error) {\n      // твой код здесь\n    }\n  }\n  return results;\n}",
        solution: "function logAndRecover(operations) {\n  const results = [];\n  for (const op of operations) {\n    try {\n      const value = op();\n      results.push({ ok: true, value: value });\n    } catch (error) {\n      results.push({ ok: false, error: error.message });\n    }\n  }\n  return results;\n}",
        tests: [
          { args: [[function () { return 1 + 1; }, function () { throw new Error("бум"); }, function () { return "ok"; }]], expected: [{ok:true,value:2},{ok:false,error:"бум"},{ok:true,value:"ok"}] }
        ] }
    ]}
  ];

  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a === "number" && typeof b === "number" && Number.isNaN(a) && Number.isNaN(b)) return true;
    if (a === null || b === null || typeof a !== "object" || typeof b !== "object") return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const aKeys = Object.keys(a), bKeys = Object.keys(b);
    if (aKeys.length !== bKeys.length) return false;
    for (const k of aKeys) {
      if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
      if (!deepEqual(a[k], b[k])) return false;
    }
    return true;
  }

  function fmtVal(v) {
    if (v === undefined) return "undefined";
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  async function runExercise(ex, code) {
    let fn;
    try {
      const factory = new Function("mockData", "mockFetch", "mockPost", "wait",
        code + "\n;return typeof " + ex.fn + " !== 'undefined' ? " + ex.fn + " : undefined;");
      fn = factory(ex.mockData || {}, mockFetchImpl, mockPostImpl, waitImpl);
    } catch (e) {
      return { ok: false, message: "💥 Ошибка в коде: " + e.message };
    }
    if (typeof fn !== "function") {
      return { ok: false, message: "Не нашёл функцию `" + ex.fn + "`. Проверь, что ты назвал её именно так." };
    }
    for (const t of ex.tests) {
      let actual;
      try {
        actual = fn.apply(null, t.args);
        if (ex.isAsync || (actual && typeof actual.then === "function")) {
          actual = await actual;
        }
      } catch (e) {
        return { ok: false, message: "💥 Ошибка при вызове " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + "): " + e.message };
      }
      if (!deepEqual(actual, t.expected)) {
        return { ok: false, message: "❌ " + ex.fn + "(" + t.args.map(fmtVal).join(", ") + ") вернул " + fmtVal(actual) + ", а ожидалось " + fmtVal(t.expected) };
      }
    }
    return { ok: true, message: "✅ Все проверки пройдены (" + ex.tests.length + ")! Отличная работа." };
  }

  /* =================== END PRACTICE DATA ==================== */

  function makeQueue(n) { const q = []; for (let i = 0; i < n; i++) q.push(i); return q; }

  const state = {
    blockIndex: 0,
    streak: 0,
    mode: 'theory',
    blocks: DATA.map(b => ({
      queue: makeQueue(b.cards.length),
      mastered: 0,
      total: b.cards.length,
      done: false
    })),
    practice: PRACTICE.map(b => ({
      pointer: 0,
      passed: 0,
      total: b.exercises.length,
      done: false,
      codes: b.exercises.map(ex => ex.starter)
    }))
  };

  const tabsEl = document.getElementById('tabs');
  const modeSub = document.getElementById('modeSub');
  const modeTabs = document.querySelectorAll('.mode-tab');
  const practiceView = document.getElementById('practiceView');
  const practiceEyebrow = document.getElementById('practiceEyebrow');
  const promptText = document.getElementById('promptText');
  const codeEditor = document.getElementById('codeEditor');
  const feedback = document.getElementById('feedback');
  const solutionBox = document.getElementById('solutionBox');
  const celebratePractice = document.getElementById('celebratePractice');
  const celebratePracticeStats = document.getElementById('celebratePracticeStats');
  const practiceNavRow = document.getElementById('practiceNavRow');
  const runBtn = document.getElementById('runBtn');
  const againPracticeBtn = document.getElementById('againPracticeBtn');
  const practiceLinks = document.getElementById('practiceLinks');
  const skipBtn = document.getElementById('skipBtn');
  const solutionBtn = document.getElementById('solutionBtn');
  const restartCodeBtn = document.getElementById('restartCodeBtn');
  const cardEyebrow = document.getElementById('cardEyebrow');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const aWrap = document.getElementById('aWrap');
  const blurHint = document.getElementById('blurHint');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const forgotBtn = document.getElementById('forgotBtn');
  const knowBtn = document.getElementById('knowBtn');
  const againBtn = document.getElementById('againBtn');
  const resetBtn = document.getElementById('resetBtn');
  const cardView = document.getElementById('cardView');
  const celebrate = document.getElementById('celebrate');
  const celebrateStats = document.getElementById('celebrateStats');
  const streakNum = document.getElementById('streakNum');
  const streakBox = document.getElementById('streakBox');

  function shortTitle(t) {
    const m = t.match(/БЛОК\s*(\d+)\.\s*([^\(]+)/);
    if (m) return m[1] + '. ' + m[2].trim();
    return t;
  }

  function render(str) {
    let s = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    s = s.replace(/```(?:\w+)?\n([\s\S]*?)```/g, function (m, code) { return '<pre><code>' + code.trim() + '</code></pre>'; });
    const preBlocks = [];
    s = s.replace(/<pre>[\s\S]*?<\/pre>/g, function (m) { preBlocks.push(m); return '\u0000PRE' + (preBlocks.length - 1) + '\u0000'; });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.split('\n').join('<br>');
    s = s.replace(/\u0000PRE(\d+)\u0000/g, function (m, idx) { return preBlocks[parseInt(idx, 10)]; });
    return s;
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    DATA.forEach((b, i) => {
      const st = state.mode === 'theory' ? state.blocks[i] : state.practice[i];
      const tab = document.createElement('div');
      tab.className = 'tab' + (i === state.blockIndex ? ' active' : '') + (st.done ? ' complete' : '');
      const badge = st.done ? '✅' : (state.mode === 'theory' ? (st.mastered + '/' + st.total) : (st.passed + '/' + st.total));
      tab.innerHTML = shortTitle(b.title) + ' <span class="count">' + badge + '</span>';
      tab.addEventListener('click', () => { state.blockIndex = i; renderActive(); });
      tabsEl.appendChild(tab);
    });
  }

  function renderActive() {
    if (state.mode === 'theory') renderCard(); else renderPractice();
  }

  function currentBlock() { return DATA[state.blockIndex]; }
  function currentState() { return state.blocks[state.blockIndex]; }
  function currentPracticeBlock() { return PRACTICE[state.blockIndex]; }
  function currentPracticeState() { return state.practice[state.blockIndex]; }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderCard() {
    const block = currentBlock();
    const st = currentState();
    renderTabs();

    if (st.queue.length === 0) {
      cardView.style.display = 'none';
      celebrate.classList.add('show');
      forgotBtn.style.display = 'none';
      knowBtn.style.display = 'none';
      againBtn.style.display = 'block';
      celebrateStats.textContent = st.total + ' карточек в этом блоке — все знаешь. Стрик: ' + state.streak;
      progressFill.style.width = '100%';
      progressLabel.textContent = st.total + ' / ' + st.total;
      st.done = true;
      renderTabs();
      return;
    }

    cardView.style.display = 'flex';
    celebrate.classList.remove('show');
    againBtn.style.display = 'none';

    const ci = st.queue[0];
    const card = block.cards[ci];

    cardEyebrow.textContent = shortTitle(block.title) + ' · осталось ' + st.queue.length;
    qText.innerHTML = render(card.q);
    aText.innerHTML = render(card.a);
    aWrap.classList.remove('shown');
    blurHint.style.display = 'block';
    forgotBtn.style.display = 'none';
    knowBtn.style.display = 'none';

    const doneCount = st.mastered;
    const pct = Math.round((doneCount / st.total) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = doneCount + ' / ' + st.total;
  }

  function reveal() {
    aWrap.classList.add('shown');
    blurHint.style.display = 'none';
    forgotBtn.style.display = 'flex';
    knowBtn.style.display = 'flex';
  }

  function bumpStreak(up) {
    if (up) { state.streak += 1; }
    else { state.streak = 0; }
    streakNum.textContent = state.streak;
    streakBox.classList.remove('pulse');
    void streakBox.offsetWidth;
    streakBox.classList.add('pulse');
  }

  function renderPractice() {
    const block = currentPracticeBlock();
    const st = currentPracticeState();
    renderTabs();

    if (st.pointer >= st.total) {
      practiceView.style.display = 'none';
      celebratePractice.classList.add('show');
      runBtn.style.display = 'none';
      againPracticeBtn.style.display = 'block';
      practiceLinks.style.display = 'none';
      celebratePracticeStats.textContent = st.passed + ' из ' + st.total + ' задач решено верно. Стрик: ' + state.streak;
      progressFill.style.width = Math.round((st.passed / st.total) * 100) + '%';
      progressLabel.textContent = st.passed + ' / ' + st.total;
      st.done = true;
      renderTabs();
      return;
    }

    practiceView.style.display = 'flex';
    celebratePractice.classList.remove('show');
    runBtn.style.display = 'flex';
    runBtn.disabled = false;
    runBtn.textContent = '▶ Проверить код';
    againPracticeBtn.style.display = 'none';
    practiceLinks.style.display = 'flex';

    const ex = block.exercises[st.pointer];
    practiceEyebrow.textContent = shortTitle(DATA[state.blockIndex].title) + ' · задача ' + (st.pointer + 1) + ' / ' + st.total;
    promptText.innerHTML = render(ex.prompt);
    codeEditor.value = st.codes[st.pointer];
    feedback.className = 'feedback';
    feedback.textContent = '';
    solutionBox.className = 'solution-box';
    solutionBox.innerHTML = '';

    const pct = Math.round((st.passed / st.total) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = st.passed + ' / ' + st.total;
  }

  function resetPracticeBlock() {
    const st = currentPracticeState();
    const block = currentPracticeBlock();
    st.pointer = 0;
    st.passed = 0;
    st.done = false;
    st.codes = block.exercises.map(ex => ex.starter);
    renderPractice();
  }

  cardView.addEventListener('click', function () {
    if (!aWrap.classList.contains('shown')) reveal();
  });

  forgotBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    const ci = st.queue.shift();
    const insertAt = Math.min(3, st.queue.length);
    st.queue.splice(insertAt, 0, ci);
    bumpStreak(false);
    renderCard();
  });

  knowBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    st.queue.shift();
    st.mastered += 1;
    bumpStreak(true);
    renderCard();
  });

  againBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentState();
    st.queue = makeQueue(st.total);
    st.mastered = 0;
    st.done = false;
    renderCard();
  });

  resetBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state.mode === 'theory') {
      const st = currentState();
      st.queue = makeQueue(st.total);
      st.mastered = 0;
      st.done = false;
      renderCard();
    } else {
      resetPracticeBlock();
    }
  });

  modeTabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const mode = btn.getAttribute('data-mode');
      if (mode === state.mode) return;
      state.mode = mode;
      modeTabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
      if (mode === 'theory') {
        practiceView.style.display = 'none';
        celebratePractice.classList.remove('show');
        practiceNavRow.style.display = 'none';
        practiceLinks.style.display = 'none';
        navRow.style.display = 'flex';
        modeSub.textContent = '📚 Тапни по карточке — открой ответ. Оцени себя честно.';
      } else {
        cardView.style.display = 'none';
        celebrate.classList.remove('show');
        navRow.style.display = 'none';
        practiceNavRow.style.display = 'flex';
        practiceLinks.style.display = 'flex';
        modeSub.textContent = '💻 Пиши код в поле и жми «Проверить» — тесты запускаются прямо в браузере.';
      }
      renderActive();
    });
  });

  runBtn.addEventListener('click', async function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const block = currentPracticeBlock();
    const ex = block.exercises[st.pointer];
    st.codes[st.pointer] = codeEditor.value;
    runBtn.disabled = true;
    runBtn.textContent = '⏳ Проверяю...';
    let result;
    try {
      result = await runExercise(ex, codeEditor.value);
    } catch (err) {
      result = { ok: false, message: '💥 Неожиданная ошибка: ' + err.message };
    }
    feedback.textContent = result.message;
    feedback.className = 'feedback show ' + (result.ok ? 'ok' : 'err');
    if (result.ok) {
      st.passed += 1;
      st.pointer += 1;
      bumpStreak(true);
      runBtn.disabled = true;
      setTimeout(renderPractice, 750);
    } else {
      runBtn.disabled = false;
      runBtn.textContent = '▶ Проверить код';
    }
  });

  skipBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    st.pointer += 1;
    renderPractice();
  });

  solutionBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const ex = currentPracticeBlock().exercises[st.pointer];
    solutionBox.innerHTML = '<strong style="color:var(--teal)">Решение:</strong><pre><code>' + escapeHtml(ex.solution) + '</code></pre>';
    solutionBox.className = 'solution-box show';
  });

  restartCodeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const st = currentPracticeState();
    const ex = currentPracticeBlock().exercises[st.pointer];
    st.codes[st.pointer] = ex.starter;
    codeEditor.value = ex.starter;
    feedback.className = 'feedback';
    solutionBox.className = 'solution-box';
  });

  againPracticeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    resetPracticeBlock();
  });

  codeEditor.addEventListener('input', function () {
    const st = currentPracticeState();
    st.codes[st.pointer] = codeEditor.value;
  });

  renderTabs();
  renderCard();
})();
</script>
</body>
</html>
